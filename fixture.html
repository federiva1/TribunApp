<style>
:root {
  --dark:  #0d0d1a;
  --dark2: #13131f;
  --celeste: #4fc3f7;
  --verde: #2ad572;
  --gold: #f5c518;
  --lib-light: #66bb6a;
  --lib-color: #1b5e20;
  --sud-light: #ffa726;
  --sud-color: #e65100;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

/* ===== HEADER ===== */
#site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 10px; gap: 12px;
  background: linear-gradient(180deg, rgba(79,195,247,0.12) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px);
}
.logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-wrap img { height: 52px; object-fit: contain; }
.header-chip {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--celeste); background: rgba(79,195,247,0.12);
  border: 1px solid rgba(79,195,247,0.3); border-radius: 6px; padding: 3px 8px;
}
@media (max-width: 430px) { .header-chip { display: none; } }
.header-actions { display: flex; gap: 8px; align-items: center; }
.header-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 7px 13px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px;
  color: rgba(255,255,255,0.85); cursor: pointer; text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.header-pill svg { width: 15px; height: 15px; flex-shrink: 0; }
.header-pill:hover { background: rgba(79,195,247,0.16); border-color: rgba(79,195,247,0.45); color: #fff; }
.header-pill.active { background: rgba(79,195,247,0.2); border-color: rgba(79,195,247,0.5); color: #fff; }
.header-pill-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px; }
@media (max-width: 560px) {
  .header-pill-label { display: none; }
  .header-pill { width: 36px; height: 36px; padding: 0; gap: 0; justify-content: center; }
  .header-actions { gap: 6px; }
}

/* ===== MAIN ===== */
#main { padding: 18px 16px 50px; max-width: 720px; margin: 0 auto; }

/* ===== FILTRO DE EQUIPO ===== */
.team-filter-row { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 18px; }
.team-filter-row label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px;
  text-transform: uppercase; color: rgba(255,255,255,0.4);
}
#team-filter {
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
  color: #fff; background: var(--dark2); border: 1px solid rgba(79,195,247,0.35);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; max-width: 240px;
}
#team-filter:focus { outline: none; border-color: var(--celeste); }

/* ===== TABS / SUB-TABS ===== */
.fase-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
.fase-tab {
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 9px 20px; cursor: pointer; transition: all 0.2s;
}
.fase-tab:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
.fase-tab.active { color: #fff; background: rgba(79,195,247,0.18); border-color: rgba(79,195,247,0.5); }

.copa-subtabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
.copa-subtab {
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 6px 16px; cursor: pointer; transition: all 0.2s;
}
.copa-subtab.lib.active { color: #fff; background: rgba(27,94,32,0.35); border-color: rgba(102,187,106,0.6); }
.copa-subtab.sud.active { color: #fff; background: rgba(230,81,0,0.25); border-color: rgba(255,167,38,0.6); }

/* ===== ACORDEÓN DE FECHA ===== */
.fecha-acc { margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.02); }
.fecha-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; background: none; border: none; text-align: left; transition: background 0.15s; }
.fecha-head:hover { background: rgba(255,255,255,0.03); }
.fecha-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: #fff; }
.fecha-estado { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 9px; border-radius: 20px; }
.fecha-estado.fin  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
.fecha-estado.live { background: rgba(42,213,114,0.15); border: 1px solid rgba(42,213,114,0.4); color: var(--verde); }
.fecha-estado.prox { background: rgba(79,195,247,0.12); border: 1px solid rgba(79,195,247,0.35); color: var(--celeste); }
.fecha-chevron { margin-left: auto; color: rgba(255,255,255,0.3); font-size: 14px; transition: transform 0.2s; }
.fecha-acc.colapsada .fecha-chevron { transform: rotate(-90deg); }
.fecha-body { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.fecha-acc.colapsada .fecha-body { display: none; }

/* ===== LISTA PLANA (equipo filtrado / copas) ===== */
.lista-plana { display: flex; flex-direction: column; gap: 8px; }
.copa-ronda-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
.copa-ronda-title.lib { color: var(--lib-light); }
.copa-ronda-title.sud { color: var(--sud-light); }

/* ===== TARJETA DE PARTIDO ===== */
.partido-card { display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 11px; padding: 9px 12px; border-left: 3px solid transparent; }
.partido-card.lib { border-left-color: rgba(102,187,106,0.55); }
.partido-card.sud { border-left-color: rgba(255,167,38,0.55); }
.partido-meta { display: flex; align-items: center; gap: 8px; }
.partido-meta .etq { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.4); }
.partido-meta .etq.leg { padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,0.06); }
.partido-hora { margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,0.35); }
.partido-hora.en-curso { color: var(--verde); font-weight: 600; }
.partido-hora.fin { color: rgba(255,255,255,0.3); }
.partido-fila { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.stats-link { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 3px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,0.06); font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--celeste, #4fc3f7); text-decoration: none; transition: color .15s; }
.stats-link:hover { color: #fff; }
.stats-link svg { width: 13px; height: 13px; }
.equipo-lado { display: flex; align-items: center; gap: 9px; text-decoration: none; min-width: 0; }
.equipo-lado.home { justify-content: flex-end; }
.equipo-lado.away { justify-content: flex-start; }
.equipo-lado img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
.escudo-ph { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.3px; color: rgba(255,255,255,0.6); }
.equipo-lado .nom { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.equipo-lado.link:hover .nom { color: #fff; }
.equipo-lado.ganador .nom { color: #fff; font-weight: 700; }
.equipo-lado.perdedor .nom { color: rgba(255,255,255,0.4); }
.marcador { display: flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; min-width: 54px; }
.marcador-goles { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; color: #fff; line-height: 1; }
.marcador-vs { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px; color: rgba(255,255,255,0.25); }
.marcador-pen { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 0.5px; color: var(--gold); }

#loading-state { text-align: center; padding: 60px 20px; }
.loading-msg { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,0.25); }
.empty-msg { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.3); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; }

/* Acciones bajo el resultado: ficha inline (desplegable) + link a estadísticas */
.partido-acciones { margin-top: 3px; border-top: 1px solid rgba(255,255,255,0.06); }
.ficha-btns { display: flex; align-items: stretch; }
.ficha-btns .ficha-toggle + .ficha-toggle { border-left: 1px solid rgba(255,255,255,0.07); }
.ficha-toggle { display: flex; align-items: center; justify-content: center; gap: 5px; flex: 1; min-width: 0; padding: 8px 6px; background: none; border: none; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--celeste, #4fc3f7); transition: color .15s, box-shadow .15s; }
.ficha-toggle:hover { color: #fff; }
.ficha-toggle.open { color: #fff; box-shadow: inset 0 -2px 0 var(--celeste, #4fc3f7); }
.ficha-toggle svg { width: 13px; height: 13px; flex-shrink: 0; }
.ficha-toggle .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ficha-caret { font-size: 9px; transition: transform .18s; flex-shrink: 0; }
.ficha-toggle.open .ficha-caret { transform: rotate(180deg); }
.ficha-panel { margin-top: 2px; padding-top: 12px; animation: fichaIn .18s ease; }
@keyframes fichaIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.ficha-loading { text-align: center; padding: 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.3); }
.ficha-goles { display: flex; flex-wrap: wrap; gap: 3px 16px; justify-content: center; padding: 6px 4px 9px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px; }
.ficha-gol { font-family: 'Barlow Condensed', sans-serif; font-size: 12.5px; color: rgba(255,255,255,0.82); }
.ficha-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 230px)); justify-content: center; gap: 6px 40px; }
@media (max-width: 560px) { .ficha-teams { grid-template-columns: minmax(0, 300px); } }
.ficha-team-hdr { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.ficha-team-hdr img { width: 17px; height: 17px; object-fit: contain; }
.ficha-team-hdr span { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.ficha-subhdr { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.32); margin: 6px 0 2px; }
.ficha-prow { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; }
.ficha-pnum { width: 17px; text-align: center; color: rgba(255,255,255,0.38); font-size: 11px; flex-shrink: 0; }
.ficha-pname { color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.ficha-ptag { font-size: 10.5px; flex-shrink: 0; }
.ficha-in { color: #2ad572; }
.ficha-out { color: rgba(255,130,130,0.8); }
.ficha-pmarks { flex-shrink: 0; font-size: 11px; letter-spacing: 1px; }
/* Desplegable de estadísticas globales (mismo estilo que la ficha) */
.fstat-wrap { max-width: 360px; margin: 0 auto; }
.fstat-hdr { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.fstat-hdr .fstat-vs { color: rgba(255,255,255,0.3); font-weight: 400; font-size: 11px; letter-spacing: 1px; }
.fstat-poss { margin-bottom: 9px; }
.fstat-poss-bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; }
.fstat-poss-bar > div { display: flex; align-items: center; font-family: 'Bebas Neue', sans-serif; font-size: 13px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); padding: 0 7px; box-sizing: border-box; }
.fstat-poss-bar > div:first-child { justify-content: flex-start; }
.fstat-poss-bar > div:last-child { justify-content: flex-end; }
.fstat-poss-lbl { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-top: 3px; }
.fstat-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.fstat-val { font-family: 'Bebas Neue', sans-serif; font-size: 17px; line-height: 1; }
.fstat-row .fstat-val:first-child { text-align: left; }
.fstat-row .fstat-val:last-child { text-align: right; }
.fstat-lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 0.4px; color: rgba(255,255,255,0.55); padding: 0 12px; white-space: nowrap; }
</style>

<script src="js/clubes.js"></script>

<script>
const DIAS_ES  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const EN_CURSO = new Set(['1H','HT','2H','ET','BT','P','SUSP']);

let LIGA = [], COPAS = {}, STATS_IDX = {};
let faseActiva = 'clausura';   // 'clausura' | 'copas'
let copaActiva = 'libertadores';
let teamFilter = '';           // slug o ''

const FASES = [{ key: 'clausura', label: 'Clausura' }, { key: 'copas', label: 'Copas' }];

function nombreCorto(slug) {
  const c = (typeof CLUBES_CONFIG !== 'undefined') ? CLUBES_CONFIG[slug] : null;
  return (c && c.nombreCorto) || slug;
}
function horaAR(utc) { const d = new Date(utc); d.setHours(d.getHours()-3); return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; }
function fechaAR(utc) { const d = new Date(utc); d.setHours(d.getHours()-3); return `${DIAS_ES[d.getUTCDay()]} ${d.getUTCDate()} ${MESES_ES[d.getUTCMonth()]}`; }

async function cargar() {
  try {
    const [rl, rc, ri] = await Promise.all([
      fetch(`data/fixtures/liga.json?t=${Date.now()}`),
      fetch(`data/fixtures/copas.json?t=${Date.now()}`).catch(() => null),
      fetch(`data/partidos/index.json?t=${Date.now()}`).catch(() => null),
    ]);
    LIGA = await rl.json();
    COPAS = rc && rc.ok ? await rc.json() : {};
    // Índice de partidos con estadísticas cargadas: clave local|visitante|fecha → id
    const idx = ri && ri.ok ? await ri.json() : [];
    STATS_IDX = {};
    idx.forEach(e => { STATS_IDX[`${e.local}|${e.visitante}|${e.fecha}`] = e.id; });
    poblarFiltro();
    renderTabs();
    render();
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('contenido').style.display = '';
    startLivePolling();
  } catch (e) {
    document.getElementById('loading-state').innerHTML = `<div class="loading-msg">Error: ${e.message}</div>`;
  }
}

// ── En vivo: trae el marcador de api-sports para los partidos en curso ────────
// El proxy /api/apisports solo existe en producción (Vercel); en local no hace nada.
async function actualizarEnVivo() {
  try {
    const res = await fetch('/api/apisports/fixtures?live=all', { cache: 'no-store' });
    if (!res.ok) return false;
    const data = await res.json();
    const live = data.response || [];
    const byId = {};
    live.forEach(r => { byId[String(r.fixture.id)] = r; });
    let cambio = false, hayEnVivo = false;
    LIGA.forEach(p => {
      const r = byId[String(p.api_id)];
      if (!r) return;
      const st = r.fixture.status;
      p.home_score = r.goals.home;
      p.away_score = r.goals.away;
      p.status = { ...(p.status || {}), short: st.short, elapsed: st.elapsed,
                   finished: ['FT','AET','PEN'].includes(st.short), started: true };
      cambio = true; hayEnVivo = true;
    });
    if (cambio) render();
    return hayEnVivo;
  } catch (e) { return false; }
}

let _liveTimer = null;
function startLivePolling() {
  if (_liveTimer) return;
  const tick = () => { if (!document.hidden) actualizarEnVivo(); };
  tick();                                   // primer refresh inmediato
  _liveTimer = setInterval(tick, 60000);    // cada 60s
}

// Slugs disponibles según el contexto activo:
//  - Clausura  → los 30 clubes de la liga
//  - Copas     → solo los equipos argentinos de la copa seleccionada
function equiposContexto() {
  if (faseActiva === 'copas') {
    const copa = COPAS && COPAS[copaActiva];
    const partidos = (copa && copa.partidos) || [];
    const set = new Set();
    partidos.forEach(p => {
      if (p.home && p.home.slug) set.add(p.home.slug);
      if (p.away && p.away.slug) set.add(p.away.slug);
    });
    return [...set];
  }
  return typeof CLUBES_CONFIG !== 'undefined' ? Object.keys(CLUBES_CONFIG) : [];
}

function poblarFiltro() {
  const sel = document.getElementById('team-filter');
  const slugs = equiposContexto()
    .sort((a, b) => nombreCorto(a).localeCompare(nombreCorto(b), 'es'));
  // Si el equipo filtrado no está en el contexto actual, se resetea.
  if (teamFilter && !slugs.includes(teamFilter)) teamFilter = '';
  // Mantener la opción "Todos" (primera) y reconstruir el resto.
  sel.innerHTML = '<option value="">Todos los equipos</option>';
  slugs.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = nombreCorto(s);
    if (s === teamFilter) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { teamFilter = sel.value; render(); };
}

function renderTabs() {
  const wrap = document.getElementById('fase-tabs');
  wrap.innerHTML = '';
  FASES.forEach(f => {
    const b = document.createElement('button');
    b.className = 'fase-tab' + (f.key === faseActiva ? ' active' : '');
    b.textContent = f.label;
    b.onclick = () => { faseActiva = f.key; poblarFiltro(); renderTabs(); render(); };
    wrap.appendChild(b);
  });
  // sub-tabs de copa
  document.querySelectorAll('.copa-subtab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.copa === copaActiva);
    btn.onclick = () => { copaActiva = btn.dataset.copa; poblarFiltro(); renderTabs(); render(); };
  });
}

function render() {
  document.getElementById('copa-subtabs').style.display = (faseActiva === 'copas') ? 'flex' : 'none';
  if (faseActiva === 'copas') renderCopas();
  else renderClausura();
  _restoreSections();   // reabrir la sección (ficha/stats) desplegada antes del re-render
}

// ── CLAUSURA ──────────────────────────────────────────────────────────────
function renderClausura() {
  const wrap = document.getElementById('partidos-wrap');
  wrap.innerHTML = '';
  let partidos = LIGA;
  if (teamFilter) partidos = partidos.filter(p => p.home.slug === teamFilter || p.away.slug === teamFilter);
  if (!partidos.length) { wrap.innerHTML = '<div class="empty-msg">Sin partidos</div>'; return; }

  // Con filtro de equipo: lista plana cronológica con etiqueta de fecha
  if (teamFilter) {
    const lista = document.createElement('div');
    lista.className = 'lista-plana';
    partidos.slice().sort((a, b) => (a.fecha||0) - (b.fecha||0))
      .forEach(p => lista.appendChild(cardLiga(p, `Fecha ${p.fecha}`)));
    wrap.appendChild(lista);
    return;
  }

  // Sin filtro: acordeón por fecha, solo la actual abierta
  const porFecha = {};
  partidos.forEach(p => { (porFecha[p.fecha] = porFecha[p.fecha] || []).push(p); });
  const fechas = Object.keys(porFecha).map(Number).sort((a, b) => a - b);
  const fechaActual = fechas.find(n => porFecha[n].some(p => !p.status.finished)) ?? fechas[fechas.length - 1];
  fechas.forEach(n => {
    const ms = porFecha[n];
    const fin = ms.filter(m => m.status.finished).length;
    const live = ms.some(m => EN_CURSO.has(m.status.short));
    let estado, cls;
    if (fin === ms.length)    { estado = 'Finalizada'; cls = 'fin';  }
    else if (live || fin > 0) { estado = 'En juego';   cls = 'live'; }
    else                      { estado = 'Próxima';    cls = 'prox'; }
    const acc = document.createElement('div');
    acc.className = 'fecha-acc' + (n !== fechaActual ? ' colapsada' : '');
    const head = document.createElement('button');
    head.className = 'fecha-head';
    head.innerHTML = `<span class="fecha-num">FECHA ${n}</span><span class="fecha-estado ${cls}">${estado}</span><span class="fecha-chevron">▼</span>`;
    head.onclick = () => acc.classList.toggle('colapsada');
    acc.appendChild(head);
    const body = document.createElement('div');
    body.className = 'fecha-body';
    ms.slice().sort((a, b) => (a.status.utcTime||'').localeCompare(b.status.utcTime||''))
      .forEach(p => body.appendChild(cardLiga(p)));
    acc.appendChild(body);
    wrap.appendChild(acc);
  });
}

// ── COPAS ─────────────────────────────────────────────────────────────────
function renderCopas() {
  const wrap = document.getElementById('partidos-wrap');
  wrap.innerHTML = '';
  const copa = COPAS[copaActiva];
  if (!copa || !copa.partidos || !copa.partidos.length) {
    wrap.innerHTML = '<div class="empty-msg">Sin partidos de esta copa</div>'; return;
  }
  let partidos = copa.partidos;
  if (teamFilter) partidos = partidos.filter(p => p.home.slug === teamFilter || p.away.slug === teamFilter);
  const cls = copaActiva === 'libertadores' ? 'lib' : 'sud';
  const title = document.createElement('div');
  title.className = `copa-ronda-title ${cls}`;
  title.textContent = copa.ronda || '';
  wrap.appendChild(title);
  if (!partidos.length) {
    const nombre = teamFilter ? nombreCorto(teamFilter) : '';
    wrap.innerHTML += `<div class="empty-msg">${nombre ? nombre + ' no juega esta copa' : 'Sin partidos'}</div>`;
    return;
  }
  // etiqueta ida/vuelta: si existe un partido anterior entre los mismos equipos → Vuelta
  const legLabel = (p, idx, arr) => {
    const key = [p.home.name, p.away.name].sort().join('|');
    const before = arr.slice(0, idx).some(q => [q.home.name, q.away.name].sort().join('|') === key);
    return before ? 'Vuelta' : 'Ida';
  };
  const lista = document.createElement('div');
  lista.className = 'lista-plana';
  partidos.forEach((p, i) => lista.appendChild(cardCopa(p, cls, legLabel(p, i, partidos))));
  wrap.appendChild(lista);
}

// ── Tarjetas ──────────────────────────────────────────────────────────────
function ladoLiga(t, cls) {
  const inner = cls.includes('home')
    ? `<span class="nom">${nombreCorto(t.slug)}</span><img src="escudos/${t.slug}.png" alt="" onerror="this.style.opacity=0.2">`
    : `<img src="escudos/${t.slug}.png" alt="" onerror="this.style.opacity=0.2"><span class="nom">${nombreCorto(t.slug)}</span>`;
  return `<div class="${cls}">${inner}</div>`;
}

function marcador(hs, as, hp, ap) {
  if (hs == null || as == null) return `<div class="marcador"><span class="marcador-vs">VS</span></div>`;
  const pen = (hp != null && ap != null) ? `<span class="marcador-pen">Pen ${hp}-${ap}</span>` : '';
  return `<div class="marcador"><span class="marcador-goles">${hs} - ${as}</span>${pen}</div>`;
}

function ganadorClases(p, homeIsA, awayIsA) {
  let clsH = 'equipo-lado home', clsA = 'equipo-lado away';
  const hs = p.home_score, as = p.away_score;
  if (p.status.finished !== false && hs != null && as != null && hs !== as) {
    if (hs > as) { clsH += ' ganador'; clsA += ' perdedor'; }
    else         { clsA += ' ganador'; clsH += ' perdedor'; }
  }
  return [clsH, clsA];
}

function metaHora(p) {
  const short = p.short || (p.status && p.status.short);
  const enCurso = EN_CURSO.has(short);
  const finished = (p.status ? p.status.finished : ['FT','AET','PEN'].includes(p.short));
  const utc = p.status ? p.status.utcTime : p.utcTime;
  if (enCurso) {
    const el = p.status ? p.status.elapsed : null;
    let txt = 'EN VIVO';
    if (short === 'HT') txt = 'ENTRETIEMPO';
    else if (short === 'SUSP') txt = 'SUSPENDIDO';
    else if (el != null) txt = `${el}'`;
    return `<span class="partido-hora en-curso">● ${txt}</span>`;
  }
  if (finished)     return `<span class="partido-hora fin">FIN · ${fechaAR(utc)}</span>`;
  return `<span class="partido-hora">${fechaAR(utc)} · ${horaAR(utc)} hs</span>`;
}

// Devuelve el id de estadísticas del partido si existe (partido finalizado con JSON cargado).
function statsIdFor(p) {
  const fecha = (p.status && p.status.utcTime || '').slice(0, 10);
  return STATS_IDX[`${p.home.slug}|${p.away.slug}|${fecha}`] || null;
}

function cardLiga(p, etiqueta) {
  const [clsH, clsA] = ganadorClases({ ...p, status: p.status });
  const etq = etiqueta ? `<span class="etq">${etiqueta}</span>` : '';
  const card = document.createElement('div');
  card.className = 'partido-card';
  // Dos subsecciones cuando el partido arrancó (en vivo desde api-sports) o ya tiene JSON:
  //  ① "Ficha del partido" → desplegable INLINE con los jugadores (acá mismo).
  //  ② "Estadísticas del partido" → página completa (global + individual).
  const sid = statsIdFor(p);
  const shortSt = p.short || (p.status && p.status.short);
  const enCurso = EN_CURSO.has(shortSt);
  const finLink = (p.status ? p.status.finished : ['FT','AET','PEN'].includes(p.short));
  const fid = p.api_id || '';
  const started = fid && (enCurso || finLink || !!sid);
  const icoUsers = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;
  const icoStats = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`;
  // Dos pestañas en la misma línea; ambas despliegan INLINE abajo (ficha ↔ stats globales).
  const acciones = started
    ? `<div class="ficha-btns">
         <button class="ficha-toggle" type="button" data-sec="ficha">${icoUsers}<span class="txt">Ficha del partido</span> <span class="ficha-caret">▾</span></button>
         <button class="ficha-toggle" type="button" data-sec="stats">${icoStats}<span class="txt">Ver estadísticas del partido</span> <span class="ficha-caret">▾</span></button>
       </div>`
    : '';
  card.innerHTML =
    `<div class="partido-meta">${etq}${metaHora(p)}</div>
     <div class="partido-fila">${ladoLiga(p.home, clsH)}${marcador(p.home_score, p.away_score, p.home_pen, p.away_pen)}${ladoLiga(p.away, clsA)}</div>
     ${started ? `<div class="partido-acciones">${acciones}<div class="ficha-panel" data-fid="${fid}" hidden></div></div>` : ''}`;
  if (started) {
    const cont = card.querySelector('.partido-acciones');
    cont.querySelectorAll('.ficha-toggle').forEach(btn =>
      btn.addEventListener('click', () => toggleSection(cont, fid, btn.dataset.sec)));
  }
  return card;
}

// ── Ficha / Estadísticas inline (desplegables en la card del fixture) ─────────
function _fEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const _fichaCache = {};   // fid -> payload de api-sports ya armado (compartido por ficha + stats)
const _secOpen = {};      // fid -> 'ficha' | 'stats' (sección desplegada; para restaurar tras re-render)
async function _sectionData(fid) {
  if (_fichaCache[fid]) return _fichaCache[fid];
  let built = null;
  try { built = await buildPayloadLive(fid); } catch (e) {}
  if (built) _fichaCache[fid] = built.data;
  return built ? built.data : null;
}
async function _fillSection(cont, fid, sec) {
  const panel = cont.querySelector('.ficha-panel');
  cont.querySelectorAll('.ficha-toggle').forEach(b => b.classList.toggle('open', b.dataset.sec === sec));
  panel.removeAttribute('hidden');
  if (panel.dataset.sec !== sec) panel.innerHTML = '<div class="ficha-loading">Cargando…</div>';
  const data = await _sectionData(fid);
  if (!data) { panel.innerHTML = '<div class="ficha-loading">No se pudo cargar.</div>'; return; }
  panel.innerHTML = sec === 'stats' ? renderStatsHTML(data) : renderFichaHTML(data);
  panel.dataset.sec = sec;
}
function toggleSection(cont, fid, sec) {
  if (_secOpen[fid] === sec) {                        // misma sección ya abierta → cerrar
    cont.querySelector('.ficha-panel').setAttribute('hidden', '');
    cont.querySelectorAll('.ficha-toggle').forEach(b => b.classList.remove('open'));
    delete _secOpen[fid];
    return;
  }
  _secOpen[fid] = sec;                                 // abrir/cambiar de sección
  _fillSection(cont, fid, sec);
}
// Reabre la sección desplegada antes de un re-render del fixture (poll en vivo).
function _restoreSections() {
  if (!Object.keys(_secOpen).length) return;
  document.querySelectorAll('.partido-acciones').forEach(cont => {
    const panel = cont.querySelector('.ficha-panel');
    const fid = panel && panel.dataset.fid, sec = fid && _secOpen[fid];
    if (sec) _fillSection(cont, fid, sec);
  });
}
// Estadísticas globales del partido (mismo estilo de desplegable que la ficha).
function renderStatsHTML(data) {
  const p = data.partido;
  // CLUBES_CONFIG.color no distingue (casi todos #003087), así que usamos dos colores
  // fijos local/visitante bien diferenciables (azul cielo vs naranja).
  const cl = '#38bdf8', cv = '#fb923c', al = cl, av = cv;
  const hdr = `<div class="fstat-hdr"><span style="color:${al}">${_fEsc(nombreCorto(p.local))}</span><span class="fstat-vs">vs</span><span style="color:${av}">${_fEsc(nombreCorto(p.visitante))}</span></div>`;
  const rows = (data.top_stats || []).map(s => {
    if (s.tipo === 'posesion') {
      return `<div class="fstat-poss"><div class="fstat-poss-bar">`
        + `<div style="width:${s.local_val}%;background:${cl}">${_fEsc(s.local)}</div>`
        + `<div style="width:${s.visitante_val}%;background:${cv}">${_fEsc(s.visitante)}</div>`
        + `</div><div class="fstat-poss-lbl">${_fEsc(s.label)}</div></div>`;
    }
    return `<div class="fstat-row"><span class="fstat-val" style="color:${al}">${_fEsc(s.local)}</span>`
      + `<span class="fstat-lbl">${_fEsc(s.label)}</span>`
      + `<span class="fstat-val" style="color:${av}">${_fEsc(s.visitante)}</span></div>`;
  }).join('');
  return `<div class="fstat-wrap">${hdr}${rows || '<div class="ficha-loading">Sin estadísticas todavía</div>'}</div>`;
}
function _fichaPlayerRow(j) {
  const marks = [];
  for (let i = 0; i < (j.goles || 0); i++) marks.push('⚽');
  if (j.asist > 0) marks.push('🅰');
  if (j.roja) marks.push('🟥'); else if (j.amarilla) marks.push('🟨');
  let tag = '';
  if (j.tipo === 'suplente' && j.min_in) tag = `<span class="ficha-in">▲ ${j.min_in}'</span>`;
  else if (j.min_sale) tag = `<span class="ficha-out">▼ ${j.min_sale}'</span>`;
  return `<div class="ficha-prow"><span class="ficha-pnum">${_fEsc(j.num)}</span><span class="ficha-pname">${_fEsc(j.nombre)}</span><span class="ficha-ptag">${tag}</span><span class="ficha-pmarks">${marks.join('')}</span></div>`;
}
function _fichaGol(g) {
  const txt = (g.min != null ? g.min + "' " : '') + _fEsc(g.jugador) + (g.en_contra ? ' (e/c)' : '');
  return `<div class="ficha-gol">⚽ ${txt}</div>`;
}
function renderFichaHTML(data) {
  const p = data.partido;
  const gd = p.goles_detalle || {};
  const goles = (gd.local || []).concat(gd.visitante || []).sort((a, b) => (a.min || 0) - (b.min || 0));
  const golesHTML = goles.length ? `<div class="ficha-goles">${goles.map(_fichaGol).join('')}</div>` : '';
  const teams = [[p.local, data.jugadores[p.local] || []], [p.visitante, data.jugadores[p.visitante] || []]];
  const teamsHTML = teams.map(t => {
    const slug = t[0], jugs = t[1];
    const tit = jugs.filter(j => j.tipo === 'titular');
    const sub = jugs.filter(j => j.tipo === 'suplente');
    let rows = tit.map(_fichaPlayerRow).join('');
    if (sub.length) rows += `<div class="ficha-subhdr">Ingresaron</div>` + sub.map(_fichaPlayerRow).join('');
    if (!rows) rows = `<div class="ficha-subhdr">Formación aún no confirmada</div>`;
    return `<div class="ficha-team"><div class="ficha-team-hdr"><span>${_fEsc(nombreCorto(slug))}</span></div><div class="ficha-rows">${rows}</div></div>`;
  }).join('');
  return golesHTML + `<div class="ficha-teams">${teamsHTML}</div>`;
}

function _logoFallback(img) {
  const s = document.createElement('span');
  s.className = 'escudo-ph';
  s.textContent = img.dataset.ini || '?';
  img.replaceWith(s);
}
function escudoTagCopa(t) {
  if (t.slug) return `<img src="escudos/${t.slug}.png" alt="" onerror="this.style.opacity=0.2">`;
  const ini = (t.name || '').split(/\s+/).map(w => w[0] || '').join('').slice(0, 3).toUpperCase();
  if (t.logo) return `<img src="${t.logo}" data-ini="${ini}" alt="" onerror="_logoFallback(this)">`;
  return `<span class="escudo-ph">${ini}</span>`;
}
function ladoCopa(t, cls) {
  const nom = t.slug ? nombreCorto(t.slug) : t.name;
  const imgTag = escudoTagCopa(t);
  const nomTag = `<span class="nom">${nom}</span>`;
  const inner = cls.includes('home') ? `${nomTag}${imgTag}` : `${imgTag}${nomTag}`;
  return `<div class="${cls}">${inner}</div>`;
}

function cardCopa(p, copaCls, leg) {
  // ganador por marcador de esa llave (leg)
  let clsH = 'equipo-lado home', clsA = 'equipo-lado away';
  const hs = p.home_score, as = p.away_score;
  const finished = ['FT','AET','PEN'].includes(p.short);
  if (finished && hs != null && as != null && hs !== as) {
    if (hs > as) { clsH += ' ganador'; clsA += ' perdedor'; }
    else         { clsA += ' ganador'; clsH += ' perdedor'; }
  }
  const pseudo = { short: p.short, utcTime: p.utcTime, status: null };
  const card = document.createElement('div');
  card.className = `partido-card ${copaCls}`;
  card.innerHTML =
    `<div class="partido-meta"><span class="etq leg">${leg}</span>${metaHora(pseudo)}</div>
     <div class="partido-fila">${ladoCopa(p.home, clsH)}${marcador(hs, as, p.home_pen, p.away_pen)}${ladoCopa(p.away, clsA)}</div>`;
  return card;
}

cargar();
</script>
