<style>
:root {
  --dark:  #0d0d1a;
  --dark2: #13131f;
  --dark3: #1a1a2e;
  --acento: #1565c0;
  --acento-light: #42a5f5;
  --gold: #f5c518;
  --verde: #2ad572;
  --rojo: #e53935;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

/* ===== HEADER ===== */
#site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px 10px;
  background: linear-gradient(180deg, rgba(21,101,192,0.15) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px);
  gap: 12px;
}
.logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-titulo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: #fff; line-height: 1; }
.logo-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 3px; color: var(--acento-light); text-transform: uppercase; }
.header-trophy { font-size: 28px; line-height: 1; }
.header-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 6px 14px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px;
  color: rgba(255,255,255,0.55); cursor: pointer; text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.header-pill:hover { background: rgba(21,101,192,0.18); border-color: rgba(21,101,192,0.4); color: #fff; }
.header-pill-label { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; color: #fff; }
@media (max-width: 500px) {
  .header-pill-label { display: none; }
  .header-pill { padding: 6px 10px; gap: 0; }
  .card-btns { gap: 6px; }
  .card-btn-ficha, .card-btn-stats { font-size: 11px; padding: 5px 8px; }
}

/* ===== MAIN ===== */
#main { padding: 24px 16px 60px; max-width: 700px; margin: 0 auto; }

/* ===== TABS DE FASE ===== */
.fase-tabs {
  display: flex; gap: 6px; margin-bottom: 24px;
  overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
.fase-tabs::-webkit-scrollbar { display: none; }
.fase-tab {
  flex-shrink: 0;
  font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 1.5px;
  border: 1px solid rgba(255,255,255,0.12); background: transparent;
  color: rgba(255,255,255,0.4); border-radius: 8px;
  padding: 7px 14px; cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.fase-tab:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.7); }
.fase-tab.active { background: var(--acento); border-color: var(--acento); color: #fff; }

/* ===== BLOQUE DE DÍA ===== */
.dia-bloque { margin-bottom: 28px; }
.dia-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.dia-fecha {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; letter-spacing: 2px; color: #fff;
}
.dia-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  background: rgba(21,101,192,0.2); border: 1px solid rgba(21,101,192,0.35);
  color: var(--acento-light); border-radius: 20px; padding: 2px 8px;
}
.dia-badge.hoy { background: rgba(42,213,114,0.15); border-color: rgba(42,213,114,0.4); color: var(--verde); }

/* ===== CARD DE PARTIDO ===== */
.partido-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px; padding: 14px 16px;
  margin-bottom: 8px;
  transition: border-color 0.2s, background 0.2s;
  cursor: default;
}
.partido-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(21,101,192,0.25); }
.partido-card.en-curso {
  border-color: rgba(42,213,114,0.4);
  background: rgba(42,213,114,0.04);
}
.partido-card.terminado { opacity: 0.75; }
.partido-card.terminado:has(.card-btns) { opacity: 1; }

/* Botones footer de la card */
.card-btns {
  display: flex; gap: 8px; margin-top: 12px; justify-content: center; flex-wrap: wrap;
}
.card-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 1.2px; text-transform: uppercase; padding: 5px 12px; border-radius: 4px;
  border: none; cursor: pointer; transition: background 0.15s, opacity 0.15s;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.card-btn-ficha {
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75);
}
.card-btn-ficha:hover { background: rgba(255,255,255,0.14); }
.card-btn-stats {
  background: rgba(21,101,192,0.25); color: var(--acento-light);
}
.card-btn-stats:hover { background: rgba(21,101,192,0.4); }

/* Panel ficha inline */
.ficha-panel {
  margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.07);
  padding-top: 12px; display: none;
}
.ficha-panel.abierto { display: block; }
.ficha-loading {
  text-align: center; padding: 20px; color: rgba(255,255,255,0.3);
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px;
}
.ficha-cols {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.ficha-equipo-titulo {
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.35);
  margin-bottom: 8px; text-align: center;
}
.ficha-jugador {
  display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 4px;
  transition: background 0.1s;
}
.ficha-jugador:hover { background: rgba(255,255,255,0.04); }
.ficha-jugador-foto {
  width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  background: rgba(255,255,255,0.06);
}
.ficha-jugador-num {
  font-family: 'Bebas Neue', sans-serif; font-size: 13px; color: rgba(255,255,255,0.25);
  min-width: 16px; text-align: center; flex-shrink: 0;
}
.ficha-jugador-info { flex: 1; min-width: 0; }
.ficha-jugador-nombre {
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ficha-jugador-nombre.capitan::after { content: ' (C)'; color: rgba(255,255,255,0.3); font-weight: 400; }
.ficha-jugador-eventos { display: flex; gap: 3px; align-items: center; flex-shrink: 0; }
.ev-icon { font-size: 12px; line-height: 1; }
.ficha-subs {
  margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;
}
.ficha-subs-titulo {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 6px; text-align: center;
}
.ficha-sub-fila {
  display: flex; align-items: center; gap: 4px; padding: 3px 6px; font-size: 12px;
  font-family: 'Barlow Condensed', sans-serif; color: rgba(255,255,255,0.55);
}
.ficha-sub-min { color: rgba(255,255,255,0.25); min-width: 28px; }
.ficha-sub-out { color: rgba(255,80,80,0.7); }
.ficha-sub-in  { color: rgba(42,213,114,0.8); }

/* Meta del partido: grupo y horario */
.partido-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.partido-grupo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,0.3);
}
.partido-hora {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; letter-spacing: 1px;
  color: rgba(255,255,255,0.35);
}
.partido-hora.en-curso { color: var(--verde); font-weight: 700; animation: pulso 1.4s ease-in-out infinite; }
@keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Fila de equipos y marcador */
.partido-fila {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}
.equipo-home { display: flex; align-items: center; gap: 9px; justify-content: flex-end; }
.equipo-away { display: flex; align-items: center; gap: 9px; }
.partido-flag {
  width: 36px; height: 36px; object-fit: contain;
  filter: drop-shadow(0 1px 5px rgba(0,0,0,0.6));
  flex-shrink: 0;
}
.partido-nombre {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 700; letter-spacing: 0.3px;
  color: rgba(255,255,255,0.9);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 120px;
}
.partido-nombre.ganador { color: #fff; }
.partido-nombre.perdedor { color: rgba(255,255,255,0.4); }

/* Marcador central */
.marcador {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Bebas Neue', sans-serif;
  flex-shrink: 0;
}
.marcador-gol {
  font-size: 28px; letter-spacing: 0; color: #fff; line-height: 1;
  min-width: 20px; text-align: center;
}
.marcador-sep {
  font-size: 20px; color: rgba(255,255,255,0.25); line-height: 1;
}
.marcador-vs {
  font-size: 14px; letter-spacing: 2px; color: rgba(255,255,255,0.2); line-height: 1; padding: 0 4px;
}

/* ===== LOADING / EMPTY ===== */
.loading-msg { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.25); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 3px; }
.loading-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.08); border-top-color: var(--acento); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-msg { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.25); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px; }

/* ===== FOOTER ===== */
#site-footer { text-align: center; padding: 20px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,0.15); border-top: 1px solid rgba(255,255,255,0.05); margin-top: 20px; }
</style>

<script>
// Nombres en español
const NOMBRES_ES = {
  czechia:'Chequia', mexico:'México', southafrica:'Sudáfrica', southkorea:'Corea del Sur',
  bosniaandherzegovina:'Bosnia y Herz.', canada:'Canadá', qatar:'Qatar', switzerland:'Suiza',
  brazil:'Brasil', haiti:'Haití', morocco:'Marruecos', scotland:'Escocia',
  australia:'Australia', paraguay:'Paraguay', turkiye:'Turquía', usa:'EE.UU.',
  curacao:'Curazao', ecuador:'Ecuador', germany:'Alemania', ivorycoast:'Costa de Marfil',
  japan:'Japón', netherlands:'Países Bajos', sweden:'Suecia', tunisia:'Túnez',
  belgium:'Bélgica', egypt:'Egipto', iran:'Irán', newzealand:'Nueva Zelanda',
  capeverde:'Cabo Verde', saudiarabia:'Arabia Saudita', spain:'España', uruguay:'Uruguay',
  france:'Francia', iraq:'Irak', norway:'Noruega', senegal:'Senegal',
  algeria:'Argelia', argentina:'Argentina', austria:'Austria', jordan:'Jordania',
  colombia:'Colombia', drcongo:'Rep. D. Congo', portugal:'Portugal', uzbekistan:'Uzbekistán',
  croatia:'Croacia', england:'Inglaterra', ghana:'Ghana', panama:'Panamá',
};

// Slugs por ID de equipo
let slugPorId = {};

// Mapeo de rondas
const FASES = [
  { key: 'grupos',   label: 'Grupos',   rounds: ['1','2','3'], visible: true },
  { key: 'octavos',  label: 'Octavos',  rounds: ['1/16'],      visible: false },
  { key: 'cuartos',  label: 'Cuartos',  rounds: ['1/8'],       visible: false },
  { key: 'semis',    label: 'Semis',    rounds: ['1/4'],       visible: false },
  { key: 'final',    label: 'Final',    rounds: ['1/2','bronze','final'], visible: false },
];

const DIAS_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dic'];

let faseActiva = 'grupos';
let todosPartidos = [];

function slugDeNombre(nombre) {
  return nombre.toLowerCase()
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, '').replace(/-/g, '').replace(/'/g, '');
}

function nombreEs(nombreEn, teamId) {
  const slug = slugPorId[teamId] || slugDeNombre(nombreEn);
  return NOMBRES_ES[slug] || nombreEn;
}

function formatearFecha(utcStr) {
  // Convertir UTC a Argentina (UTC-3)
  const d = new Date(utcStr);
  d.setHours(d.getHours() - 3);
  const dia = DIAS_ES[d.getUTCDay()];
  const num = d.getUTCDate();
  const mes = MESES_ES[d.getUTCMonth()];
  return `${dia} ${num} ${mes}`;
}

function formatearHora(utcStr) {
  const d = new Date(utcStr);
  d.setHours(d.getHours() - 3);
  const h = String(d.getUTCHours()).padStart(2, '0');
  const m = String(d.getUTCMinutes()).padStart(2, '0');
  return `${h}:${m}`;
}

function diaKey(utcStr) {
  // Día en Argentina
  const d = new Date(utcStr);
  d.setHours(d.getHours() - 3);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}

function esHoy(utcStr) {
  const hoy = new Date();
  const argHoy = new Date(hoy.getTime() - 3*60*60*1000);
  const diaH = `${argHoy.getUTCFullYear()}-${String(argHoy.getUTCMonth()+1).padStart(2,'0')}-${String(argHoy.getUTCDate()).padStart(2,'0')}`;
  return diaKey(utcStr) === diaH;
}

function renderFaseTabs() {
  const wrap = document.getElementById('fase-tabs');
  wrap.innerHTML = '';
  for (const f of FASES.filter(f => f.visible)) {
    const btn = document.createElement('button');
    btn.className = 'fase-tab' + (f.key === faseActiva ? ' active' : '');
    btn.textContent = f.label;
    btn.onclick = () => { faseActiva = f.key; renderPartidos(); renderFaseTabs(); };
    wrap.appendChild(btn);
  }
}

function renderPartidos() {
  const wrap = document.getElementById('partidos-wrap');
  wrap.innerHTML = '';

  const fase = FASES.find(f => f.key === faseActiva);
  const filtrados = todosPartidos.filter(p => fase.rounds.includes(p.round));

  if (!filtrados.length) {
    wrap.innerHTML = '<div class="empty-msg">Sin partidos en esta fase todavía</div>';
    return;
  }

  // Agrupar por día Argentina
  const porDia = {};
  for (const p of filtrados) {
    const dk = diaKey(p.status.utcTime);
    if (!porDia[dk]) porDia[dk] = [];
    porDia[dk].push(p);
  }

  for (const dk of Object.keys(porDia).sort()) {
    const partidos = porDia[dk];
    const bloque = document.createElement('div');
    bloque.className = 'dia-bloque';

    const hoy = esHoy(partidos[0].status.utcTime);
    const fechaStr = formatearFecha(partidos[0].status.utcTime);

    bloque.innerHTML = `
      <div class="dia-header">
        <span class="dia-fecha">${fechaStr}</span>
        ${hoy ? '<span class="dia-badge hoy">HOY</span>' : ''}
      </div>
    `;

    for (const p of partidos) {
      bloque.appendChild(crearCardPartido(p));
    }

    wrap.appendChild(bloque);
  }
}

function crearCardPartido(p) {
  const tieneStats = p.stats_id && p.status.finished;
  const tieneFicha = !!p.api_id;
  const card = document.createElement('div');
  const { started, finished, cancelled } = p.status;
  const enCurso = started && !finished;

  let claseCard = 'partido-card';
  if (enCurso) claseCard += ' en-curso';
  if (finished) claseCard += ' terminado';
  card.className = claseCard;

  const slugHome = p.home.slug || slugPorId[p.home.id] || slugDeNombre(p.home.name);
  const slugAway = p.away.slug || slugPorId[p.away.id] || slugDeNombre(p.away.name);
  const nomHome = NOMBRES_ES[slugHome] || p.home.name;
  const nomAway = NOMBRES_ES[slugAway] || p.away.name;

  const golesHome = p.home.score ?? p.home_score ?? null;
  const golesAway = p.away.score ?? p.away_score ?? null;
  const hayMarcador = golesHome !== null && golesAway !== null;

  let claseNomHome = 'partido-nombre';
  let claseNomAway = 'partido-nombre';
  if (finished && hayMarcador) {
    if (golesHome > golesAway) { claseNomHome += ' ganador'; claseNomAway += ' perdedor'; }
    else if (golesAway > golesHome) { claseNomAway += ' ganador'; claseNomHome += ' perdedor'; }
  }

  let metaLabel = '';
  if (p.group) metaLabel = `Grupo ${p.group}`;
  else if (p.round === '1/16') metaLabel = 'Octavos de Final';
  else if (p.round === '1/8')  metaLabel = 'Cuartos de Final';
  else if (p.round === '1/4')  metaLabel = 'Semifinal';
  else if (p.round === '1/2')  metaLabel = 'Final';
  else if (p.round === 'bronze') metaLabel = 'Tercer Puesto';
  else if (p.round === 'final')  metaLabel = 'GRAN FINAL';

  let horaHTML = '';
  if (enCurso) {
    horaHTML = `<span class="partido-hora en-curso">EN VIVO</span>`;
  } else if (finished) {
    horaHTML = `<span class="partido-hora">FIN</span>`;
  } else {
    horaHTML = `<span class="partido-hora">${formatearHora(p.status.utcTime)} hs</span>`;
  }

  let marcadorHTML = '';
  if (hayMarcador) {
    marcadorHTML = `
      <div class="marcador">
        <span class="marcador-gol">${golesHome}</span>
        <span class="marcador-sep">-</span>
        <span class="marcador-gol">${golesAway}</span>
      </div>`;
  } else {
    marcadorHTML = `<div class="marcador"><span class="marcador-vs">VS</span></div>`;
  }

  const metaRonda = p.round === 'amistoso' ? 'Amistoso' : metaLabel;

  let btnsHTML = '';
  if (tieneFicha || tieneStats) {
    btnsHTML = '<div class="card-btns">';
    if (tieneFicha) btnsHTML += `<button class="card-btn card-btn-ficha" data-api="${p.api_id}" data-home="${nomHome}" data-away="${nomAway}" data-hslug="${slugHome}" data-aslug="${slugAway}">📋 Ver ficha</button>`;
    if (tieneStats) btnsHTML += `<a class="card-btn card-btn-stats" href="estadisticas.html?p=${p.stats_id}">📊 Ver estadísticas →</a>`;
    btnsHTML += '</div>';
  }

  card.innerHTML = `
    <div class="partido-meta">
      <span class="partido-grupo">${metaRonda}</span>
      ${horaHTML}
    </div>
    <div class="partido-fila">
      <div class="equipo-home">
        <span class="${claseNomHome}">${nomHome}</span>
        <a href="equipo.html?c=${slugHome}" onclick="event.stopPropagation()">
          <img class="partido-flag" src="escudos/${slugHome}.png" alt="${nomHome}" onerror="this.style.opacity='0.1'">
        </a>
      </div>
      ${marcadorHTML}
      <div class="equipo-away">
        <a href="equipo.html?c=${slugAway}" onclick="event.stopPropagation()">
          <img class="partido-flag" src="escudos/${slugAway}.png" alt="${nomAway}" onerror="this.style.opacity='0.1'">
        </a>
        <span class="${claseNomAway}">${nomAway}</span>
      </div>
    </div>
    ${btnsHTML}
    <div class="ficha-panel" id="ficha-${p.api_id || ''}"></div>
  `;

  // Bind del botón VER FICHA
  if (tieneFicha) {
    const btn = card.querySelector('.card-btn-ficha');
    btn.addEventListener('click', () => toggleFicha(p, btn, card));
  }

  return card;
}

// Cache de fichas ya cargadas
const _fichaCache = {};

async function toggleFicha(p, btn, card) {
  const panel = card.querySelector('.ficha-panel');
  const abierto = panel.classList.contains('abierto');
  if (abierto) {
    panel.classList.remove('abierto');
    btn.textContent = '📋 Ver ficha';
    return;
  }
  panel.classList.add('abierto');
  btn.textContent = '📋 Ocultar ficha';

  if (_fichaCache[p.api_id]) {
    panel.innerHTML = _fichaCache[p.api_id];
    return;
  }

  panel.innerHTML = '<div class="ficha-loading">CARGANDO...</div>';

  try {
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const base = isLocal
      ? 'https://v3.football.api-sports.io'
      : '/api/apisports';
    const headers = isLocal ? { 'x-apisports-key': 'b8bbfc856fd5cf12cd7d697b2b01887d' } : {};
    const [resLinea, resEv] = await Promise.all([
      fetch(`${base}/fixtures/lineups?fixture=${p.api_id}`, { headers }),
      fetch(`${base}/fixtures/events?fixture=${p.api_id}`, { headers }),
    ]);
    const [dLinea, dEv] = await Promise.all([resLinea.json(), resEv.json()]);

    const lineups = (dLinea.response || []);
    const events  = (dEv.response || []);

    const html = renderFicha(lineups, events, p);
    _fichaCache[p.api_id] = html;
    panel.innerHTML = html;
  } catch(e) {
    panel.innerHTML = `<div class="ficha-loading">No disponible</div>`;
  }
}

function renderFicha(lineups, events, p) {
  if (!lineups.length) return '<div class="ficha-loading">Sin datos de alineación</div>';

  // Indexar eventos por playerId
  const evByPlayer = {};
  for (const ev of events) {
    const pid = ev.player?.id;
    if (!pid) continue;
    if (!evByPlayer[pid]) evByPlayer[pid] = [];
    evByPlayer[pid].push(ev);
  }
  // Subs: cambios indexados por equipo (api-sports team id)
  const subsByTeam = {};
  for (const ev of events) {
    if (ev.type !== 'subst') continue;
    const tid = ev.team?.id;
    if (!subsByTeam[tid]) subsByTeam[tid] = [];
    subsByTeam[tid].push(ev);
  }

  function iconosJugador(pid) {
    const evs = evByPlayer[pid] || [];
    return evs.map(ev => {
      if (ev.type === 'Goal') return ev.detail === 'Own Goal' ? '<span class="ev-icon" title="Gol en contra">⚽🔴</span>' : '<span class="ev-icon" title="Gol">⚽</span>';
      if (ev.type === 'Card') return ev.detail === 'Yellow Card' ? '<span class="ev-icon" title="Amarilla">🟨</span>' : '<span class="ev-icon" title="Roja">🟥</span>';
      if (ev.type === 'Assist') return '<span class="ev-icon" title="Asistencia">🅰️</span>';
      return '';
    }).join('');
  }

  function renderEquipo(lineup) {
    const tid = lineup.team?.id;
    const jugadores = [...(lineup.startXI || []), ...(lineup.substitutes || [])];
    const titulares = lineup.startXI || [];
    const suplentes = lineup.substitutes || [];
    const subs = subsByTeam[tid] || [];

    let html = `<div class="ficha-equipo-titulo">${lineup.team?.name || ''}</div>`;

    for (const j of titulares) {
      const pl = j.player;
      const foto = `https://media.api-sports.io/football/players/${pl.id}.png`;
      const cap = pl.captain ? ' capitan' : '';
      html += `
        <div class="ficha-jugador">
          <img class="ficha-jugador-foto" src="${foto}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\'/>'" >
          <span class="ficha-jugador-num">${pl.number || ''}</span>
          <div class="ficha-jugador-info">
            <div class="ficha-jugador-nombre${cap}">${pl.name || ''}</div>
          </div>
          <div class="ficha-jugador-eventos">${iconosJugador(pl.id)}</div>
        </div>`;
    }

    if (subs.length) {
      html += `<div class="ficha-subs"><div class="ficha-subs-titulo">Cambios</div>`;
      for (const s of subs) {
        html += `
          <div class="ficha-sub-fila">
            <span class="ficha-sub-min">${s.time?.elapsed}'</span>
            <span class="ficha-sub-out">↓ ${s.player?.name || ''}</span>
            <span style="color:rgba(255,255,255,0.2)"> / </span>
            <span class="ficha-sub-in">↑ ${s.assist?.name || ''}</span>
          </div>`;
      }
      html += '</div>';
    }

    return html;
  }

  const col1 = lineups[0] ? renderEquipo(lineups[0]) : '';
  const col2 = lineups[1] ? renderEquipo(lineups[1]) : '';

  return `<div class="ficha-cols"><div>${col1}</div><div>${col2}</div></div>`;
}

async function cargar() {
  try {
    const ts = Date.now();
    const [resFixture, resEquipos] = await Promise.all([
      fetch(`data/fixtures/mundial.json?t=${ts}`),
      fetch(`data/equipos.json?t=${ts}`),
    ]);
    todosPartidos = await resFixture.json();
    const equipos = await resEquipos.json();

    // Mapear id → slug (FotMob id y api-sports id)
    for (const eq of equipos) {
      slugPorId[String(eq.id)] = eq.slug;
      if (eq.api_id) slugPorId[String(eq.api_id)] = eq.slug;
    }

    renderFaseTabs();
    renderPartidos();

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('contenido').style.display = '';
  } catch(e) {
    document.getElementById('loading-state').innerHTML =
      `<div class="loading-msg">Error: ${e.message}</div>`;
  }
}

cargar();

// Live scores: poll cada 60s si hay partido en curso
let _liveInterval = null;

function hayPartidoEnCurso() {
  const live = ['1H','HT','2H','ET','BT','P','SUSP'];
  return todosPartidos.some(p => live.includes(p.status?.short));
}

async function pollLive() {
  try {
    const res = await fetch(`data/fixtures/mundial.json?t=${Date.now()}`);
    if (!res.ok) return;
    const fresh = await res.json();
    const changed = JSON.stringify(fresh) !== JSON.stringify(todosPartidos);
    if (changed) {
      todosPartidos = fresh;
      renderPartidos();
    }
    if (!hayPartidoEnCurso()) {
      clearInterval(_liveInterval);
      _liveInterval = null;
    }
  } catch(e) {}
}

function iniciarLivePoll() {
  if (_liveInterval) return;
  _liveInterval = setInterval(pollLive, 60000);
}

// Arrancar poll si ya hay partido en curso al cargar
setTimeout(() => { if (hayPartidoEnCurso()) iniciarLivePoll(); }, 2000);

// Reanudar poll cuando la pestaña vuelve a estar activa
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && hayPartidoEnCurso()) iniciarLivePoll();
});
</script>
