name: Update Fixtures

on:
  schedule:
    - cron: '0 9,21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fixtures
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/fetch_fixtures.py

      - name: Commit updated fixtures
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: actualizar fixtures [skip ci]'
          file_pattern: 'data/fixtures/*.json'
