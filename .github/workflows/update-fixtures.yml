name: Update Fixtures

on:
  schedule:
    - cron: '0 */2 * * *'   # cada 2 h: mantiene resultados/fixtures al día 24/7
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Los stats de partidos corren PRIMERO a propósito: fetch_liga_fixtures
      # completa los partidos que el agregado de api-sports da atrasados usando
      # data/partidos/{id}.json (reparar_estados), así que esos archivos tienen
      # que generarse antes en la misma corrida. Idempotente: los partidos ya
      # procesados se saltean sin gastar llamadas.
      - name: Stats de partidos FT (base para reparar_estados)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/fetch_liga_partidos.py --torneo clausura

      - name: Fetch fixtures (por club + liga.json + copas.json)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python scripts/fetch_fixtures.py
          python scripts/fetch_liga_fixtures.py
          python scripts/fetch_copas_fixtures.py

      - name: Commit updated fixtures
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: actualizar fixtures [skip ci]'
          file_pattern: 'data/fixtures/*.json data/partidos/*.json'
