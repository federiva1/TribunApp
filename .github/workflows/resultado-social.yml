name: Tweet de final del partido

# Cada 10 min, con el mismo guard barato que el de formaciones: solo sigue si hay
# un partido nuestro que arrancó hace entre 100 y 300 min y todavía no se posteó.
# El estado real lo pregunta al endpoint por-id de api-sports (marca FT al toque,
# a diferencia de los agregados, que se atrasan).
#
# Sin los secrets de X corre en MODO ENSAYO: genera la placa y la commitea en
# data/social/preview/ para revisarla, sin tuitear.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: resultado-social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Guard sin dependencias: lee data/fixtures y corta si no hay candidatos.
      - name: ¿Hay partidos por cerrar?
        id: check
        run: python scripts/social_resultado.py --check

      - name: Instalar Playwright
        if: steps.check.outputs.hay == '1'
        run: |
          pip install playwright pillow requests requests-oauthlib
          python -m playwright install --with-deps chromium

      - name: Generar placa y tuitear
        if: steps.check.outputs.hay == '1'
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/social_resultado.py

      - name: Commit estado (y previews en modo ensayo)
        if: steps.check.outputs.hay == '1'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: resultados posteados [skip ci]'
          file_pattern: 'data/social/*'
