name: Liga + Copa Match Stats

# Procesa los partidos FT de Liga + copas (Libertadores/Sudamericana) que aún no tienen
# stats individuales: base (api-sports) + jugadores (FotMob) → data/partidos/{id}.json +
# index.json. Copa: solo clubes vivos (whitelist en fetch_liga_partidos.COPA_CLUBS) y de
# octavos en adelante (cutoff COPA_DESDE). Idempotente: saltea los ya procesados (0 llamadas
# api). Se auto-repara si FotMob todavía no tenía los datos (reintenta en la próxima corrida).

on:
  schedule:
    - cron: '0 */3 * * *'   # cada 3 h: capta partidos a medida que terminan (+ delay FotMob)
  workflow_dispatch:
    inputs:
      force_date:
        description: 'Reprocesar con --force los partidos de liga de esta fecha (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrapear partidos FT de la Liga
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          if [ -n "${{ inputs.force_date }}" ]; then
            python scripts/fetch_liga_partidos.py --torneo clausura --force --date "${{ inputs.force_date }}"
          else
            python scripts/fetch_liga_partidos.py --torneo clausura
          fi

      - name: Scrapear partidos FT de copa (clubes vivos, octavos en adelante)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/fetch_liga_partidos.py --competicion copas

      # Tabla xG ("moral"): solo lee data/partidos, sin llamadas a APIs.
      - name: Tabla xG
        run: python scripts/build_tabla_xg.py

      - name: Commit stats de partidos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: stats de partidos de Liga [skip ci]'
          file_pattern: 'data/partidos/*.json data/tabla_xg.json'
