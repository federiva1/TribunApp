# Consulta puntual a api-sports desde Actions (donde vive el secret) para
# diagnosticar respuestas en vivo — el resultado queda en el log del job.
name: debug-apisports
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Endpoint + query (ej: fixtures/lineups?fixture=1493101)'
        required: true
        type: string
      jq:
        description: 'Filtro jq opcional (ej: .response[0].fixture.status)'
        required: false
        default: '.'
        type: string
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query api-sports
        env:
          QPATH: ${{ inputs.path }}
          QJQ: ${{ inputs.jq }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          curl -sS "https://v3.football.api-sports.io/$QPATH" \
            -H "x-apisports-key: $API_SPORTS_KEY" | jq "$QJQ"
