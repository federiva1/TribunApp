name: Mundial — Post-Match Stats

on:
  # schedule desactivado — usamos modo "compu prendida" (scheduled tasks locales).
  # Los crons quedan archivados abajo por si se reactiva la automatización cloud.
  workflow_dispatch:

# CRONS ARCHIVADOS (no activos):
#   "20 19 14 6 *" Germany vs Curacao        | "20 22 14 6 *" Netherlands vs Japan
#   "20 1 15 6 *"  Ivory Coast vs Ecuador    | "20 4 15 6 *"  Sweden vs Tunisia
#   "20 18 15 6 *" Spain vs Cape Verde       | "20 21 15 6 *" Belgium vs Egypt
#   ... (kickoff UTC + 2h20m grupos / +3h15m eliminatorias)

jobs:
  post-match:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Update mundial fixtures
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/fetch_mundial_fixtures.py

      - name: Fetch match stats — api-sports
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/fetch_mundial_match.py --auto

      - name: Fetch player stats — FotMob
        run: |
          python scripts/scrape_fotmob_mundial.py --auto \
            || echo "::warning::FotMob scraper falló (posible bloqueo). Stats de api-sports son suficientes."

      - name: Update standings
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/fetch_mundial_standings.py

      - name: Open/close puntajes (ventana 24h)
        run: python scripts/fetch_mundial_estado.py --force

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update mundial data [skip ci]"
          file_pattern: >
            data/fixtures/mundial.json
            data/estado_mundial.json
            data/partidos/*.json
            data/partidos/index.json
