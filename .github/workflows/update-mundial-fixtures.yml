name: Update Mundial Fixtures

on:
  schedule:
    # Cada hora durante el Mundial (11 jun – 19 jul 2026)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Mundial fixtures
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/fetch_mundial_fixtures.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update mundial fixtures [skip ci]'
          file_pattern: data/fixtures/mundial.json
