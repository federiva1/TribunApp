name: Close Puntajes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Close expired puntajes
        run: python scripts/close_puntajes.py

      - name: Commit estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: cerrar puntajes expirados [skip ci]'
          file_pattern: 'data/estado.json'
