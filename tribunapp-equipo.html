<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TribunApp — Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--dark:#0d0d1a;--dark2:#13131f;--acento:#f5c518;--gold:#f5c518;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;}
#app{background:var(--dark2);max-width:480px;margin:0 auto;min-height:100vh;}

.header{
  display:flex;align-items:center;gap:12px;padding:14px 14px 12px;
  border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background-color:var(--dark2);
}
.header-back{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;
  color:rgba(255,255,255,.5);text-decoration:none;display:flex;align-items:center;gap:4px;
}
.header-back:hover{color:#fff;}
.header-info{flex:1;display:flex;align-items:center;gap:10px;}
.header-escudo{width:32px;height:32px;object-fit:contain;}
.header-nombre{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;}
.header-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.35);}

/* MATCH BANNER */
.match-banner{
  margin:16px 16px 0;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:16px;
  display:flex;align-items:center;gap:14px;
}
.mb-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.mb-escudo{width:44px;height:44px;object-fit:contain;}
.mb-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-align:center;color:#fff;line-height:1.2;}
.mb-sep{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
.mb-vs{font-family:'Bebas Neue',sans-serif;font-size:22px;color:rgba(255,255,255,.3);}
.mb-fecha{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.25);text-transform:uppercase;text-align:center;white-space:nowrap;}

.content{padding:20px 16px 60px;}

.slab{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;
  color:rgba(255,255,255,.3);text-transform:uppercase;margin:20px 0 8px;
}

.msg-center{text-align:center;padding:40px 20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}

/* FORMACIONES */
.form-list{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.form-header{display:flex;padding:8px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);}
.form-header span:first-child{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.3);text-transform:uppercase;}
.form-header .fh-col{width:52px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}
.form-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.04);}
.form-row:last-child{border-bottom:none;}
.form-row-foto{width:30px;height:30px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.07);flex-shrink:0;}
.form-row.dt{background:rgba(245,197,24,.08);border-left:3px solid var(--gold);}
.form-row.dt .form-row-name{color:var(--gold);}
.form-row-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.form-row-pct{width:52px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#42a5f5;}
.form-row-bar{width:52px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin:0 8px;}
.form-row-bar-fill{height:100%;border-radius:2px;background:#42a5f5;}

/* PODIO */
.podio{display:flex;gap:8px;margin-bottom:20px;}
.podio-item{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 8px;text-align:center;}
.podio-foto{width:44px;height:44px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);margin:0 auto 6px;display:block;}
.podio-medal{font-size:20px;margin-bottom:6px;}
.podio-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;line-height:1.2;}
.podio-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);}
.podio-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <a class="header-back" href="estadisticas-tribunapp.html">&#8592; Volver</a>
    <div class="header-info">
      <img class="header-escudo" id="h-escudo" src="" alt="">
      <div>
        <div class="header-nombre" id="h-nombre"></div>
        <div class="header-sub">TRIBUNAPP &middot; MUNDIAL 2026</div>
      </div>
    </div>
  </div>

  <div class="match-banner" id="match-banner" style="display:none">
    <div class="mb-team">
      <img class="mb-escudo" id="mb-esc-local" src="" alt="" onerror="this.style.opacity='.2'">
      <div class="mb-name" id="mb-nom-local"></div>
    </div>
    <div class="mb-sep">
      <div class="mb-vs">VS</div>
      <div class="mb-fecha" id="mb-fecha"></div>
    </div>
    <div class="mb-team">
      <img class="mb-escudo" id="mb-esc-rival" src="" alt="" onerror="this.style.opacity='.2'">
      <div class="mb-name" id="mb-nom-rival"></div>
    </div>
  </div>

  <div class="content">
    <div id="main-content">
      <div class="msg-center">Cargando&hellip;</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
var NAMES_ES = {
  czechia:'Chequia',mexico:'México',southafrica:'Sudáfrica',southkorea:'Corea del Sur',
  bosniaandherzegovina:'Bosnia y Herz.',canada:'Canadá',qatar:'Qatar',switzerland:'Suiza',
  brazil:'Brasil',haiti:'Haití',morocco:'Marruecos',scotland:'Escocia',
  australia:'Australia',paraguay:'Paraguay',turkiye:'Turquía',usa:'Estados Unidos',
  curacao:'Curazao',ecuador:'Ecuador',germany:'Alemania',ivorycoast:'Costa de Marfil',
  japan:'Japón',netherlands:'Países Bajos',sweden:'Suecia',tunisia:'Túnez',
  belgium:'Bélgica',egypt:'Egipto',iran:'Irán',newzealand:'Nueva Zelanda',
  capeverde:'Cabo Verde',saudiarabia:'Arabia Saudita',spain:'España',uruguay:'Uruguay',
  france:'Francia',iraq:'Irak',norway:'Noruega',senegal:'Senegal',
  algeria:'Argelia',argentina:'Argentina',austria:'Austria',jordan:'Jordania',
  colombia:'Colombia',drcongo:'Rep. D. del Congo',portugal:'Portugal',uzbekistan:'Uzbekistán',
  croatia:'Croacia',england:'Inglaterra',ghana:'Ghana',panama:'Panamá'
};

var params = new URLSearchParams(location.search);
var slug = params.get('c');
if (!slug) location.href = 'estadisticas-tribunapp.html';

var SB_URL = typeof _SUPABASE_URL !== 'undefined' ? _SUPABASE_URL : '';
var SB_KEY = typeof _SUPABASE_KEY !== 'undefined' ? _SUPABASE_KEY : '';
var SB_H   = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

document.getElementById('h-escudo').src = 'escudos/' + slug + '.png';
document.getElementById('h-nombre').textContent = (NAMES_ES[slug] || slug).toUpperCase();

function calcFormaciones(rows) {
  var counts = {}, total = rows.length;
  rows.forEach(function(r) {
    (r.jugadores || []).forEach(function(j) {
      var k = j.name || ('#' + j.num);
      if (!counts[k]) counts[k] = { name: k, fid: j.fid || 0, count: 0 };
      counts[k].count++;
    });
  });
  return Object.values(counts)
    .map(function(p) { return Object.assign({}, p, { pct: Math.round((p.count / total) * 100) }); })
    .sort(function(a, b) { return b.pct - a.pct; });
}

function calcPuntajes(rows) {
  var totals = {}, counts = {};
  rows.forEach(function(r) {
    Object.entries(r.puntajes || {}).forEach(function(entry) {
      var num = entry[0], val = entry[1];
      totals[num] = (totals[num] || 0) + Number(val);
      counts[num] = (counts[num] || 0) + 1;
    });
  });
  return Object.keys(totals).map(function(num) {
    return { num: num, avg: +(totals[num] / counts[num]).toFixed(1), votes: counts[num] };
  }).sort(function(a, b) { return b.avg - a.avg; });
}

function renderFormList(players, container) {
  if (!players.length) {
    var d = document.createElement('div'); d.className = 'msg-center'; d.textContent = 'Sin formaciones aún';
    container.appendChild(d); return;
  }
  var wrap = document.createElement('div'); wrap.className = 'form-list';
  var hdr = document.createElement('div'); hdr.className = 'form-header';
  hdr.innerHTML = '<span>JUGADOR</span><span class="fh-col">%</span>';
  wrap.appendChild(hdr);
  players.forEach(function(p) {
    var row = document.createElement('div'); row.className = 'form-row';
    var foto = p.fid ? '<img class="form-row-foto" src="fotos/' + p.fid + '.png" alt="" onerror="this.style.opacity=\'.2\'">' : '<div class="form-row-foto"></div>';
    row.innerHTML = foto +
      '<div class="form-row-name">' + p.name + '</div>' +
      '<div class="form-row-bar"><div class="form-row-bar-fill" style="width:' + p.pct + '%"></div></div>' +
      '<div class="form-row-pct">' + p.pct + '%</div>';
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function esDT(num) { return num === '' || num == null || String(num) === '0'; }
function dtEntry(squad) { return squad && squad.find(function(s) { return s.tipo === 'dt'; }); }
function puntName(num, squad) {
  if (esDT(num)) { var dt = dtEntry(squad); return dt && dt.name ? dt.name : 'D.T.'; }
  var sq = squad && squad.find(function(s) { return String(s.num) === String(num); });
  return sq ? sq.name : '#' + num;
}
function puntFid(num, squad) {
  if (esDT(num)) { var dt = dtEntry(squad); return dt ? dt.fid : null; }
  var sq = squad && squad.find(function(s) { return String(s.num) === String(num); });
  return sq ? sq.fid : null;
}

function renderPodio(players, container, squad) {
  if (!players.length) {
    var d = document.createElement('div'); d.className = 'msg-center'; d.textContent = 'Sin puntajes aún';
    container.appendChild(d); return;
  }
  // El DT nunca entra al podio ni se ordena con los jugadores: va siempre al final
  var jugadores = players.filter(function(p) { return !esDT(p.num); });
  var dts       = players.filter(function(p) { return esDT(p.num); });

  var top3 = jugadores.slice(0, 3);
  var medals = ['🥇','🥈','🥉'];
  var podioEl = document.createElement('div'); podioEl.className = 'podio';
  top3.forEach(function(p, i) {
    var fid = puntFid(p.num, squad);
    var item = document.createElement('div'); item.className = 'podio-item';
    var foto = fid ? '<img class="podio-foto" src="fotos/' + fid + '.png" alt="" onerror="this.style.opacity=\'.1\'">' : '<div class="podio-foto"></div>';
    item.innerHTML = foto +
      '<div class="podio-medal">' + medals[i] + '</div>' +
      '<div class="podio-name">' + puntName(p.num, squad) + '</div>' +
      '<div class="podio-val">' + p.avg + '</div>' +
      '<div class="podio-label">' + p.votes + ' voto' + (p.votes !== 1 ? 's' : '') + '</div>';
    podioEl.appendChild(item);
  });
  container.appendChild(podioEl);

  var resto = jugadores.slice(3).concat(dts);
  if (resto.length) {
    var list = document.createElement('div'); list.className = 'form-list';
    var lhdr = document.createElement('div'); lhdr.className = 'form-header';
    lhdr.innerHTML = '<span>JUGADOR</span><span class="fh-col">PROM.</span>';
    list.appendChild(lhdr);
    resto.forEach(function(p) {
      var isDT = esDT(p.num);
      var fid = puntFid(p.num, squad);
      var row = document.createElement('div'); row.className = 'form-row' + (isDT ? ' dt' : '');
      var foto = fid ? '<img class="form-row-foto" src="fotos/' + fid + '.png" alt="" onerror="this.style.opacity=\'.1\'">' : '<div class="form-row-foto"></div>';
      row.innerHTML = foto +
        '<div class="form-row-name">' + puntName(p.num, squad) + '</div>' +
        '<div class="form-row-pct" style="color:var(--gold)">' + p.avg + '</div>';
      list.appendChild(row);
    });
    container.appendChild(list);
  }
}

function renderContent(formaciones, puntajes, squad, mainEl) {
  mainEl.innerHTML = '';
  if (!formaciones.length && !puntajes.length) {
    mainEl.innerHTML = '<div class="msg-center">Aún no hay votos para este partido.</div>';
    return;
  }
  if (formaciones.length) {
    var sl1 = document.createElement('div'); sl1.className = 'slab';
    sl1.textContent = 'Elección de formación · ' + formaciones.length + ' voto' + (formaciones.length !== 1 ? 's' : '');
    mainEl.appendChild(sl1);
    renderFormList(calcFormaciones(formaciones), mainEl);
  }
  if (puntajes.length) {
    var sl2 = document.createElement('div'); sl2.className = 'slab';
    sl2.textContent = 'Puntajes · ' + puntajes.length + ' voto' + (puntajes.length !== 1 ? 's' : '');
    mainEl.appendChild(sl2);
    renderPodio(calcPuntajes(puntajes), mainEl, squad);
  }
}

async function init() {
  var mainEl = document.getElementById('main-content');

  var estado = null;
  try {
    var r0 = await fetch('data/estado_mundial.json?v=' + Date.now());
    var json0 = await r0.json();
    estado = json0[slug] || null;
  } catch(e) {}

  var squad = [];
  try {
    var rp = await fetch('data/planteles/' + slug + '.json');
    if (rp.ok) {
      var raw = await rp.json();
      var arr = raw.jugadores || raw;
      if (Array.isArray(arr)) {
        squad = arr.map(function(p) {
          return { num: p.num != null ? p.num : p.numero, name: p.name || p.nombre, fid: p.fid };
        });
      }
      // El DT (técnico) — su foto está guardada con tecnico.fid del plantel
      if (raw.tecnico) {
        squad.push({ num: '', name: raw.tecnico.nombre, fid: raw.tecnico.fid, tipo: 'dt' });
      }
    }
  } catch(e) {}

  var rival     = estado ? (estado.rival      || '') : '';
  var matchDate = estado ? (estado.match_date || '') : '';

  if (rival && matchDate) {
    var fechaFmt = new Date(matchDate + 'T12:00:00').toLocaleDateString('es-AR', { day:'numeric', month:'short', year:'numeric' });

    var roundLabel = '';
    try {
      var rm = await fetch('data/fixtures/mundial.json');
      var partidos = await rm.json();
      var found = partidos.find(function(p) {
        return p.date === matchDate && p.home && p.away && (
          (p.home.slug === slug && p.away.slug === rival) ||
          (p.away.slug === slug && p.home.slug === rival)
        );
      });
      if (found && found.roundName) roundLabel = found.roundName;
      else if (found && found.round) roundLabel = 'Fecha ' + found.round;
    } catch(e) {}

    document.getElementById('match-banner').style.display = 'flex';
    document.getElementById('mb-esc-local').src  = 'escudos/' + slug  + '.png';
    document.getElementById('mb-nom-local').textContent  = (NAMES_ES[slug]  || slug).toUpperCase();
    document.getElementById('mb-esc-rival').src  = 'escudos/' + rival + '.png';
    document.getElementById('mb-nom-rival').textContent  = (NAMES_ES[rival] || rival).toUpperCase();
    document.getElementById('mb-fecha').textContent = (roundLabel ? roundLabel + ' · ' : '') + fechaFmt;
  }

  if (!SB_URL) { mainEl.innerHTML = '<div class="msg-center">Sin datos aún.</div>'; return; }

  var formaciones = [], puntajes = [];
  try {
    var fBase = SB_URL + '/rest/v1/formaciones?select=jugadores,match_date,rival&club=eq.' + slug;
    var pBase = SB_URL + '/rest/v1/puntajes?select=puntajes,match_date,rival&club=eq.'    + slug;
    var fUrl = fBase + (matchDate && rival ? '&match_date=eq.' + matchDate + '&rival=eq.' + rival : '&order=match_date.desc');
    var pUrl = pBase + (matchDate && rival ? '&match_date=eq.' + matchDate + '&rival=eq.' + rival : '&order=match_date.desc');
    var results = await Promise.all([fetch(fUrl, {headers: SB_H}), fetch(pUrl, {headers: SB_H})]);
    formaciones = await results[0].json() || [];
    puntajes    = await results[1].json() || [];
  } catch(e) {
    mainEl.innerHTML = '<div class="msg-center">Error cargando datos.</div>';
    return;
  }

  renderContent(formaciones, puntajes, squad, mainEl);
}

init();
</script>
<script src="js/ui-help.js"></script>
</body>
</html>
