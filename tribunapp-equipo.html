<style>
:root{--dark:#0d0d1a;--dark2:#13131f;--acento:#f5c518;--gold:#f5c518;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;}
#app{background:var(--dark2);max-width:480px;margin:0 auto;min-height:100vh;}

.header{
  display:flex;align-items:center;gap:12px;padding:14px 14px 12px;
  border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background-color:var(--dark2);
}
.header-back{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;
  color:rgba(255,255,255,.5);text-decoration:none;display:flex;align-items:center;gap:4px;
}
.header-back:hover{color:#fff;}
.header-info{flex:1;display:flex;align-items:center;gap:10px;}
.header-escudo{width:32px;height:32px;object-fit:contain;}
.header-nombre{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;}
.header-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.35);}

/* MATCH BANNER */
.match-banner{
  margin:16px 16px 0;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:16px;
  display:flex;align-items:center;gap:14px;
}
.mb-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.mb-escudo{width:44px;height:44px;object-fit:contain;}
.mb-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-align:center;color:#fff;line-height:1.2;}
.mb-sep{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
.mb-vs{font-family:'Bebas Neue',sans-serif;font-size:22px;color:rgba(255,255,255,.3);}
.mb-fecha{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.25);text-transform:uppercase;text-align:center;white-space:nowrap;}

.content{padding:20px 16px 60px;}

.slab{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;
  color:rgba(255,255,255,.3);text-transform:uppercase;margin:20px 0 8px;
}

.msg-center{text-align:center;padding:40px 20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}

/* FORMACIONES */
.form-list{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.form-header{display:flex;padding:8px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);}
.form-header span:first-child{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.3);text-transform:uppercase;}
.form-header .fh-col{width:52px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}
.form-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.04);}
.form-row:last-child{border-bottom:none;}
.form-row-foto{width:30px;height:30px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.07);flex-shrink:0;}
.fecha-sel{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.fecha-sel::-webkit-scrollbar{height:3px;}
.fecha-sel::-webkit-scrollbar-thumb{background:#444;border-radius:4px;}
.fecha-btn{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:6px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.fecha-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:600;}
.sub-tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap;}
.sub-tab{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.55);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.sub-tab.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;}
.form-row-votes{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap;margin-right:10px;}
/* Equipos de la gente */
.eq-card{margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;position:relative;}
.eq-card.top{border-color:rgba(245,197,24,.45);}
.eq-badge{position:absolute;top:8px;right:8px;font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:20px;z-index:5;background:rgba(245,197,24,.18);color:var(--gold);border:1px solid rgba(245,197,24,.4);}
.eq-hdr{display:flex;align-items:center;padding:9px 12px 4px;}
.eq-hdr-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.4);}
.eq-hdr-date{font-size:10px;color:rgba(255,255,255,.18);}
.eq-pitch{width:100%;aspect-ratio:.82;background:#2d7a3a;position:relative;overflow:hidden;}
.eq-pl{position:absolute;}
.eq-pc{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);}
.eq-stripe{position:absolute;top:0;bottom:0;width:12.5%;}
.eq-stripe.odd{background:rgba(0,0,0,.06);}
.eq-pp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2;}
.eq-bubble{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.9);overflow:hidden;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.eq-bubble img{width:100%;height:100%;object-fit:cover;object-position:top;}
.eq-bubble span{font-family:'Bebas Neue',sans-serif;font-size:11px;color:#1a1a1a;}
.eq-pp-name{font-family:'Bebas Neue',sans-serif;font-size:8px;color:#fff;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 4px;line-height:1.5;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;}
.eq-footer{display:flex;align-items:center;padding:8px 12px;}
.eq-like{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:13px;color:#aaa;transition:all .15s;}
.eq-like.liked{background:rgba(245,197,24,.18);border-color:var(--gold);color:var(--gold);}
.eq-like b{font-family:'Bebas Neue',sans-serif;font-size:14px;font-weight:400;}
.form-row.dt{background:rgba(245,197,24,.08);border-left:3px solid var(--gold);}
.form-row.dt .form-row-name{color:var(--gold);}
.form-row-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.form-row-pct{width:52px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#42a5f5;}
.form-row-bar{width:52px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin:0 8px;}
.form-row-bar-fill{height:100%;border-radius:2px;background:#42a5f5;}

/* PODIO */
.podio{display:flex;gap:8px;margin-bottom:20px;}
.podio-item{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 8px;text-align:center;}
.podio-foto{width:44px;height:44px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);margin:0 auto 6px;display:block;}
.podio-medal{font-size:20px;margin-bottom:6px;}
.podio-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;line-height:1.2;}
.podio-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);}
.podio-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}
</style>
</head>

<script src="js/config.js"></script>
<script>
var NAMES_ES = {
  czechia:'Chequia',mexico:'México',southafrica:'Sudáfrica',southkorea:'Corea del Sur',
  bosniaandherzegovina:'Bosnia y Herz.',canada:'Canadá',qatar:'Qatar',switzerland:'Suiza',
  brazil:'Brasil',haiti:'Haití',morocco:'Marruecos',scotland:'Escocia',
  australia:'Australia',paraguay:'Paraguay',turkiye:'Turquía',usa:'Estados Unidos',
  curacao:'Curazao',ecuador:'Ecuador',germany:'Alemania',ivorycoast:'Costa de Marfil',
  japan:'Japón',netherlands:'Países Bajos',sweden:'Suecia',tunisia:'Túnez',
  belgium:'Bélgica',egypt:'Egipto',iran:'Irán',newzealand:'Nueva Zelanda',
  capeverde:'Cabo Verde',saudiarabia:'Arabia Saudita',spain:'España',uruguay:'Uruguay',
  france:'Francia',iraq:'Irak',norway:'Noruega',senegal:'Senegal',
  algeria:'Argelia',argentina:'Argentina',austria:'Austria',jordan:'Jordania',
  colombia:'Colombia',drcongo:'Rep. D. del Congo',portugal:'Portugal',uzbekistan:'Uzbekistán',
  croatia:'Croacia',england:'Inglaterra',ghana:'Ghana',panama:'Panamá'
};

var params = new URLSearchParams(location.search);
var slug = params.get('c');
if (!slug) location.href = 'estadisticas-tribunapp.html';

var SB_URL = typeof _SUPABASE_URL !== 'undefined' ? _SUPABASE_URL : '';
var SB_KEY = typeof _SUPABASE_KEY !== 'undefined' ? _SUPABASE_KEY : '';
var SB_H   = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

document.getElementById('h-escudo').src = 'escudos/' + slug + '.png';
document.getElementById('h-nombre').textContent = (NAMES_ES[slug] || slug).toUpperCase();

function calcFormaciones(rows) {
  var counts = {}, total = rows.length;
  rows.forEach(function(r) {
    (r.jugadores || []).forEach(function(j) {
      var k = j.name || ('#' + j.num);
      if (!counts[k]) counts[k] = { name: k, fid: j.fid || 0, count: 0 };
      counts[k].count++;
    });
  });
  return Object.values(counts)
    .map(function(p) { return Object.assign({}, p, { pct: Math.round((p.count / total) * 100) }); })
    .sort(function(a, b) { return b.pct - a.pct; });
}

function calcPuntajes(rows) {
  var totals = {}, counts = {}, seen = {};
  rows.forEach(function(r) {
    Object.entries(r.puntajes || {}).forEach(function(entry) {
      var num = entry[0], val = entry[1];
      seen[num] = (seen[num] || 0) + 1;
      if (val === null || val === undefined || val === '') return; // S/P no cuenta para el promedio
      var n = Number(val);
      if (isNaN(n)) return;
      totals[num] = (totals[num] || 0) + n;
      counts[num] = (counts[num] || 0) + 1;
    });
  });
  return Object.keys(seen).map(function(num) {
    var c = counts[num] || 0;
    return { num: num, avg: c > 0 ? +(totals[num] / c).toFixed(1) : null, votes: c };
  }).sort(function(a, b) {
    return (b.avg == null ? -1 : b.avg) - (a.avg == null ? -1 : a.avg);
  });
}

function renderFormList(players, container) {
  if (!players.length) {
    var d = document.createElement('div'); d.className = 'msg-center'; d.textContent = 'Sin formaciones aún';
    container.appendChild(d); return;
  }
  var wrap = document.createElement('div'); wrap.className = 'form-list';
  var hdr = document.createElement('div'); hdr.className = 'form-header';
  hdr.innerHTML = '<span>JUGADOR</span><span class="fh-col">%</span>';
  wrap.appendChild(hdr);
  players.forEach(function(p) {
    var row = document.createElement('div'); row.className = 'form-row';
    var foto = p.fid ? '<img class="form-row-foto" src="fotos/' + p.fid + '.png" alt="" onerror="this.style.opacity=\'.2\'">' : '<div class="form-row-foto"></div>';
    row.innerHTML = foto +
      '<div class="form-row-name">' + p.name + '</div>' +
      '<div class="form-row-votes">' + p.count + ' voto' + (p.count !== 1 ? 's' : '') + '</div>' +
      '<div class="form-row-bar"><div class="form-row-bar-fill" style="width:' + p.pct + '%"></div></div>' +
      '<div class="form-row-pct">' + p.pct + '%</div>';
    wrap.appendChild(row);
  });
  container.appendChild(wrap);
}

function esDT(num) { return num === '' || num == null || String(num) === '0'; }
function dtEntry(squad) { return squad && squad.find(function(s) { return s.tipo === 'dt'; }); }
function puntName(num, squad) {
  if (esDT(num)) { var dt = dtEntry(squad); return dt && dt.name ? dt.name : 'D.T.'; }
  var sq = squad && squad.find(function(s) { return String(s.num) === String(num); });
  return sq ? sq.name : '#' + num;
}
function puntFid(num, squad) {
  if (esDT(num)) { var dt = dtEntry(squad); return dt ? dt.fid : null; }
  var sq = squad && squad.find(function(s) { return String(s.num) === String(num); });
  return sq ? sq.fid : null;
}

function renderPodio(players, container, squad) {
  if (!players.length) {
    var d = document.createElement('div'); d.className = 'msg-center'; d.textContent = 'Sin puntajes aún';
    container.appendChild(d); return;
  }
  // El DT nunca entra al podio ni se ordena con los jugadores: va siempre al final
  var jugadores = players.filter(function(p) { return !esDT(p.num); });
  var dts       = players.filter(function(p) { return esDT(p.num); });

  var top3 = jugadores.slice(0, 3);
  var medals = ['🥇','🥈','🥉'];
  var podioEl = document.createElement('div'); podioEl.className = 'podio';
  top3.forEach(function(p, i) {
    var fid = puntFid(p.num, squad);
    var item = document.createElement('div'); item.className = 'podio-item';
    var foto = fid ? '<img class="podio-foto" src="fotos/' + fid + '.png" alt="" onerror="this.style.opacity=\'.1\'">' : '<div class="podio-foto"></div>';
    item.innerHTML = foto +
      '<div class="podio-medal">' + medals[i] + '</div>' +
      '<div class="podio-name">' + puntName(p.num, squad) + '</div>' +
      '<div class="podio-val">' + (p.avg == null ? '—' : p.avg) + '</div>' +
      '<div class="podio-label">' + p.votes + ' voto' + (p.votes !== 1 ? 's' : '') + '</div>';
    podioEl.appendChild(item);
  });
  container.appendChild(podioEl);

  var resto = jugadores.slice(3).concat(dts);
  if (resto.length) {
    var list = document.createElement('div'); list.className = 'form-list';
    var lhdr = document.createElement('div'); lhdr.className = 'form-header';
    lhdr.innerHTML = '<span>JUGADOR</span><span class="fh-col">PROM.</span>';
    list.appendChild(lhdr);
    resto.forEach(function(p) {
      var isDT = esDT(p.num);
      var fid = puntFid(p.num, squad);
      var row = document.createElement('div'); row.className = 'form-row' + (isDT ? ' dt' : '');
      var foto = fid ? '<img class="form-row-foto" src="fotos/' + fid + '.png" alt="" onerror="this.style.opacity=\'.1\'">' : '<div class="form-row-foto"></div>';
      row.innerHTML = foto +
        '<div class="form-row-name">' + puntName(p.num, squad) + '</div>' +
        '<div class="form-row-pct" style="color:var(--gold)">' + (p.avg == null ? '—' : p.avg) + '</div>';
      list.appendChild(row);
    });
    container.appendChild(list);
  }
}

// ── Equipos de la gente (formaciones individuales con likes) ─────────────────
function getDeviceId() {
  var id = localStorage.getItem('tribunapp_device_id');
  if (!id) { id = 'dev_' + Math.random().toString(36).slice(2, 14) + Date.now().toString(36); localStorage.setItem('tribunapp_device_id', id); }
  return id;
}
function getFeedLikes() { try { return JSON.parse(localStorage.getItem('tribunapp_feed_likes') || '{}'); } catch(e) { return {}; } }
function saveFeedLikes(o) { try { localStorage.setItem('tribunapp_feed_likes', JSON.stringify(o)); } catch(e) {} }
async function toggleLike(rowId, curLikes) {
  var liked = getFeedLikes(); var was = !!liked[rowId]; var nl = curLikes;
  if (was) { delete liked[rowId]; nl = Math.max(0, nl - 1); } else { liked[rowId] = true; nl++; }
  saveFeedLikes(liked);
  try {
    await fetch(SB_URL + '/rest/v1/formaciones?id=eq.' + rowId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ likes: nl })
    });
  } catch(e) {}
  return { likes: nl, isLiked: !!liked[rowId] };
}
function eqMiniPitch(jugadores) {
  var pitch = document.createElement('div'); pitch.className = 'eq-pitch';
  for (var i = 0; i < 8; i++) { var s = document.createElement('div'); s.className = 'eq-stripe' + (i % 2 ? ' odd' : ''); s.style.left = (i * 12.5) + '%'; pitch.appendChild(s); }
  var marks = [
    'left:5%;right:5%;top:0;border-top:1.5px solid rgba(255,255,255,.45);height:0',
    'left:5%;right:5%;bottom:0;border-bottom:1.5px solid rgba(255,255,255,.45);height:0',
    'left:5%;top:0;bottom:0;width:0;border-left:1.5px solid rgba(255,255,255,.45)',
    'right:5%;top:0;bottom:0;width:0;border-left:1.5px solid rgba(255,255,255,.45)',
    'left:5%;right:5%;top:50%;height:0;border-top:1.5px solid rgba(255,255,255,.45)',
    'left:21%;right:21%;top:0;height:18%;border:1.5px solid rgba(255,255,255,.45);border-top:none',
    'left:21%;right:21%;bottom:0;height:18%;border:1.5px solid rgba(255,255,255,.45);border-bottom:none',
    'left:33%;right:33%;top:0;height:9%;border:1.5px solid rgba(255,255,255,.45);border-top:none',
    'left:33%;right:33%;bottom:0;height:9%;border:1.5px solid rgba(255,255,255,.45);border-bottom:none'
  ];
  marks.forEach(function(m) { var d = document.createElement('div'); d.className = 'eq-pl'; d.style.cssText = m; pitch.appendChild(d); });
  var c = document.createElement('div'); c.className = 'eq-pc'; c.style.cssText = 'left:50%;top:50%;width:18%;padding-top:18%;transform:translate(-50%,-50%)'; pitch.appendChild(c);
  (jugadores || []).forEach(function(j) {
    var el = document.createElement('div'); el.className = 'eq-pp'; el.style.left = (j.x != null ? j.x : 50) + '%'; el.style.top = (j.y != null ? j.y : 50) + '%';
    var b = document.createElement('div'); b.className = 'eq-bubble';
    if (j.fid) { var img = document.createElement('img'); img.src = 'fotos/' + j.fid + '.png'; img.onerror = function(){ this.style.display = 'none'; }; b.appendChild(img); }
    else { var sp = document.createElement('span'); sp.textContent = j.num || ''; b.appendChild(sp); }
    var nm = document.createElement('div'); nm.className = 'eq-pp-name'; nm.textContent = (j.name || j.num || '').split(' ').slice(-1)[0];
    el.appendChild(b); el.appendChild(nm); pitch.appendChild(el);
  });
  return pitch;
}
function renderEquiposGente(formaciones, container) {
  var valid = formaciones.filter(function(f) { return f.jugadores && f.jugadores.length >= 10; })
    .sort(function(a, b) { return (b.likes || 0) - (a.likes || 0) || (b.created_at || '').localeCompare(a.created_at || ''); });
  if (!valid.length) return;
  var deviceId = getDeviceId();
  var likedMap = getFeedLikes();
  valid.forEach(function(row, idx) {
    var isMine = row.device_id === deviceId;
    var isTop = idx === 0 && (row.likes || 0) > 0;
    var card = document.createElement('div'); card.className = 'eq-card' + (isTop ? ' top' : '');
    if (isTop || isMine) {
      var badge = document.createElement('div'); badge.className = 'eq-badge';
      if (isMine) { badge.textContent = 'TU FORMACIÓN'; badge.style.background = 'rgba(66,165,245,.18)'; badge.style.color = '#42a5f5'; badge.style.borderColor = 'rgba(66,165,245,.4)'; }
      else { badge.textContent = '⭐ MÁS LIKES'; }
      card.appendChild(badge);
    }
    var hdr = document.createElement('div'); hdr.className = 'eq-hdr';
    var hn = document.createElement('div'); hn.className = 'eq-hdr-name'; hn.textContent = isMine ? 'Tu formación' : 'Hincha';
    var hd = document.createElement('div'); hd.className = 'eq-hdr-date';
    if (row.created_at) { var dt = new Date(row.created_at); hd.textContent = dt.getDate() + '/' + (dt.getMonth() + 1); }
    hdr.appendChild(hn); hdr.appendChild(hd); card.appendChild(hdr);
    card.appendChild(eqMiniPitch(row.jugadores));
    var footer = document.createElement('div'); footer.className = 'eq-footer';
    var likes = row.likes || 0;
    var btn = document.createElement('button'); btn.className = 'eq-like' + (likedMap[row.id] ? ' liked' : '');
    btn.innerHTML = '♥ <b>' + likes + '</b>';
    btn.addEventListener('click', function() {
      toggleLike(row.id, likes).then(function(res) {
        likes = res.likes;
        btn.className = 'eq-like' + (res.isLiked ? ' liked' : '');
        btn.innerHTML = '♥ <b>' + likes + '</b>';
      });
    });
    footer.appendChild(btn); card.appendChild(footer);
    container.appendChild(card);
  });
}

function renderContent(formaciones, puntajes, squad, contentEl, rivalName) {
  contentEl.innerHTML = '';
  if (!formaciones.length && !puntajes.length) {
    contentEl.innerHTML = '<div class="msg-center">Aún no hay votos en este scope.</div>';
    return;
  }
  var vs = rivalName ? ' · vs ' + rivalName : '';

  // Secciones disponibles (puntajes solo si hay ≥1)
  var sections = [];
  if (puntajes.length) sections.push({ id: 'puntajes', label: 'Puntajes' });
  if (formaciones.length) sections.push({ id: 'jugadores', label: 'Jugadores' });
  if (formaciones.length) sections.push({ id: 'equipos', label: 'Equipos de la gente' });

  var subSel = document.createElement('div'); subSel.className = 'sub-tabs';
  var body = document.createElement('div');

  function slab(txt) { var d = document.createElement('div'); d.className = 'slab'; d.textContent = txt; return d; }

  function renderSection(id) {
    body.innerHTML = '';
    if (id === 'puntajes') {
      body.appendChild(slab('Puntajes' + vs + ' · ' + puntajes.length + ' voto' + (puntajes.length !== 1 ? 's' : '')));
      renderPodio(calcPuntajes(puntajes), body, squad);
    } else if (id === 'jugadores') {
      body.appendChild(slab('Formación más votada' + vs + ' · ' + formaciones.length + ' voto' + (formaciones.length !== 1 ? 's' : '')));
      renderFormList(calcFormaciones(formaciones), body);
    } else {
      body.appendChild(slab('Equipos de la gente' + vs + ' · ' + formaciones.length + ' equipo' + (formaciones.length !== 1 ? 's' : '')));
      renderEquiposGente(formaciones, body);
    }
    Array.prototype.forEach.call(subSel.children, function(b) { b.classList.toggle('active', b.dataset.id === id); });
  }

  sections.forEach(function(s) {
    var b = document.createElement('button'); b.className = 'sub-tab'; b.dataset.id = s.id; b.textContent = s.label;
    b.addEventListener('click', function() { renderSection(s.id); });
    subSel.appendChild(b);
  });
  contentEl.appendChild(subSel); contentEl.appendChild(body);
  renderSection(sections[0].id);
}

async function init() {
  var mainEl = document.getElementById('main-content');

  var estado = null;
  try {
    var r0 = await fetch('data/estado_mundial.json?v=' + Date.now());
    var json0 = await r0.json();
    estado = json0[slug] || null;
  } catch(e) {}

  var squad = [];
  try {
    var rp = await fetch('data/planteles/' + slug + '.json');
    if (rp.ok) {
      var raw = await rp.json();
      var arr = raw.jugadores || raw;
      if (Array.isArray(arr)) {
        squad = arr.map(function(p) {
          return { num: p.num != null ? p.num : p.numero, name: p.name || p.nombre, fid: p.fid };
        });
      }
      // El DT (técnico) — su foto está guardada con tecnico.fid del plantel
      if (raw.tecnico) {
        squad.push({ num: '', name: raw.tecnico.nombre, fid: raw.tecnico.fid, tipo: 'dt' });
      }
    }
  } catch(e) {}

  var rival     = estado ? (estado.rival      || '') : '';
  var matchDate = estado ? (estado.match_date || '') : '';

  if (rival && matchDate) {
    var fechaFmt = new Date(matchDate + 'T12:00:00').toLocaleDateString('es-AR', { day:'numeric', month:'short', year:'numeric' });

    var roundLabel = '';
    try {
      var rm = await fetch('data/fixtures/mundial.json');
      var partidos = await rm.json();
      var found = partidos.find(function(p) {
        return p.date === matchDate && p.home && p.away && (
          (p.home.slug === slug && p.away.slug === rival) ||
          (p.away.slug === slug && p.home.slug === rival)
        );
      });
      if (found && found.roundName) roundLabel = found.roundName;
      else if (found && found.round) roundLabel = 'Fecha ' + found.round;
    } catch(e) {}

    document.getElementById('match-banner').style.display = 'flex';
    document.getElementById('mb-esc-local').src  = 'escudos/' + slug  + '.png';
    document.getElementById('mb-nom-local').textContent  = (NAMES_ES[slug]  || slug).toUpperCase();
    document.getElementById('mb-esc-rival').src  = 'escudos/' + rival + '.png';
    document.getElementById('mb-nom-rival').textContent  = (NAMES_ES[rival] || rival).toUpperCase();
    document.getElementById('mb-fecha').textContent = (roundLabel ? roundLabel + ' · ' : '') + fechaFmt;
  }

  if (!SB_URL) { mainEl.innerHTML = '<div class="msg-center">Sin datos aún.</div>'; return; }

  var allForms = [], allPunts = [];
  try {
    var fUrl = SB_URL + '/rest/v1/formaciones?select=id,jugadores,likes,device_id,created_at,match_date,rival&club=eq.' + slug + '&order=match_date.desc';
    var pUrl = SB_URL + '/rest/v1/puntajes?select=puntajes,match_date,rival&club=eq.'    + slug + '&order=match_date.desc';
    var results = await Promise.all([fetch(fUrl, {headers: SB_H}), fetch(pUrl, {headers: SB_H})]);
    allForms = await results[0].json() || [];
    allPunts = await results[1].json() || [];
  } catch(e) {
    mainEl.innerHTML = '<div class="msg-center">Error cargando datos.</div>';
    return;
  }

  // Agrupar por partido (match_date + rival)
  var matchesMap = {};
  function keyOf(r) { return (r.match_date || '') + '||' + (r.rival || ''); }
  function ensure(r) {
    var k = keyOf(r);
    if (!matchesMap[k]) matchesMap[k] = { key: k, date: r.match_date || '', rival: r.rival || '', forms: [], punts: [] };
    return matchesMap[k];
  }
  allForms.forEach(function(r) { ensure(r).forms.push(r); });
  allPunts.forEach(function(r) { ensure(r).punts.push(r); });
  var matches = Object.keys(matchesMap).map(function(k) { return matchesMap[k]; })
    .sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });

  if (!matches.length) {
    mainEl.innerHTML = '<div class="msg-center">Aún no hay votos para este equipo.</div>';
    return;
  }

  // Selector de fecha + Acumulado y contenedor de contenido
  mainEl.innerHTML = '';
  var sel = document.createElement('div'); sel.className = 'fecha-sel'; mainEl.appendChild(sel);
  var contentEl = document.createElement('div'); mainEl.appendChild(contentEl);

  // Mapa partido -> número de fecha (round) desde mundial.json
  var fixturesJson = [];
  try { fixturesJson = await fetch('data/fixtures/mundial.json?v=' + Date.now()).then(function(r){ return r.json(); }); } catch(e) {}
  function roundFor(date, riv) {
    var f = (fixturesJson || []).find(function(p) {
      var pDate = p.date || (p.status && p.status.utcTime ? p.status.utcTime.slice(0, 10) : '');
      return pDate === date && p.home && p.away &&
        ((p.home.slug === slug && p.away.slug === riv) || (p.away.slug === slug && p.home.slug === riv));
    });
    return f ? f.round : null;
  }

  var scopes = [{ id: 'acumulado', label: 'Acumulado' }].concat(matches.map(function(m) {
    var rivalName = NAMES_ES[m.rival] || m.rival || '—';
    var rd = roundFor(m.date, m.rival);
    return { id: m.key, label: (rd ? 'F' + rd + ' - ' : '') + rivalName };
  }));

  function renderScope(id) {
    Array.prototype.forEach.call(sel.children, function(b) { b.classList.toggle('active', b.dataset.id === id); });
    if (id === 'acumulado') {
      renderContent(allForms, allPunts, squad, contentEl, null);
    } else {
      var m = matchesMap[id];
      renderContent(m.forms, m.punts, squad, contentEl, NAMES_ES[m.rival] || m.rival);
    }
  }

  scopes.forEach(function(s) {
    var b = document.createElement('button'); b.className = 'fecha-btn'; b.dataset.id = s.id;
    b.textContent = s.label;
    b.addEventListener('click', function() { renderScope(s.id); });
    sel.appendChild(b);
  });

  renderScope('acumulado'); // default: visión global (puntos + formación)
}

init();
</script>
<script src="js/ui-help.js"></script>
</body>
