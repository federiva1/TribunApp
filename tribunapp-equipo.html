<style>
:root{--dark:#0d0d1a;--dark2:#13131f;--acento:#f5c518;--gold:#f5c518;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;}
#app{background:var(--dark2);max-width:480px;margin:0 auto;min-height:100vh;}

#site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px 10px;
  background:linear-gradient(180deg,rgba(21,101,192,0.15) 0%,transparent 100%);
  border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(10px);gap:12px;
}
.logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;}
/* Logo del header — MISMO tamaño en todas las páginas de la web (si se cambia, cambiarlo en todas). */
.logo-wrap img{height:72px;object-fit:contain;}
@media (max-width:430px){.logo-wrap img{height:60px;}}
.header-chip{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--gold);background:rgba(245,197,24,0.12);
  border:1px solid rgba(245,197,24,0.3);border-radius:6px;padding:3px 8px;
}
.header-actions{display:flex;gap:8px;align-items:center;}
.header-pill{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:7px 13px;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:0.5px;
  color:rgba(255,255,255,0.85);cursor:pointer;text-decoration:none;
  transition:background .2s,color .2s,border-color .2s;
}
.header-pill svg{width:15px;height:15px;flex-shrink:0;}
.header-pill:hover{background:rgba(21,101,192,0.18);border-color:rgba(21,101,192,0.45);color:#fff;}
.header-pill.primary{background:rgba(21,101,192,0.18);border-color:rgba(21,101,192,0.45);color:#fff;}
.header-pill.primary:hover{background:rgba(21,101,192,0.3);}
.header-pill-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:0.5px;}
.header-pill-jugar{background:linear-gradient(135deg,#1565c0,#0d47a1);border-color:#1976d2;color:#fff;}
.header-pill-jugar:hover{background:linear-gradient(135deg,#1976d2,#1565c0);}
@media(max-width:560px){
  .header-pill-label{display:none;}
  .header-pill{width:36px;height:36px;padding:0;gap:0;justify-content:center;}
  .header-actions{gap:6px;}
}
@media(max-width:430px){.header-chip{display:none;}}

/* MATCH BANNER */
.match-banner{
  margin:16px 16px 0;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:16px;
  display:flex;align-items:center;gap:14px;
}
.mb-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.mb-escudo{width:44px;height:44px;object-fit:contain;}
.mb-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-align:center;color:#fff;line-height:1.2;}
.mb-sep{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
.mb-vs{font-family:'Bebas Neue',sans-serif;font-size:22px;color:rgba(255,255,255,.3);}
.mb-fecha{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.25);text-transform:uppercase;text-align:center;white-space:nowrap;}

.content{padding:20px 16px 60px;}

.slab{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;
  color:rgba(255,255,255,.3);text-transform:uppercase;margin:20px 0 8px;
}

.msg-center{text-align:center;padding:40px 20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}

/* FORMACIONES */
.form-list{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.form-header{display:flex;padding:8px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);}
.form-header span:first-child{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.3);text-transform:uppercase;}
.form-header .fh-col{width:52px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}
.form-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.04);}
.form-row:last-child{border-bottom:none;}
.form-row-foto{width:30px;height:30px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.07);flex-shrink:0;}
.fecha-sel{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.fecha-sel::-webkit-scrollbar{height:3px;}
.fecha-sel::-webkit-scrollbar-thumb{background:#444;border-radius:4px;}
.fecha-btn{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:6px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.fecha-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:600;}
.comp-sel{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch;}
.comp-sel::-webkit-scrollbar{display:none;}
.comp-btn{flex:0 0 auto;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.65);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:8px 20px;border-radius:20px;cursor:pointer;white-space:nowrap;}
.comp-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1a1a;}
.sub-tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap;}
.sub-tab{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.55);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.sub-tab.active{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;}
.form-row-votes{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap;margin-right:10px;}
/* Equipos de la gente */
.eq-card{margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;position:relative;}
.eq-card.top{border-color:rgba(245,197,24,.45);}
.eq-badge{position:absolute;top:8px;right:8px;font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:20px;z-index:5;background:rgba(245,197,24,.18);color:var(--gold);border:1px solid rgba(245,197,24,.4);}
.eq-hdr{display:flex;align-items:center;padding:9px 12px 4px;}
.eq-hdr-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.4);}
.eq-hdr-date{font-size:10px;color:rgba(255,255,255,.18);}
.eq-pitch{width:100%;aspect-ratio:.82;background:#2d7a3a;position:relative;overflow:hidden;}
.eq-pl{position:absolute;}
.eq-pc{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);}
.eq-stripe{position:absolute;top:0;bottom:0;width:12.5%;}
.eq-stripe.odd{background:rgba(0,0,0,.06);}
.eq-pp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2;}
.eq-bubble{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.9);overflow:hidden;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.eq-bubble img{width:100%;height:100%;object-fit:cover;object-position:top;}
.eq-bubble span{font-family:'Bebas Neue',sans-serif;font-size:11px;color:#1a1a1a;}
.eq-pp-name{font-family:'Bebas Neue',sans-serif;font-size:8px;color:#fff;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 4px;line-height:1.5;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;}
.eq-footer{display:flex;align-items:center;padding:8px 12px;}
.eq-like{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:13px;color:#aaa;transition:all .15s;}
.eq-like.liked{background:rgba(245,197,24,.18);border-color:var(--gold);color:var(--gold);}
.eq-like b{font-family:'Bebas Neue',sans-serif;font-size:14px;font-weight:400;}
.form-row.dt{background:rgba(245,197,24,.08);border-left:3px solid var(--gold);}
.form-row.dt .form-row-name{color:var(--gold);}
.form-row-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.form-row-pct{width:52px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#42a5f5;}
.form-row-bar{width:52px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin:0 8px;}
.form-row-bar-fill{height:100%;border-radius:2px;background:#42a5f5;}

/* PODIO */
.podio{display:flex;gap:8px;margin-bottom:20px;}
.podio-item{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 8px;text-align:center;}
.podio-foto{width:44px;height:44px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);margin:0 auto 6px;display:block;}
.podio-medal{font-size:20px;margin-bottom:6px;}
.podio-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;line-height:1.2;}
.podio-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);}
.podio-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}
</style>

<script>
// Nombres de los clubes (de CLUBES_CONFIG). Sin rastro de selecciones del Mundial.
var NAMES_ES = {};
var NAME_TO_SLUG = {};
function _norm(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, ''); }
if (typeof CLUBES_CONFIG !== 'undefined') Object.keys(CLUBES_CONFIG).forEach(function(s){
  var c = CLUBES_CONFIG[s];
  NAMES_ES[s] = c.nombreCorto || c.nombre;
  [c.nombre, c.nombreCorto, s].forEach(function(n){ if (n) NAME_TO_SLUG[_norm(n)] = s; });
});
// El rival en Supabase es un NOMBRE api-sports; resolverlo a slug para el escudo.
function rivalSlug(name) {
  if (!name) return '';
  var n = _norm(name);
  if (NAME_TO_SLUG[n]) return NAME_TO_SLUG[n];
  var hit = '';
  Object.keys(NAME_TO_SLUG).forEach(function(k){ if (!hit && k.length >= 4 && (n.indexOf(k) === 0 || k.indexOf(n) === 0)) hit = NAME_TO_SLUG[k]; });
  return hit;
}

var params = new URLSearchParams(location.search);
// Sanitizar: los slugs válidos son alfanuméricos en minúscula. Esto neutraliza
// inyección en las URLs de Supabase/PostgREST y path traversal en los fetch estáticos.
var slug = (params.get('c') || '').replace(/[^a-z0-9]/gi, '').toLowerCase();
if (!slug) location.href = 'estadisticas-tribunapp.html';

var SB_URL = typeof _SUPABASE_URL !== 'undefined' ? _SUPABASE_URL : '';
var SB_KEY = typeof _SUPABASE_KEY !== 'undefined' ? _SUPABASE_KEY : '';
var SB_H   = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

document.getElementById('h-escudo').src = 'escudos/' + slug + '.png';
document.getElementById('h-nombre').textContent = (NAMES_ES[slug] || slug).toUpperCase();

// Seguridad: escapar HTML (datos de formaciones son escribibles por cualquiera vía la anon key)
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fidNum(f) { var n = String(f == null ? '' : f).replace(/[^0-9]/g, ''); return n; }

// Avatar = KIT del club (como el resto de la app), con el dorsal centrado.
var _KIT = (typeof clubKit === 'function') ? clubKit(slug) : { type:'solid', colors:['#444'] };
function kitAv(num, cls, size) {
  var bg = (typeof kitBackground === 'function') ? kitBackground(_KIT, size) : (_KIT.colors[0] || '#444');
  var out = (typeof NUM_OUTLINE !== 'undefined') ? NUM_OUTLINE : '0 1px 2px #000';
  var txt = (num != null && num !== '') ? esc(num) : '';
  return '<div class="' + cls + '" style="background:' + bg + ';display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.85);box-sizing:border-box;">' +
    '<span style="font-family:\'Bebas Neue\',sans-serif;font-size:' + Math.round(size * 0.5) + 'px;line-height:1;color:#fff;text-shadow:' + out + ';">' + txt + '</span></div>';
}

// Los puntajes de Supabase se keyean por el ID de jugador del partido FotMob
// (data/partidos/{id}.json → jugadores[slug][].id), NO por dorsal. Este mapa
// resuelve ese id → { name, num, tipo } leyendo los partidos del club.
var PUNT_LOOKUP = {};
var PART_INDEX = [];   // entradas de data/partidos/index.json de este club (para competición/ronda)
async function buildPuntLookup(slug) {
  try {
    var idx = await fetch('data/partidos/index.json?v=' + Date.now()).then(function(r){ return r.ok ? r.json() : []; });
    var mine = (idx || []).filter(function(e){ return e.local === slug || e.visitante === slug; });
    PART_INDEX = mine;
    await Promise.all(mine.map(async function(e) {
      try {
        var d = await fetch('data/partidos/' + e.id + '.json?v=' + Date.now()).then(function(r){ return r.ok ? r.json() : null; });
        var jug = d && d.jugadores && d.jugadores[slug];
        if (!Array.isArray(jug)) return;
        jug.forEach(function(j) {
          if (j.id == null) return;
          var k = String(j.id);
          if (!PUNT_LOOKUP[k]) PUNT_LOOKUP[k] = { name: j.nombre, num: j.num || '', tipo: j.tipo || '' };
        });
      } catch(e2) {}
    }));
  } catch(e) {}
}

// Competición de un partido a partir de la fecha del voto, cruzando con data/partidos
// (misma fuente que estadísticas). Auto-aplica el whitelist: solo los clubes vivos en
// copa tienen data/partidos de copa, así que solo ellos muestran el selector.
var COMP_ORDER = ['Liga', 'Libertadores', 'Sudamericana'];
function compGroup(competicion) {
  var c = (competicion || '').toLowerCase();
  if (c.indexOf('libertadores') >= 0) return 'Libertadores';
  if (c.indexOf('sudamericana') >= 0) return 'Sudamericana';
  return 'Liga';
}
function _dDiff(a, b) {
  if (!a || !b) return 99;
  return Math.abs((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
}
// Devuelve { group, ronda, rivalNom } del partido de esa fecha (±1 día). Default Liga.
function compByDate(date) {
  var e = PART_INDEX.find(function(p){ return _dDiff(p.fecha, date) <= 1; });
  if (e) {
    var rivalNom = (e.local === slug) ? e.visitante_nombre : e.local_nombre;
    return { group: compGroup(e.competicion), ronda: e.ronda || null, rivalNom: rivalNom || null };
  }
  return { group: 'Liga', ronda: null, rivalNom: null };
}

function calcFormaciones(rows) {
  var counts = {}, total = rows.length;
  rows.forEach(function(r) {
    (r.jugadores || []).forEach(function(j) {
      var k = j.name || ('#' + j.num);
      if (!counts[k]) counts[k] = { name: k, fid: j.fid || 0, num: j.num, count: 0 };
      counts[k].count++;
    });
  });
  return Object.values(counts)
    .map(function(p) { return Object.assign({}, p, { pct: Math.round((p.count / total) * 100) }); })
    .sort(function(a, b) { return b.pct - a.pct; });
}

function calcPuntajes(rows) {
  // Agregar por jugador: suma y cantidad de votos reales + S/P (null/'') + fechas puntuadas
  var agg = {};
  var fechasScope = {};
  var globalSum = 0, globalCnt = 0;
  rows.forEach(function(r) {
    var fkey = r.match_date || '__sinfecha';   // filas legacy sin fecha = 1 pseudo-fecha
    fechasScope[fkey] = true;
    Object.entries(r.puntajes || {}).forEach(function(entry) {
      var num = entry[0], val = entry[1];
      if (!agg[num]) agg[num] = { realSum: 0, realCount: 0, spCount: 0, fechas: {} };
      if (val === null || val === undefined || val === '') { agg[num].spCount++; return; }
      var n = Number(val);
      if (isNaN(n)) return;
      agg[num].realSum += n; agg[num].realCount++;
      globalSum += n; globalCnt++;
      agg[num].fechas[fkey] = true;
    });
  });
  // El promedio que se MUESTRA es el simple de los votos reales (los S/P no cuentan),
  // igual que club.html. Dos reglas de participación (mismas que el podio de club.html):
  //  - Cutoff en el acumulado: entrás solo si te puntuaron en ≥ la mitad de las fechas.
  //  - ORDEN por promedio ajustado (estilo IMDb): C fechas "fantasma" al promedio
  //    general M del scope; con pocas fechas gravitás hacia M, así una sola gran
  //    fecha no le gana a un rendimiento sostenido.
  var nScope = Object.keys(fechasScope).length;
  var cutoff = nScope > 1 ? Math.ceil(nScope / 2) : 1;
  var M = globalCnt ? globalSum / globalCnt : 5.5, C = 2;
  return Object.keys(agg).map(function(num) {
    var a = agg[num];
    var nF = Object.keys(a.fechas).length;
    var avg = a.realCount > 0 ? a.realSum / a.realCount : null;
    var adj = avg == null ? null : (avg * nF + C * M) / (nF + C);
    return { num: num, avg: avg, votes: a.realCount, fechas: nF, adj: adj };
  }).filter(function(p) {
    if (nScope <= 1) return true;              // una sola fecha (o legacy sin match_date)
    return p.fechas >= cutoff;
  }).sort(function(a, b) {
    return (b.adj == null ? -1 : b.adj) - (a.adj == null ? -1 : a.adj);
  });
}

// `num` acá es la KEY del puntaje (id de jugador FotMob del partido). Se resuelve
// primero vía PUNT_LOOKUP (data/partidos); fallback a dorsal en el plantel.
function esDT(num) {
  var e = PUNT_LOOKUP[String(num)];
  if (e && e.tipo === 'dt') return true;
  return num === '' || num == null || String(num) === '0';
}
function dtEntry(squad) { return squad && squad.find(function(s) { return s.tipo === 'dt'; }); }
function puntName(num, squad) {
  var e = PUNT_LOOKUP[String(num)];
  if (e && e.tipo === 'dt') return e.name || 'D.T.';
  if (esDT(num)) { var dt = dtEntry(squad); return dt && dt.name ? dt.name : 'D.T.'; }
  if (e && e.name) return e.name;
  var sq = squad && squad.find(function(s) { return String(s.num) === String(num); });
  return sq ? sq.name : '#' + num;
}
// Tokens en minúscula sin tildes ("Hernán López" → ["hernan","lopez"]).
function _tok(name) { return String(name == null ? '' : name).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z]+/).filter(Boolean); }
// Match nombre del partido contra el plantel. El partido puede abreviar ("H. Lopez")
// o traer nombre completo distinto ("Hernán López Muñoz") vs plantel ("Hernán López").
// Se puntúa por tokens compartidos + coincidencia de apellido/inicial, y se elige el mejor.
function matchSquadName(name, squad) {
  if (!name || !squad) return null;
  var nn = _norm(name);
  var exact = squad.find(function(s) { return _norm(s.name) === nn; });
  if (exact) return exact;
  var toks = _tok(name);
  if (!toks.length) return null;
  var last = toks[toks.length - 1];
  var best = null, bestScore = 0;
  squad.forEach(function(s) {
    if (s.tipo === 'dt') return;
    var st = _tok(s.name);
    if (!st.length) return;
    var shared = toks.filter(function(t) { return t.length >= 3 && st.indexOf(t) >= 0; }).length;
    var surnameHit = (last.length >= 3 && st.indexOf(last) >= 0) ? 1 : 0;
    var initHit = (toks[0].length === 1 && st[0].charAt(0) === toks[0]) ? 1 : 0;
    var score = shared * 2 + surnameHit + initHit;
    if (score > bestScore) { bestScore = score; best = s; }
  });
  return bestScore >= 1 ? best : null;
}
// Dorsal para el kit-avatar (la key es un id, no un dorsal). Fallback: plantel por nombre.
function puntNum(num, squad) {
  var e = PUNT_LOOKUP[String(num)];
  if (e && e.num != null && e.num !== '') return e.num;
  if (e && e.name) {
    var sq = matchSquadName(e.name, squad);
    if (sq && sq.num != null && sq.num !== '' && String(sq.num) !== 'None') return sq.num;
  }
  return '';
}

function getDeviceId() {
  var id = localStorage.getItem('tribunapp_device_id');
  if (!id) { id = 'dev_' + Math.random().toString(36).slice(2, 14) + Date.now().toString(36); localStorage.setItem('tribunapp_device_id', id); }
  return id;
}
function getFeedLikes() { try { return JSON.parse(localStorage.getItem('tribunapp_feed_likes') || '{}'); } catch(e) { return {}; } }
function saveFeedLikes(o) { try { localStorage.setItem('tribunapp_feed_likes', JSON.stringify(o)); } catch(e) {} }
// Like por RPC (toggle_formacion_like): conteo server-side, uno por dispositivo.
// La anon key ya no puede escribir `likes` con un valor libre.
async function toggleLike(rowId, curLikes) {
  var liked = getFeedLikes(); var was = !!liked[rowId];
  var nl = was ? Math.max(0, curLikes - 1) : curLikes + 1;   // optimista
  if (was) delete liked[rowId]; else liked[rowId] = true;
  saveFeedLikes(liked);
  try {
    var res = await fetch(SB_URL + '/rest/v1/rpc/toggle_formacion_like', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY },
      body: JSON.stringify({ p_formacion_id: rowId, p_device_id: getDeviceId() })
    });
    if (res.ok) {
      var r = (await res.json())[0];
      if (r && typeof r.likes === 'number') {
        nl = r.likes;
        if (r.liked) liked[rowId] = true; else delete liked[rowId];
        saveFeedLikes(liked);
      }
    }
  } catch(e) {}
  return { likes: nl, isLiked: !!liked[rowId] };
}

    return;
  }
  var vs = rivalName ? ' · vs ' + rivalName : '';

  // Secciones disponibles (puntajes solo si hay ≥1)
  var sections = [];
  if (puntajes.length) sections.push({ id: 'puntajes', label: 'Puntajes' });
  if (formaciones.length) sections.push({ id: 'jugadores', label: 'Jugadores' });
  if (formaciones.length) sections.push({ id: 'equipos', label: 'Equipos de la gente' });

  var subSel = document.createElement('div'); subSel.className = 'sub-tabs';
  var body = document.createElement('div');

  function slab(txt) { var d = document.createElement('div'); d.className = 'slab'; d.textContent = txt; return d; }

  function renderSection(id) {
    body.innerHTML = '';

      body.appendChild(slab('Puntajes' + vs + ' · ' + puntajes.length + ' voto' + (puntajes.length !== 1 ? 's' : '')));
      renderPodio(calcPuntajes(puntajes), body, squad);

      renderFormList(calcFormaciones(formaciones), body);
    } else {
      body.appendChild(slab('Equipos de la gente' + vs + ' · ' + formaciones.length + ' equipo' + (formaciones.length !== 1 ? 's' : '')));
      renderEquiposGente(formaciones, body);

  }

  sections.forEach(function(s) {

    b.addEventListener('click', function() { renderSection(s.id); });

  });

}

async function init() {
  var mainEl = document.getElementById('main-content');

  var squad = [];
  try {
    var rp = await fetch('data/planteles/' + slug + '.json');
    if (rp.ok) {
      var raw = await rp.json();
      var arr = raw.jugadores || raw;
      if (Array.isArray(arr)) {
        squad = arr.map(function(p) {
          return { num: p.num != null ? p.num : p.numero, name: p.name || p.nombre, fid: p.fid };
        });
      }
      // El DT (técnico) — su foto está guardada con tecnico.fid del plantel
      if (raw.tecnico) {
        squad.push({ num: '', name: raw.tecnico.nombre, fid: raw.tecnico.fid, tipo: 'dt' });
      }
    }
  } catch(e) {}

  await buildPuntLookup(slug);

  if (!SB_URL) { mainEl.innerHTML = '<div class="msg-center">Sin datos aún.</div>'; return; }

  var allForms = [], allPunts = [];
  try {
    var fUrl = SB_URL + '/rest/v1/formaciones?select=id,jugadores,likes,device_id,created_at,match_date,rival&club=eq.' + slug + '&order=match_date.desc';
    var pUrl = SB_URL + '/rest/v1/puntajes?select=puntajes,match_date,rival&club=eq.'    + slug + '&order=match_date.desc';
    var results = await Promise.all([fetch(fUrl, {headers: SB_H}), fetch(pUrl, {headers: SB_H})]);
    allForms = await results[0].json() || [];
    allPunts = await results[1].json() || [];
  } catch(e) {
    mainEl.innerHTML = '<div class="msg-center">Error cargando datos.</div>';
    return;
  }

  // Agrupar por partido (match_date + rival)
  var matchesMap = {};
  function keyOf(r) { return (r.match_date || '') + '||' + (r.rival || ''); }
  function ensure(r) {
    var k = keyOf(r);
    if (!matchesMap[k]) matchesMap[k] = { key: k, date: r.match_date || '', rival: r.rival || '', forms: [], punts: [] };
    return matchesMap[k];
  }
  allForms.forEach(function(r) { ensure(r).forms.push(r); });
  allPunts.forEach(function(r) { ensure(r).punts.push(r); });
  var matches = Object.keys(matchesMap).map(function(k) { return matchesMap[k]; })
    .sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });

  if (!matches.length) {
    mainEl.innerHTML = '<div class="msg-center">Aún no hay votos para este equipo.</div>';
    return;
  }

  // Mapa partido -> número de fecha (round) desde liga.json
  var fixturesJson = [];
  try { fixturesJson = await fetch('data/fixtures/liga.json?v=' + Date.now()).then(function(r){ return r.json(); }); } catch(e) {}
  // El club juega un partido por fecha → date + su slug identifican el partido.
  // Tolerante a ±1 día: el match_date de Supabase es la fecha local del voto y el
  // utcTime de liga.json es UTC (partidos nocturnos caen al día siguiente en UTC).
  function roundFor(date, riv) {
    var f = (fixturesJson || []).find(function(p) {
      if (!(p.home && p.away && (p.home.slug === slug || p.away.slug === slug))) return false;
      var pDate = (p.status && p.status.utcTime) ? p.status.utcTime.slice(0, 10) : (p.date || '');
      return _dDiff(pDate, date) <= 1;
    });
    return f ? f.fecha : null;
  }

  // Competición de cada partido (Liga / Libertadores / Sudamericana) desde data/partidos.
  matches.forEach(function(m) { var cb = compByDate(m.date); m.compGroup = cb.group; m.ronda = cb.ronda; m.rivalNom = cb.rivalNom; });
  var groups = COMP_ORDER.filter(function(g){ return matches.some(function(m){ return m.compGroup === g; }); });
  var compSel = (groups.indexOf('Liga') >= 0) ? 'Liga' : (groups[0] || 'Liga');

  // Etiqueta de cada partido: copa usa la ronda ("Octavos"); liga usa "F{n}".
  function matchLabel(m) {
    if (m.compGroup !== 'Liga') {
      var rn = m.rivalNom || NAMES_ES[m.rival] || m.rival || '—';
      return (m.ronda ? m.ronda + ' - ' : '') + rn;
    }
    var rivalName = NAMES_ES[m.rival] || m.rival || '—';
    var rd = roundFor(m.date, m.rival);
    return (rd ? 'F' + rd + ' - ' : '') + rivalName;
  }

  mainEl.innerHTML = '';
  var compBar = document.createElement('div'); compBar.className = 'comp-sel'; mainEl.appendChild(compBar);
  var sel = document.createElement('div'); sel.className = 'fecha-sel'; mainEl.appendChild(sel);
  var contentEl = document.createElement('div'); mainEl.appendChild(contentEl);

  function renderScope(id, groupMatches, gForms, gPunts) {
    Array.prototype.forEach.call(sel.children, function(b) { b.classList.toggle('active', b.dataset.id === id); });
    if (id === 'acumulado') {
      renderContent(gForms, gPunts, squad, contentEl, null);
    } else {
      var m = matchesMap[id];
      renderContent(m.forms, m.punts, squad, contentEl, NAMES_ES[m.rival] || m.rival);
    }
  }

  function renderComp(group) {
    Array.prototype.forEach.call(compBar.children, function(b) { b.classList.toggle('active', b.dataset.g === group); });
    var gm = matches.filter(function(m){ return m.compGroup === group; });
    var gForms = [], gPunts = [];
    gm.forEach(function(m){ gForms = gForms.concat(m.forms); gPunts = gPunts.concat(m.punts); });
    // Reconstruir la barra de fechas para esta competición
    sel.innerHTML = '';
    var scopes = [{ id: 'acumulado', label: 'Acumulado' }].concat(gm.map(function(m){ return { id: m.key, label: matchLabel(m) }; }));
    scopes.forEach(function(s) {
      var b = document.createElement('button'); b.className = 'fecha-btn'; b.dataset.id = s.id;
      b.textContent = s.label;
      b.addEventListener('click', function() { renderScope(s.id, gm, gForms, gPunts); });
      sel.appendChild(b);
    });
    renderScope('acumulado', gm, gForms, gPunts);
  }

  // Selector de competición: solo si el club jugó más de una (Liga + copa).
  if (groups.length > 1) {
    groups.forEach(function(g) {
      var b = document.createElement('button'); b.className = 'comp-btn'; b.dataset.g = g;
      b.textContent = g;
      b.addEventListener('click', function() { renderComp(g); });
      compBar.appendChild(b);
    });
  } else {
    compBar.style.display = 'none';
  }

  renderComp(compSel);
}

init();
</script>
