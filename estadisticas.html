<title>Estadísticas del partido — TribunApp</title>

<style>
:root{--dark:#0d0d1a;--dark2:#13131f;--acento-local:#1565c0;--acento-visit:#e53935;--gold:#f5c518;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;}
#app{background:var(--dark2);max-width:480px;margin:0 auto;min-height:100vh;}

/* HEADER */
#site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px 10px;
  background:linear-gradient(180deg,rgba(21,101,192,0.15) 0%,transparent 100%);
  border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(10px);gap:12px;
}
.logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;}
.header-chip{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--gold);background:rgba(245,197,24,0.12);
  border:1px solid rgba(245,197,24,0.3);border-radius:6px;padding:3px 8px;
}
.header-actions{display:flex;gap:8px;align-items:center;}
.header-pill{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:7px 13px;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:0.5px;
  color:rgba(255,255,255,0.85);cursor:pointer;text-decoration:none;
  transition:background .2s,color .2s,border-color .2s;
}
.header-pill svg{width:15px;height:15px;flex-shrink:0;}
.header-pill:hover{background:rgba(21,101,192,0.18);border-color:rgba(21,101,192,0.45);color:#fff;}
.header-pill.primary{background:rgba(21,101,192,0.18);border-color:rgba(21,101,192,0.45);color:#fff;}
.header-pill.primary:hover{background:rgba(21,101,192,0.3);}
.header-pill-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:0.5px;}
.header-pill-jugar{background:linear-gradient(135deg,#1565c0,#0d47a1);border-color:#1976d2;color:#fff;}
.header-pill-jugar:hover{background:linear-gradient(135deg,#1976d2,#1565c0);}
@media(max-width:560px){
  .header-pill-label{display:none;}
  .header-pill{width:36px;height:36px;padding:0;gap:0;justify-content:center;}
  .header-actions{gap:6px;}
}
@media(max-width:430px){.header-chip{display:none;}}

/* MATCH HEADER */
.match-header{
  padding:22px 16px 18px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.match-meta{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;
  color:rgba(255,255,255,.4);text-align:center;text-transform:uppercase;margin-bottom:16px;
}
.match-score-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.match-team{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
.match-team-flag{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));}
.match-team-name{
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;
  color:#fff;text-align:center;
}
.match-score-center{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 8px;}
.match-score{
  font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:4px;
  color:#fff;line-height:1;display:flex;align-items:center;gap:6px;
}
.match-score-sep{font-size:28px;color:rgba(255,255,255,.3);}
.match-status{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;
  color:rgba(255,255,255,.35);text-transform:uppercase;
}
.match-goals{margin-top:16px;display:flex;justify-content:space-between;gap:8px;}
.match-goals-local{flex:1;text-align:left;}
.match-goals-visitante{flex:1;text-align:right;}
.goal-item{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;
  color:rgba(255,255,255,.65);line-height:1.9;
}
.goal-item.og{color:rgba(255,100,100,.75);}

/* TABS PRINCIPALES */
.tabs{
  display:flex;border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:64px;z-index:15;background:var(--dark2);
}
.tab{
  flex:1;padding:12px 8px;text-align:center;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;
  color:rgba(255,255,255,.4);border-bottom:2px solid transparent;
  transition:all .2s;text-transform:uppercase;
}
.tab.active{color:#fff;border-bottom-color:rgba(255,255,255,.5);}

/* SECTION */
.section{display:none;padding:16px;}
.section.active{display:block;}

/* TEAM SWITCHER en tab jugadores */
.team-switcher{
  display:flex;gap:8px;margin-bottom:14px;
}
.team-switch-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  transition:all .2s;
}
.team-switch-btn.active-local{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.2);
}
.team-switch-btn.active-visit{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.2);
}
.team-switch-btn img{width:26px;height:26px;object-fit:contain;}
.team-switch-name{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;
  color:rgba(255,255,255,.6);letter-spacing:.5px;
}
.team-switch-btn.active-local .team-switch-name,
.team-switch-btn.active-visit .team-switch-name{color:#fff;}

.players-panel{display:none;}
.players-panel.active{display:block;}

/* POSESION */
.posesion-bar{
  height:36px;border-radius:8px;overflow:hidden;display:flex;
  margin:6px 0 12px;
}
.posesion-local{
  display:flex;align-items:center;justify-content:flex-start;padding:0 12px;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;
  color:#fff;transition:width .6s;
}
.posesion-visitante{
  display:flex;align-items:center;justify-content:flex-end;padding:0 12px;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;
  color:#fff;transition:width .6s;
}
.posesion-label{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;
  color:rgba(255,255,255,.35);text-align:center;margin-bottom:6px;text-transform:uppercase;
}

/* LEGEND */
.teams-legend{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06);
}
.team-legend{display:flex;align-items:center;gap:6px;}
.team-legend-dot{width:10px;height:10px;border-radius:50%;}
.team-legend-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:rgba(255,255,255,.6);}

/* STAT ROW */
.stat-simple{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05);
}
.stat-simple:last-child{border-bottom:none;}
.stat-simple-val{
  font-family:'Bebas Neue',sans-serif;font-size:21px;min-width:72px;
}
.stat-simple-val.local{text-align:left;}
.stat-simple-val.visitante{text-align:right;}
.stat-simple-label{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;
  color:rgba(255,255,255,.45);text-align:center;flex:1;padding:0 6px;
}

/* PLAYER CARD */
.jugadores-title{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1.5px;
  color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:8px;
}
.player-card{border-bottom:1px solid rgba(255,255,255,.05);}
.player-card:last-child{border-bottom:none;}
.player-row{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.player-avatar{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(255,255,255,.1);
}
.player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.player-info{flex:1;min-width:0;}
.player-name{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;
}
.mvp-tag{
  font-size:10px;background:rgba(245,197,24,.2);color:var(--gold);
  padding:1px 5px;border-radius:3px;font-weight:600;letter-spacing:.5px;flex-shrink:0;
}
.player-meta{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:rgba(255,255,255,.35);margin-top:2px;}
.player-badges{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.5px;padding:2px 6px;border-radius:4px;}
.badge.gol{background:rgba(46,125,50,.3);color:#81c784;}
.badge.asist{background:rgba(21,101,192,.3);color:#90caf9;}
.expand-btn{
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.25);font-size:10px;transition:transform .25s,color .15s;flex-shrink:0;
}
.player-card.open .expand-btn{transform:rotate(180deg);color:rgba(255,255,255,.5);}

/* DETAIL PANEL */
.player-detail-panel{display:none;padding:0 0 14px 50px;animation:fadeIn .2s ease;}
.player-card.open .player-detail-panel{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.psec-tabs{display:flex;gap:4px;margin-bottom:10px;}
.psec-tab{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.8px;
  padding:4px 10px;border-radius:20px;cursor:pointer;text-transform:uppercase;
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);
  transition:all .15s;border:1px solid transparent;
}
.psec-tab.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.15);}
.psec-content{display:none;}
.psec-content.active{display:block;}

.pstat-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;}
.pstat-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);
}
.pstat-row:last-child{border-bottom:none;}
.pstat-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:rgba(255,255,255,.4);}
.pstat-val{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;}
.pstat-val.null-val{color:rgba(255,255,255,.2);}

.portero-block{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.portero-stat{
  display:flex;flex-direction:column;align-items:center;
  background:rgba(255,255,255,.05);border-radius:8px;padding:8px 14px;min-width:70px;
}
.portero-stat-val{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;}
.portero-stat-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.8px;text-transform:uppercase;margin-top:2px;}

/* SIN DATOS */
.no-data{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;gap:10px;
}
.no-data-icon{font-size:36px;opacity:.4;}
.no-data-text{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase;}

/* LOADING */
#loading{
  display:flex;align-items:center;justify-content:center;min-height:250px;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:1px;
  color:rgba(255,255,255,.3);
}
</style>
</head>
<body>

<div style="max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.06);background:var(--dark2,#0d111f);">

<div id="app">

  <div id="loading">Cargando estadísticas…</div>

  <div id="content" style="display:none;">

<script>
const params  = new URLSearchParams(location.search);
const matchId = params.get('p') || '';
// también soporta entrada por equipo: ?c=brazil (busca su primer partido)
const fromSlug = params.get('c') || null;

const NOMBRES = {
  argentina:'Argentina',france:'Francia',brazil:'Brasil',germany:'Alemania',
  spain:'España',england:'Inglaterra',portugal:'Portugal',mexico:'México',
  usa:'EE.UU.',uruguay:'Uruguay',colombia:'Colombia',japan:'Japón',
  morocco:'Marruecos',netherlands:'Países Bajos',croatia:'Croacia',
  senegal:'Senegal',switzerland:'Suiza',australia:'Australia',
  ecuador:'Ecuador',canada:'Canadá',southkorea:'Corea del Sur',
  turkiye:'Türkiye',austria:'Austria',norway:'Noruega',sweden:'Suecia',
  scotland:'Escocia',belgium:'Bélgica',iran:'Irán',iraq:'Irak',
  jordan:'Jordania',qatar:'Catar',saudiarabia:'Arabia Saudita',
  egypt:'Egipto',southafrica:'Sudáfrica',ghana:'Ghana',
  ivorycoast:'Costa de Marfil',czechia:'Chequia',panama:'Panamá',
  haiti:'Haití',curacao:'Curazao',algeria:'Argelia',
  capeverde:'Cabo Verde',newzealand:'Nueva Zelanda',uzbekistan:'Uzbekistán',
  drcongo:'RD Congo',bosniaandherzegovina:'Bosnia y Herz.',paraguay:'Paraguay',
};
const COLORES={
  argentina:'#75aadb',france:'#002395',brazil:'#009c3b',germany:'#c0392b',
  spain:'#c60b1e',england:'#cf081f',portugal:'#006600',mexico:'#006847',
  usa:'#002868',uruguay:'#5db8e8',colombia:'#fcd116',japan:'#bc002d',
  morocco:'#c1272d',netherlands:'#ff6200',croatia:'#d01111',senegal:'#00853f',
  panama:'#da121a',algeria:'#006233',ecuador:'#ffd100',canada:'#d80621',
};

const _cfg = s => (typeof CLUBES_CONFIG !== 'undefined' && CLUBES_CONFIG[s]) || null;
const nb  = s => { const c = _cfg(s); return (c && (c.nombreCorto || c.nombre)) || NOMBRES[s] || (s.charAt(0).toUpperCase()+s.slice(1)); };
const col = s => { const c = _cfg(s); return (c && c.color) || COLORES[s] || '#1565c0'; };
const esc = s => `escudos/${s}.png`;
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// ── Kits de las fichas — MANTENER EN SYNC con KITS de club.html ────────────────
const KITS = {
  sarmiento:              { type: 'solid',    colors: ['#1b8a3e'] },
  argentinosjuniors:      { type: 'sash',     colors: ['#e12026', '#ffffff'] },
  atleticotucuman:        { type: 'stripesV', colors: ['#53b7e8', '#ffffff'] },
  independienterivadavia: { type: 'solid',    colors: ['#291670'] },
};
const NUM_OUTLINE = '-1px -1px 0 rgba(0,0,0,0.55),1px -1px 0 rgba(0,0,0,0.55),-1px 1px 0 rgba(0,0,0,0.55),1px 1px 0 rgba(0,0,0,0.55),0 2px 3px rgba(0,0,0,0.5)';
function clubKit(slug) {
  if (KITS[slug]) return KITS[slug];
  const c = _cfg(slug) || {};
  return { type: 'solid', colors: [c.color || col(slug)] };
}
function kitBackground(kit, size) {
  const a = kit.colors[0], b = kit.colors[1] || '#ffffff';
  const w = Math.max(4, Math.round(size / 6));
  switch (kit.type) {
    case 'stripesV': return `repeating-linear-gradient(90deg, ${a} 0 ${w}px, ${b} ${w}px ${2 * w}px)`;
    case 'stripesH': return `repeating-linear-gradient(0deg, ${a} 0 ${w}px, ${b} ${w}px ${2 * w}px)`;
    case 'halves':   return `linear-gradient(90deg, ${a} 0 50%, ${b} 50% 100%)`;
    case 'band':     return `linear-gradient(0deg, ${a} 0 36%, ${b} 36% 64%, ${a} 64% 100%)`;
    case 'sash':     return `linear-gradient(45deg, ${a} 0 42%, ${b} 42% 58%, ${a} 58% 100%)`;
    default:         return a;
  }
}
// Color del kit legible como texto sobre fondo oscuro (aclara los colores muy oscuros).
function accentColor(slug){
  const hex = clubKit(slug).colors[0];
  if(!/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  if(lum>=0.42) return hex;
  const t=0.55, mix=v=>Math.round(v+(255-v)*t);
  return '#'+[mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// Estado + marcador en vivo desde api-sports (proxy: solo prod). Refresca cada 60s
// mientras el partido está en curso; en local (sin proxy) cae en el catch y no hace nada.
let _liveTimer = null;
const EN_CURSO_ST = ['1H','HT','2H','ET','BT','P','SUSP'];
// Reconstruye la lista de goles (goleador + minuto) desde los eventos en vivo de api-sports.
function _renderLiveGoals(r){
  const gl = document.getElementById('goals-local');
  const gv = document.getElementById('goals-visitante');
  if(!gl || !gv || !r.teams) return;
  const homeId = r.teams.home.id;
  const evs = (r.events||[]).filter(e =>
    e.type === 'Goal' && e.detail !== 'Missed Penalty' && e.comments !== 'Penalty Shootout');
  gl.innerHTML = ''; gv.innerHTML = '';
  evs.forEach(e => {
    const og = e.detail === 'Own Goal';
    // gol en contra: se anota para el equipo rival
    const paraLocal = og ? (e.team.id !== homeId) : (e.team.id === homeId);
    const min = e.time.elapsed + (e.time.extra ? '+' + e.time.extra : '');
    const name = (e.player && e.player.name) || '';
    let txt = `⚽ ${min}' ${name}`;
    if(og)                        txt += ' (e/c)';
    else if(e.detail === 'Penalty') txt += ' (p)';
    else if(e.assist && e.assist.name) txt += ` (E: ${e.assist.name})`;
    const d = document.createElement('div');
    d.className = 'goal-item' + (og ? ' og' : '');
    d.textContent = txt;
    (paraLocal ? gl : gv).appendChild(d);
  });
}
async function refreshLiveStatus(apiId){
  try{
    const res = await fetch(`/api/apisports/fixtures?id=${apiId}`, { cache:'no-store' });
    if(!res.ok) return;
    const r = ((await res.json()).response || [])[0];
    if(!r) return;
    const st = r.fixture.status.short, el = r.fixture.status.elapsed;
    document.getElementById('score-local').textContent     = r.goals.home;
    document.getElementById('score-visitante').textContent = r.goals.away;
    const enCurso = EN_CURSO_ST.includes(st);
    // Mientras juega, los goles salen de los eventos en vivo (goleador + minuto).
    // Finalizado: se conserva goles_detalle de la ficha (más completo).
    if(enCurso) _renderLiveGoals(r);
    let txt = 'Finalizado';
    if(st==='NS')        txt='Por comenzar';
    else if(st==='HT')   txt='Entretiempo';
    else if(st==='SUSP') txt='Suspendido';
    else if(enCurso)     txt = (el!=null?`${el}' `:'') + 'EN VIVO';
    const ms = document.getElementById('match-status');
    ms.textContent = txt;
    ms.style.color = enCurso ? '#2ad572' : '';
    if(enCurso && !_liveTimer) _liveTimer = setInterval(()=>refreshLiveStatus(apiId), 60000);
    if(!enCurso && _liveTimer){ clearInterval(_liveTimer); _liveTimer=null; }
  }catch(e){}
}

function formatFecha(f){
  const d = new Date(f+'T12:00:00');
  return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

const LABELS_TOP = {tiros_totales:'Tiros totales',disparos_puerta:'A puerta',oport_creadas:'Oport. creadas',grandes_oport:'Gran. oport.',acc_defensivas:'Acc. defensivas',pases_precisos:'Pases precisos'};
const LABELS_ATQ = {toques:'Toques',toques_area:'Toques área rival',regates:'Regates',pases_ultimo_tercio:'Pases últ. tercio',tiros_largos:'Tiros largos',perdida_balon:'Pérdidas'};
const LABELS_DEF = {acc_defensivas:'Acc. defensivas',entradas:'Entradas',interceptaciones:'Interceptaciones',recuperaciones:'Recuperaciones',despejes:'Despejes',bloqueos:'Bloqueos',regateado:'Regateado'};
const LABELS_DUE = {ganados:'Duelos ganados',perdidos:'Duelos perdidos',terrestres:'Terrestres',aereos:'Aéreos',faltas:'Faltas cometidas',faltas_recibidas:'Faltas recibidas'};

function buildGrid(obj, labels){
  if(!obj) return '';
  const rows = Object.entries(labels).map(([k,l])=>{
    const raw = obj[k];
    const isNull = raw===null||raw===undefined;
    return `<div class="pstat-row"><span class="pstat-label">${l}</span><span class="pstat-val${isNull?' null-val':''}">${isNull?'—':escapeHtml(raw)}</span></div>`;
  });
  const mid = Math.ceil(rows.length/2);
  return `<div class="pstat-grid"><div>${rows.slice(0,mid).join('')}</div><div>${rows.slice(mid).join('')}</div></div>`;
}

function buildDetailPanel(j, cardId){
  const tabs=[], contents=[];
  let idx=0;
  function add(label, html){
    const active=idx===0?'active':'';
    tabs.push(`<div class="psec-tab ${active}" data-sec="${idx}">${label}</div>`);
    contents.push(`<div class="psec-content ${active}" id="${cardId}-s${idx}">${html}</div>`);
    idx++;
  }
  if(j.top)    add('Top',    buildGrid(j.top,    LABELS_TOP));
  if(j.ataque) add('Ataque', buildGrid(j.ataque, LABELS_ATQ));
  if(j.defensa)add('Defensa',buildGrid(j.defensa,LABELS_DEF));
  if(j.duelos) add('Duelos', buildGrid(j.duelos, LABELS_DUE));
  if(!tabs.length) return '';

  let portero='';
  if(j.portero && j.portero_stats){
    const ps=j.portero_stats;
    const items=[
      ps.paradas!=null?`<div class="portero-stat"><div class="portero-stat-val">${ps.paradas}</div><div class="portero-stat-label">Paradas</div></div>`:'',
      ps.goles_contra!=null?`<div class="portero-stat"><div class="portero-stat-val">${ps.goles_contra}</div><div class="portero-stat-label">Goles enc.</div></div>`:'',
      ps.goles_evitados!=null?`<div class="portero-stat"><div class="portero-stat-val">${ps.goles_evitados>=0?'+':''}${ps.goles_evitados}</div><div class="portero-stat-label">Evitados</div></div>`:'',
    ].filter(Boolean);
    if(items.length) portero=`<div class="portero-block">${items.join('')}</div>`;
  }
  return `<div class="psec-tabs">${tabs.join('')}</div>${contents.join('')}${portero}`;
}

function _normName(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
// Clave por conjunto de tokens ordenado: ignora orden apellido/nombre
// (api-sports "Hwang In-beom" vs plantel "In-Beom Hwang")
function _tokKey(s){ return _normName(s).replace(/-/g,' ').split(/\s+/).filter(Boolean).sort().join(' '); }
function _tokSet(s){ return new Set(_normName(s).replace(/-/g,' ').split(/\s+/).filter(Boolean)); }
function _lastWord(s){ const w=_normName(s).replace(/\./g,'').split(/\s+/).filter(Boolean); return w[w.length-1]||''; }
function _matchSquad(nombre, squad){
  if(!squad) return null;
  const nn=_normName(nombre), tk=_tokKey(nombre);
  let m = squad.find(s=>_normName(s.name||s.nombre)===nn)
       || squad.find(s=>_tokKey(s.name||s.nombre)===tk);
  if(m) return m;
  // Apellido único: api-sports usa nombre largo ("Matthew Freese") y el plantel corto
  // ("Matt Freese") → comparten solo el apellido
  const lw=_lastWord(nombre);
  const byLast=squad.filter(s=>_lastWord(s.name||s.nombre)===lw);
  if(byLast.length===1) return byLast[0];
  // Fallback: mejor solapamiento de tokens (>=2 comunes y ganador unico)
  // cubre diferencias de romanizacion (Oh Hyeon-Gyu vs Hyun-Gyu Oh)
  const mine=_tokSet(nombre);
  const scored=squad.map(s=>{
    const o=_tokSet(s.name||s.nombre); let n=0; mine.forEach(t=>{ if(o.has(t)) n++; });
    return {s,n};
  }).sort((a,b)=>b.n-a.n);
  if(scored.length && scored[0].n>=2 && (scored.length===1 || scored[1].n<scored[0].n)) return scored[0].s;
  // Apellido contenido: FotMob abrevia el nombre ("A. Amaimouni") o usa solo una
  // parte de un apellido compuesto ("Amaimouni" vs plantel "Amaimouni-Echghouyab").
  // Match si todos los tokens de apellido (no iniciales) del input están en el set
  // del plantel, con ganador único y al menos un token distintivo (len>=5 o 2+ tokens).
  const isInit=t=>t.replace(/\./g,'').length<=1;
  const surn=[...mine].filter(t=>!isInit(t));
  if(surn.length){
    const cands=squad.filter(s=>{ const o=_tokSet(s.name||s.nombre); return surn.every(t=>o.has(t)); });
    if(cands.length===1 && (surn.some(t=>t.length>=5)||surn.length>=2)) return cands[0];
  }
  return null;
}

function renderPlayers(jugs, teamSlug, containerId, squad){
  const container = document.getElementById(containerId);
  if(!jugs||!jugs.length){
    container.innerHTML=`<div class="no-data"><div class="no-data-icon">📋</div><div class="no-data-text">Sin datos de jugadores</div></div>`;
    return;
  }
  // Excluir DT — no es jugador (aparecia como "null' · Jugador" sin foto)
  const sorted = jugs.filter(j=>j.tipo!=='dt').slice().sort((a,b)=>b.min-a.min);
  const teamCol = col(teamSlug);

  sorted.forEach((j,idx)=>{
    const cardId=`${containerId}-c${idx}`;
    const badges=[];
    if(j.goles>0) badges.push(`<span class="badge gol">⚽ ${j.goles===1?'GOL':j.goles+' GOLES'}</span>`);
    if(j.asist>0) badges.push(`<span class="badge asist">🎯 ${j.asist===1?'ASIST':j.asist+' ASIST'}</span>`);

    const detail = buildDetailPanel(j, cardId);

    const enPlantel = _matchSquad(j.nombre, squad);
    // Sin fotos: la "avatar" es un círculo con el color del club y el dorsal.
    const dorsal = (enPlantel && enPlantel.num) || j.num || '';

    const card = document.createElement('div');
    card.className='player-card';
    card.id=cardId;
    card.innerHTML=`
      <div class="player-row">
        <div class="player-avatar" style="background:${kitBackground(clubKit(teamSlug), 40)};border-color:rgba(255,255,255,.9)">
          <span style="font-family:'Bebas Neue',sans-serif;color:#fff;font-size:17px;text-shadow:${NUM_OUTLINE};">${escapeHtml(dorsal)}</span>
        </div>
        <div class="player-info">
          <div class="player-name">
            ${escapeHtml(j.nombre)}
          </div>
          <div class="player-meta">${j.min}' · ${j.portero?'Portero':'Jugador'}</div>
          ${badges.length?'<div class="player-badges">'+badges.join('')+'</div>':''}
        </div>
        ${detail?'<div class="expand-btn">▼</div>':''}
      </div>
      ${detail?`<div class="player-detail-panel">${detail}</div>`:''}`;

    if(detail){
      card.querySelector('.player-row').addEventListener('click',()=>card.classList.toggle('open'));
      card.querySelectorAll('.psec-tab').forEach(tab=>{
        tab.addEventListener('click',e=>{
          e.stopPropagation();
          const sec=tab.dataset.sec;
          card.querySelectorAll('.psec-tab').forEach(t=>t.classList.remove('active'));
          card.querySelectorAll('.psec-content').forEach(c=>c.classList.remove('active'));
          tab.classList.add('active');
          card.querySelector(`#${cardId}-s${sec}`).classList.add('active');
        });
      });
    }
    container.appendChild(card);
  });
}

async function loadSquad(slug){
  try{
    const r = await fetch(`data/planteles/${slug}.json`);
    if(!r.ok) return [];
    const raw = await r.json();
    const arr = raw.jugadores || raw;
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}

// El motor de la ficha en vivo (buildPayloadLive) vive en js/match-live.js
// Decide la fuente: JSON pre-generado (post-partido, FotMob) o api-sports en vivo.
async function loadMatchData(){
  const apiFid=params.get('fid')||'';
  let json=null;
  try{ const r=await fetch(`data/partidos/${matchId}.json?v=${Date.now()}`); if(r.ok) json=await r.json(); }catch(e){}
  const apiId=apiFid||(json&&json.partido&&json.partido.api_id)||'';
  if(apiId){
    let short=null;
    try{ const r=await fetch(`/api/apisports/fixtures?id=${apiId}`,{cache:'no-store'}); if(r.ok){ const j=await r.json(); const f=(j.response||[])[0]; short=f&&f.fixture.status.short; } }catch(e){}
    const enCurso=short&&EN_CURSO_ST.includes(short);
    if(enCurso||(short&&!json)){
      try{ const built=await buildPayloadLive(apiId); if(built) return built.data; }catch(e){}
    }
  }
  return json;
}

async function init(){
  let data = await loadMatchData();
  if(!data){
    document.getElementById('loading').textContent='No se encontró el partido.';
    return;
  }

  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';

  const p = data.partido;
  // Barra de posesión: color real del kit (celeste vs azul, bien distintos).
  // Números: versión legible sobre fondo oscuro.
  const barLocal = clubKit(p.local).colors[0],      barVisit = clubKit(p.visitante).colors[0];
  const cLocal   = accentColor(p.local),            cVisit   = accentColor(p.visitante);

  const backSlug = new URLSearchParams(location.search).get('c');
  document.getElementById('back-btn').href = backSlug
    ? `club.html?c=${backSlug}`
    : `fixture.html`;

  // Header mini
  document.getElementById('h-comp').textContent  = p.competicion.toUpperCase();

  // Match header
  document.getElementById('match-meta').textContent =
    `${p.competicion.toUpperCase()} · ${formatFecha(p.fecha)} · ${p.estadio}`;
  document.getElementById('flag-local').src     = esc(p.local);
  document.getElementById('flag-visitante').src = esc(p.visitante);
  // (Los escudos ya no linkean a club.html — se quitó para evitar toques accidentales.)
  document.getElementById('name-local').textContent     = nb(p.local).toUpperCase();
  document.getElementById('name-visitante').textContent = nb(p.visitante).toUpperCase();
  document.getElementById('score-local').textContent     = p.goles_local;
  document.getElementById('score-visitante').textContent = p.goles_visitante;
  if (p.api_id) refreshLiveStatus(p.api_id);   // estado/score en vivo (solo prod)

  // Goles
  const gl=document.getElementById('goals-local');
  const gv=document.getElementById('goals-visitante');
  const jugsLocal = (data.jugadores||{})[p.local]||[];
  const jugsVisit = (data.jugadores||{})[p.visitante]||[];
  function fmtGol(g, jugs){
    if(typeof g==='string') return '⚽ '+g;
    // Gol en contra: el goleador es rival; se anota para este equipo
    if(g.en_contra) return `⚽ ${g.min ? g.min+"' " : ''}${g.jugador||''} (e/c)`;
    let t=`⚽ ${g.min ? g.min+"' " : ''}${g.jugador||''}`;
    // El asistente solo cuando el goleador entró desde el banco
    const m=_matchSquad(g.jugador, jugs);
    if(g.asist && m?.tipo==='suplente') t+=` (E: ${g.asist})`;
    return t;
  }
  const isOG=g=>typeof g==='object'&&(g.en_contra||(g.jugador||'').includes('OG'));
  (p.goles_detalle.local||[]).forEach(g=>{
    const d=document.createElement('div');d.className='goal-item'+(isOG(g)?' og':'');d.textContent=fmtGol(g, jugsLocal);gl.appendChild(d);
  });
  (p.goles_detalle.visitante||[]).forEach(g=>{
    const d=document.createElement('div');
    d.className='goal-item'+(isOG(g)?' og':'');
    d.textContent=fmtGol(g, jugsVisit);gv.appendChild(d);
  });


  // Stats globales
  const sc=document.getElementById('stats-container');
  data.top_stats.forEach(s=>{
    if(s.tipo==='posesion'){
      const div=document.createElement('div');
      div.innerHTML=`
        <div class="posesion-label">${escapeHtml(s.label)}</div>
        <div class="posesion-bar">
          <div class="posesion-local"  style="width:${s.local_val}%;background:${barLocal};text-shadow:${NUM_OUTLINE}">${escapeHtml(s.local)}</div>
          <div class="posesion-visitante" style="width:${s.visitante_val}%;background:${barVisit};text-shadow:${NUM_OUTLINE}">${escapeHtml(s.visitante)}</div>
        </div>`;
      sc.appendChild(div);
    }else{
      const div=document.createElement('div');
      div.className='stat-simple';
      div.innerHTML=`
        <div class="stat-simple-val local" style="color:${cLocal}">${escapeHtml(s.local)}</div>
        <div class="stat-simple-label">${escapeHtml(s.label)}</div>
        <div class="stat-simple-val visitante" style="color:${cVisit}">${escapeHtml(s.visitante)}</div>`;
      sc.appendChild(div);
    }
  });

  // Team switcher jugadores
  document.getElementById('sw-flag-local').src  = esc(p.local);
  document.getElementById('sw-flag-visit').src  = esc(p.visitante);
  document.getElementById('sw-name-local').textContent = nb(p.local).toUpperCase();
  document.getElementById('sw-name-visit').textContent = nb(p.visitante).toUpperCase();

  // Render jugadores (con fotos desde plantel)
  const [sqLocal, sqVisit] = await Promise.all([loadSquad(p.local), loadSquad(p.visitante)]);
  renderPlayers(data.jugadores[p.local],   p.local,    'panel-local',  sqLocal);
  renderPlayers(data.jugadores[p.visitante],p.visitante,'panel-visit', sqVisit);

  // Team switch logic
  const btnL=document.getElementById('btn-local');
  const btnV=document.getElementById('btn-visit');
  const panL=document.getElementById('panel-local');
  const panV=document.getElementById('panel-visit');

  btnL.addEventListener('click',()=>{
    btnL.className='team-switch-btn active-local';
    btnV.className='team-switch-btn';
    panL.classList.add('active');
    panV.classList.remove('active');
  });
  btnV.addEventListener('click',()=>{
    btnV.className='team-switch-btn active-visit';
    btnL.className='team-switch-btn';
    panV.classList.add('active');
    panL.classList.remove('active');
  });

  // Si viene desde un equipo visitante, mostrar ese equipo primero
  if(fromSlug && fromSlug===p.visitante){
    btnV.click();
  }

  // Main tabs
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-'+t.dataset.tab).classList.add('active');
    });
  });

  // "Ver ficha" (partido en vivo) entra directo al desplegable de jugadores
  if(params.get('tab')==='jugadores'){
    const jt = document.querySelector('.tab[data-tab="jugadores"]');
    if(jt) jt.click();
  }
}

init();
</script>
