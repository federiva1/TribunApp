<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Ícono (solo el emblema de la cancha) y app instalable -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0d1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TribunApp">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Eurotribunapp — Champions y grandes ligas de Europa · TribunApp</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/euro.css">
</head>
<body>
<!-- EUROTRIBUNAPP (prototipo, rama eurotribunapp): la Champions y las 5 grandes ligas de Europa con datos de
     FotMob (data/euro/, scripts/fetch_euro.py). Header propio (dorado) armado por EURO.header() en js/euro.js:
     Fixture y Tablas de la competición que se está mirando; el logo y "Argentina" vuelven al home argentino. -->
<header id="site-header">
  <a class="logo-wrap" href="index.html" title="Volver a TribunApp Argentina"><img src="logo-header.png" alt="TribunApp"></a>
  <div class="header-actions"></div>
</header>
<script src="js/euro.js"></script>
<script>EURO.header('home');</script>

<main id="main">
  <div class="sub">
    <div class="tt"><h1>EURO<b>TRIBUNAPP</b></h1><span>La Champions y las 5 grandes ligas de Europa, con la mecánica de siempre</span></div>
  </div>

  <div class="h2">COMPETICIONES</div>
  <div class="ligas" id="ligas"><div class="vacio">Cargando…</div></div>

  <div class="h2">PARTIDOS DESTACADOS <small>próxima fecha · hora argentina</small></div>
  <div id="destacados"></div>

  <p class="nota" id="nota"></p>
</main>

<script>
(async function () {
  let idx;
  try { idx = await EURO.json('data/euro/index.json'); }
  catch (e) { document.getElementById('ligas').innerHTML = '<div class="vacio">No se pudieron cargar las ligas.</div>'; return; }
  document.getElementById('ligas').innerHTML = idx.ligas.map(L => {
    const ld = L.lider;
    return `<a class="lc" href="euro-liga.html?l=${L.id}"><div class="bar" style="background:${L.color}"></div>`
      + `<div class="top1"><img src="${EURO.logoLiga(L.id)}" alt=""><div><div class="nm">${EURO.esc(L.nombre)}</div>`
      + `<div class="ps">${EURO.esc(L.pais)}${L.fecha ? ' · ' + EURO.esc(EURO.ronda(L.fecha, L.id)) : ''}</div></div></div>`
      + (ld ? `<div class="ld"><img src="${EURO.escudo(ld.id)}" alt=""><span>${EURO.esc(ld.corto)}</span><b>${ld.pts} pts</b></div>` : '')
      + `</a>`;
  }).join('');
  const d = idx.destacados || [];
  document.getElementById('destacados').innerHTML = d.length
    ? d.map(p => EURO.partido(p, { liga: p.liga, logo: true })).join('')
    : '<div class="vacio">Sin partidos en los próximos días.</div>';
  if (idx.actualizado) {
    const t = EURO.ar(idx.actualizado);
    document.getElementById('nota').textContent = `Datos de FotMob · actualizados el ${t.dia} a las ${t.hora}`;
  }
})();
</script>
<script src="js/cuenta.js" defer></script>
<script src="js/header-menu.js" defer></script>
</body>
</html>
