<style>
:root {
  --dark:  #0d0d1a;
  --dark2: #13131f;
  --celeste: #4fc3f7;
  --lib-color: #1b5e20;
  --lib-light: #66bb6a;
  --sud-color: #e65100;
  --sud-light: #ffa726;
  --gold: #f5c518;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

/* ===== HEADER (consistente con index / fixture) ===== */
#site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 10px; gap: 12px;
  background: linear-gradient(180deg, rgba(79,195,247,0.12) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px);
}
.logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-wrap img { height: 52px; object-fit: contain; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.header-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 7px 13px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px;
  color: rgba(255,255,255,0.85); cursor: pointer; text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.header-pill svg { width: 15px; height: 15px; flex-shrink: 0; }
.header-pill:hover { background: rgba(79,195,247,0.16); border-color: rgba(79,195,247,0.45); color: #fff; }
.header-pill-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px; }
@media (max-width: 560px) {
  .header-pill-label { display: none; }
  .header-pill { width: 36px; height: 36px; padding: 0; gap: 0; justify-content: center; }
  .header-actions { gap: 6px; }
}

/* ===== MAIN ===== */
#main { padding: 22px 16px 40px; max-width: 1100px; margin: 0 auto; }
.copas-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 600px) { .copas-wrap { grid-template-columns: 1fr; gap: 32px; } }

/* ===== SECCIÓN DE COPA ===== */
.copa-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid; }
.copa-header.lib { border-color: rgba(27,94,32,0.6); }
.copa-header.sud { border-color: rgba(230,81,0,0.6); }
.copa-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: #fff; }
.copa-ronda { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
.copa-ronda.lib { color: var(--lib-light); }
.copa-ronda.sud { color: var(--sud-light); }
.copa-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 2px; padding: 3px 10px; border-radius: 20px; margin-left: auto; }
.copa-badge.lib { background: rgba(27,94,32,0.3); border: 1px solid rgba(102,187,106,0.4); color: var(--lib-light); }
.copa-badge.sud { background: rgba(230,81,0,0.2); border: 1px solid rgba(255,167,38,0.4); color: var(--sud-light); }

/* ===== GRILLA DE EQUIPOS ===== */
.equipos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.equipo-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 16px 8px 13px; gap: 8px;
  cursor: pointer; text-decoration: none;
  transition: background 0.18s, transform 0.15s, border-color 0.18s, box-shadow 0.18s;
}
.equipo-card.lib:hover { background: rgba(27,94,32,0.2); border-color: rgba(102,187,106,0.5); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27,94,32,0.25); }
.equipo-card.sud:hover { background: rgba(230,81,0,0.15); border-color: rgba(255,167,38,0.5); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230,81,0,0.2); }
.escudo-img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
.equipo-nombre { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; color: rgba(255,255,255,0.9); text-align: center; line-height: 1.15; }
.equipo-rival { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; }
.equipo-result { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; color: var(--gold); }
.empty-msg { text-align: center; padding: 24px 8px; color: rgba(255,255,255,0.3); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; grid-column: 1 / -1; }
</style>
</head>
<body>

<header id="site-header">
  <a class="logo-wrap" href="index.html">
    <img src="Logo.png" alt="TribunApp">
  </a>
  <div class="header-actions">
    <a class="header-pill" href="fixture.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="header-pill-label">Fixture</span>
    </a>
    <a class="header-pill" href="estadisticas-torneo.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="header-pill-label">Estadísticas</span>
    </a>
    <a class="header-pill" href="estadisticas-tribunapp.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="header-pill-label">TribunApp</span>
    </a>
  </div>
</header>

<main id="main">
  <div class="copas-wrap">
    <section class="copa-section">
      <div class="copa-header lib">
        <span class="copa-title">LIBERTADORES</span>
        <span class="copa-ronda lib" id="lib-ronda"></span>
        <span class="copa-badge lib">2026</span>
      </div>
      <div class="equipos-grid" id="lib-grid"></div>
    </section>
    <section class="copa-section">
      <div class="copa-header sud">
        <span class="copa-title">SUDAMERICANA</span>
        <span class="copa-ronda sud" id="sud-ronda"></span>
        <span class="copa-badge sud">2026</span>
      </div>
      <div class="equipos-grid" id="sud-grid"></div>
    </section>
  </div>
</main>

<script src="js/clubes.js"></script>
<script>
function nombreCorto(slug) {
  const c = (typeof CLUBES_CONFIG !== 'undefined') ? CLUBES_CONFIG[slug] : null;
  return (c && c.nombreCorto) || slug;
}

// Para cada equipo argentino: su rival actual + resultado (si algún leg se jugó),
// derivado de data/fixtures/copas.json (preciso, en vez de rivales hardcodeados).
function infoEquipos(copa) {
  const info = {};
  (copa.partidos || []).forEach(p => {
    // lado argentino vs rival
    const arg = p.home.slug ? p.home : (p.away.slug ? p.away : null);
    if (!arg) return;
    const argIsHome = p.home.slug === arg.slug;
    const riv = argIsHome ? p.away : p.home;
    const it = info[arg.slug] || { rival: riv.name, resultados: [] };
    // resultado de ese leg desde la óptica del equipo argentino
    if (p.home_score != null && p.away_score != null) {
      const gf = argIsHome ? p.home_score : p.away_score;
      const gc = argIsHome ? p.away_score : p.home_score;
      it.resultados.push(`${gf}-${gc}`);
    }
    info[arg.slug] = it;
  });
  return info;
}

function renderGrid(copaObj, slugs, containerId, cls) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  if (!slugs.length) { grid.innerHTML = '<div class="empty-msg">Sin equipos en carrera</div>'; return; }
  const info = infoEquipos(copaObj || {});
  slugs.slice().sort((a, b) => nombreCorto(a).localeCompare(nombreCorto(b), 'es')).forEach(slug => {
    const nombre = nombreCorto(slug);
    const i = info[slug] || {};
    const rival = i.rival ? `<div class="equipo-rival">vs ${i.rival}</div>` : '';
    const res = (i.resultados && i.resultados.length) ? `<div class="equipo-result">${i.resultados.join('  ·  ')}</div>` : '';
    const a = document.createElement('a');
    a.className = `equipo-card ${cls}`;
    a.href = `club.html?c=${slug}&copa=${cls === 'lib' ? 'libertadores' : 'sudamericana'}`;
    a.innerHTML =
      `<img class="escudo-img" src="escudos/${slug}.png" alt="${nombre}" onerror="this.style.opacity=0.3">` +
      `<div class="equipo-nombre">${nombre}</div>${rival}${res}`;
    grid.appendChild(a);
  });
}

(async () => {
  let copas = {};
  try { copas = await (await fetch(`data/fixtures/copas.json?t=${Date.now()}`)).json(); } catch (e) {}
  const lib = copas.libertadores || {}, sud = copas.sudamericana || {};
  const libSlugs = (lib.partidos || []).map(p => p.home.slug || p.away.slug).filter(Boolean);
  const sudSlugs = (sud.partidos || []).map(p => p.home.slug || p.away.slug).filter(Boolean);
  const uniq = a => [...new Set(a)];
  document.getElementById('lib-ronda').textContent = lib.ronda || '';
  document.getElementById('sud-ronda').textContent = sud.ronda || '';
  renderGrid(lib, uniq(libSlugs), 'lib-grid', 'lib');
  renderGrid(sud, uniq(sudSlugs), 'sud-grid', 'sud');
})();
</script>
<script src="js/ui-help.js"></script>
</body>
