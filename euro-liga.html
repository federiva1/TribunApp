<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Ícono (solo el emblema de la cancha) y app instalable -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0d1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TribunApp">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Tablas · Eurotribunapp — TribunApp</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/euro.css">
</head>
<body>
<!-- EUROTRIBUNAPP (prototipo, rama eurotribunapp): la Champions y las 5 grandes ligas de Europa con datos de
     FotMob (data/euro/, scripts/fetch_euro.py). Header propio (dorado) armado por EURO.header() en js/euro.js:
     Fixture y Tablas de la competición que se está mirando; el logo y "Argentina" vuelven al home argentino. -->
<header id="site-header">
  <a class="logo-wrap" href="index.html" title="Volver a TribunApp Argentina"><img src="logo-header.png" alt="TribunApp"></a>
  <div class="header-actions"></div>
</header>
<script src="js/euro.js"></script>
<script>EURO.header('tablas');</script>

<main id="main" class="ancho">
  <div class="sub" id="sub">
    <div class="tt"><h1 id="liga-nombre">Cargando…</h1><span id="liga-sub"></span></div>
    <img class="lg fondo" id="liga-logo" src="" alt="" onerror="this.style.display='none'">
  </div>
  <div class="ligas-bar" id="bar"></div>

  <div class="leg" id="leyenda"></div>
  <div class="dos">
    <section>
      <div class="grid-eq" id="grilla"></div>
    </section>
    <section>
      <div class="tabla" id="tabla"></div>
    </section>
  </div>

  <p class="nota">Datos de FotMob · tocá un escudo para ver el club · las fechas están en Fixture</p>
</main>

<script>
(async function () {
  const id = EURO.liga();
  document.getElementById('bar').innerHTML = EURO.selector(id, 'euro-liga.html');
  let L;
  try { L = await EURO.json(`data/euro/${id}.json`); }
  catch (e) { document.getElementById('liga-nombre').textContent = 'Liga no encontrada'; return; }
  document.title = `${L.nombre} · Tablas · Eurotribunapp — TribunApp`;
  document.getElementById('liga-nombre').textContent = L.nombre.toUpperCase();
  document.getElementById('liga-sub').textContent = `${L.pais} · Temporada ${L.temporada || ''}`;
  document.getElementById('liga-logo').src = EURO.logoLiga(L.id);
  document.getElementById('sub').style.setProperty('--cc', L.color + '55');
  const q = `&l=${L.id}`;

  // Equipos (4 por fila en el celular, 3 en compu y estirados al alto de la tabla), con el color de clasificación de FotMob
  document.getElementById('grilla').style.setProperty('--filas', Math.ceil(L.tabla.length / 3));
  document.getElementById('grilla').innerHTML = L.tabla.map(f =>
    `<a class="cell" href="euro-club.html?id=${f.id}${q}" style="${f.color ? 'border-color:' + f.color + '88' : ''}">`
    + `<div class="p">${f.pos}°</div><img src="${EURO.escudo(f.id)}" alt="" loading="lazy">`
    + `<div class="n">${EURO.esc(f.corto)}</div><div class="pts">${f.pts} PTS</div></a>`).join('');
  document.getElementById('leyenda').innerHTML = (L.leyenda || []).map(x =>
    `<span><i style="background:${x.color}"></i>${EURO.esc(EURO.leyenda(x.titulo))}</span>`).join('');

  // Tabla de posiciones
  document.getElementById('tabla').innerHTML =
    `<div class="tr head"><div class="ps">#</div><div></div><div>Equipo</div><div class="n">PJ</div>`
    + `<div class="n gep">G</div><div class="n gep">E</div><div class="n gep">P</div><div class="n">DG</div><div class="pt">Pts</div></div>`
    + L.tabla.map(f => `<a class="tr" href="euro-club.html?id=${f.id}${q}">`
      + (f.color ? `<span class="marca" style="background:${f.color}"></span>` : '')
      + `<div class="ps">${f.pos}</div><img src="${EURO.escudo(f.id)}" alt="" loading="lazy"><div class="nm">${EURO.esc(f.nombre)}</div>`
      + `<div class="n">${f.pj}</div><div class="n gep">${f.g}</div><div class="n gep">${f.e}</div><div class="n gep">${f.p}</div>`
      + `<div class="n">${f.dg > 0 ? '+' : ''}${f.dg}</div><div class="pt">${f.pts}</div></a>`).join('');
})();
</script>
<script src="js/cuenta.js" defer></script>
<script src="js/header-menu.js" defer></script>
</body>
</html>
