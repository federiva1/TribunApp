<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga · Eurotribunapp — TribunApp</title>
<meta name="robots" content="noindex">
<link rel="icon" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/euro.css">
</head>
<body>
<!-- EUROTRIBUNAPP (prototipo, rama eurotribunapp): las 5 grandes ligas de Europa con datos de
     FotMob (data/euro/, scripts/fetch_euro.py). Cada liga → euro-liga.html, cada club → euro-club.html. -->
<header id="site-header">
  <a class="logo-wrap" href="index.html"><img src="logo-header.png" alt="TribunApp"></a>
  <div class="header-actions">
    <a class="header-pill euro" href="euro.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>
      <span class="header-pill-label">EURO</span>
    </a>
    <a class="header-pill" href="fixture.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="header-pill-label">Fixture</span>
    </a>
    <a class="header-pill" href="tablas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span class="header-pill-label">Tablas</span>
    </a>
    <a class="header-pill" href="estadisticas-torneo.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="header-pill-label">Estadísticas</span>
    </a>
    <a class="header-pill" href="estadisticas-tribunapp.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="header-pill-label">TribunApp</span>
    </a>
  </div>
</header>

<main id="main">
  <div class="sub" id="sub">
    <a class="bk" href="euro.html">←</a>
    <div class="tt"><h1 id="liga-nombre">Cargando…</h1><span id="liga-sub"></span></div>
    <img class="lg fondo" id="liga-logo" src="" alt="" onerror="this.style.display='none'">
  </div>

  <div class="tabs">
    <button class="on" data-tab="tabla">TABLA</button>
    <button data-tab="fechas">FECHAS</button>
  </div>

  <section id="tab-tabla">
    <div class="grid-eq" id="grilla"></div>
    <div class="leg" id="leyenda"></div>
    <div class="tabla" id="tabla"></div>
  </section>

  <section id="tab-fechas" hidden>
    <div class="h2" id="prox-tit">PRÓXIMA FECHA</div>
    <div id="proxima"></div>
    <div class="h2" id="ult-tit">ÚLTIMA FECHA</div>
    <div id="ultima"></div>
  </section>

  <p class="nota">Datos de FotMob · tocá un escudo para ver el club</p>
</main>

<script src="js/euro.js"></script>
<script>
(async function () {
  const id = (new URLSearchParams(location.search).get('l') || '47').replace(/\D/g, '');
  let L;
  try { L = await EURO.json(`data/euro/${id}.json`); }
  catch (e) { document.getElementById('liga-nombre').textContent = 'Liga no encontrada'; return; }
  document.title = `${L.nombre} · Eurotribunapp — TribunApp`;
  document.getElementById('liga-nombre').textContent = L.nombre.toUpperCase();
  const fecha = (L.proxima_fecha || L.ultima_fecha || {}).ronda;
  document.getElementById('liga-sub').textContent = `${L.pais} · Temporada ${L.temporada || ''}${fecha ? ' · Fecha ' + fecha : ''}`;
  document.getElementById('liga-logo').src = EURO.logoLiga(L.id);
  document.getElementById('sub').style.setProperty('--cc', L.color + '55');

  // Grilla de escudos (como la Zona A del index), con el color de clasificación de FotMob
  document.getElementById('grilla').innerHTML = L.tabla.map(f =>
    `<a class="cell" href="euro-club.html?id=${f.id}" style="${f.color ? 'border-color:' + f.color + '88' : ''}">`
    + `<div class="p">${f.pos}°</div><img src="${EURO.escudo(f.id)}" alt="" loading="lazy">`
    + `<div class="n">${EURO.esc(f.corto)}</div><div class="pts">${f.pts} PTS</div></a>`).join('');
  document.getElementById('leyenda').innerHTML = (L.leyenda || []).map(x =>
    `<span><i style="background:${x.color}"></i>${EURO.esc(EURO.leyenda(x.titulo))}</span>`).join('');

  // Tabla completa
  document.getElementById('tabla').innerHTML =
    `<div class="tr head"><div class="ps">#</div><div></div><div>Equipo</div><div class="n">PJ</div>`
    + `<div class="n gep">G</div><div class="n gep">E</div><div class="n gep">P</div><div class="n">DG</div><div class="pt">Pts</div></div>`
    + L.tabla.map(f => `<a class="tr" href="euro-club.html?id=${f.id}">`
      + (f.color ? `<span class="marca" style="background:${f.color}"></span>` : '')
      + `<div class="ps">${f.pos}</div><img src="${EURO.escudo(f.id)}" alt="" loading="lazy"><div class="nm">${EURO.esc(f.nombre)}</div>`
      + `<div class="n">${f.pj}</div><div class="n gep">${f.g}</div><div class="n gep">${f.e}</div><div class="n gep">${f.p}</div>`
      + `<div class="n">${f.dg > 0 ? '+' : ''}${f.dg}</div><div class="pt">${f.pts}</div></a>`).join('');

  // Fechas
  const pf = L.proxima_fecha, uf = L.ultima_fecha;
  document.getElementById('prox-tit').innerHTML = pf ? `FECHA ${EURO.esc(pf.ronda)} <small>próxima · hora argentina</small>` : 'PRÓXIMA FECHA';
  document.getElementById('proxima').innerHTML = pf && pf.partidos.length
    ? pf.partidos.map(p => EURO.partido(p)).join('') : '<div class="vacio">Sin partidos programados.</div>';
  document.getElementById('ult-tit').innerHTML = uf ? `FECHA ${EURO.esc(uf.ronda)} <small>última jugada</small>` : 'ÚLTIMA FECHA';
  document.getElementById('ultima').innerHTML = uf && uf.partidos.length
    ? uf.partidos.map(p => EURO.partido(p)).join('') : '<div class="vacio">Todavía no se jugó ninguna fecha.</div>';

  // Tabs
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('tab-tabla').hidden = b.dataset.tab !== 'tabla';
    document.getElementById('tab-fechas').hidden = b.dataset.tab !== 'fechas';
  }));
})();
</script>
<script src="js/header-menu.js" defer></script>
</body>
</html>
