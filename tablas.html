<script>
const LEAGUE = 128;

// ── Promedios (descenso): totales CONGELADOS de 2024 + 2025 por equipo ──────────
// El promedio del descenso 2026 es el coeficiente pts/PJ de las temporadas
// 2024, 2025 y 2026. Las dos primeras ya terminaron: sus totales (puntos y PJ
// jugados) son fijos y se guardan acá (fuente: promiedos.com.ar). El aporte del
// 2026 se suma EN VIVO desde api-sports (tabla anual), así el promedio se
// actualiza solo con cada fecha. Los ascendidos de 2026 no tienen historia (0/0).
// ⚠️ Válido para la temporada 2026. En 2027 hay que recalcular (pasa a 25+26+27).
const PROMEDIO_HIST = {
  bocajuniors:              { pts: 129, pj: 73 },
  riverplate:               { pts: 123, pj: 73 },
  velezsarsfield:           { pts: 116, pj: 73 },
  racingclub:               { pts: 123, pj: 73 },
  argentinosjuniors:        { pts: 113, pj: 73 },
  rosariocentral:           { pts: 113, pj: 73 },
  independiente:            { pts: 110, pj: 73 },
  estudiantes:              { pts: 105, pj: 73 },
  lanus:                    { pts: 109, pj: 73 },
  huracan:                  { pts: 109, pj: 73 },
  talleres:                 { pts: 106, pj: 73 },
  independienterivadavia:   { pts: 89,  pj: 73 },
  barracascentral:          { pts: 98,  pj: 73 },
  union:                    { pts: 99,  pj: 73 },
  sanlorenzo:               { pts: 96,  pj: 73 },
  gimnasiamendoza:          { pts: 0,   pj: 0  },
  defensayjusticia:         { pts: 96,  pj: 73 },
  belgrano:                 { pts: 86,  pj: 73 },
  deportivoriestra:         { pts: 100, pj: 73 },
  gimnasialp:               { pts: 86,  pj: 73 },
  clubatleticoplatense:     { pts: 92,  pj: 73 },
  instituto:                { pts: 87,  pj: 73 },
  tigre:                    { pts: 88,  pj: 73 },
  newellsoldboys:           { pts: 82,  pj: 73 },
  centralcordobadesantiago: { pts: 84,  pj: 73 },
  atleticotucuman:          { pts: 84,  pj: 73 },
  banfield:                 { pts: 76,  pj: 73 },
  sarmiento:                { pts: 70,  pj: 73 },
  aldosivi:                 { pts: 33,  pj: 32 },
  estudiantesderiocuarto:   { pts: 0,   pj: 0  }
};

// Estado del módulo
let DATA = null;          // { zonaA, zonaB, anual, promedios, torneoLabel }
let tab = 'actual';       // 'actual' | 'anual' | 'promedios' | 'xg'
let zona = 'A';           // 'A' | 'B' — aplica a los tabs actual y xg
let XG = null;            // data/tabla_xg.json (generado por los workflows; estático)

// Tabla xG ("moral"): resultado por parte entera del xG de cada partido.
// Se precomputa en scripts/build_tabla_xg.py y llega como archivo estático —
// acá solo se adapta cada fila al shape que espera renderTable (como standings).
async function loadXG() {
  try {
    const r = await fetch(`data/tabla_xg.json?t=${Date.now()}`);
    if (!r.ok) return;
    const d = await r.json();
    const filas = rows => (rows || []).map((t, i) => ({
      rank: i + 1,
      team: { id: t.id, name: t.slug },
      points: t.pts, goalsDiff: t.dif,
      xgf: t.xgf, xgc: t.xgc,
      all: { played: t.pj, win: t.g, draw: t.e, lose: t.p,
             goals: { for: t.gf, against: t.gc } },
    }));
    XG = { A: filas(d.zonaA), B: filas(d.zonaB), fecha: d.ultima_fecha };
  } catch (e) {}
}

// ---- Helpers ----
function slugFromId(id) { return (typeof ESCUDO_MAP !== 'undefined' && ESCUDO_MAP[id]) || null; }
function nombreCorto(id, fallback) { return (typeof NOMBRE_CORTO_T !== 'undefined' && NOMBRE_CORTO_T[id]) || fallback || ('#' + id); }

function formChip(c) {
  const chip = document.createElement('div');
  chip.className = 'form-chip';
  const map = { W: ['#2e7d32', 'G'], D: ['#5c5c5c', 'E'], L: ['#b71c1c', 'P'] };
  const [bg, label] = map[c] || ['#333', '·'];
  chip.style.background = bg; chip.textContent = label;
  return chip;
}

// ---- Fetch standings de una temporada (proxy solo en prod) ----
async function fetchSeason(season) {
  const res = await fetch(`/api/apisports/standings?league=${LEAGUE}&season=${season}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('API ' + res.status);
  const json = await res.json();
  const resp = json.response && json.response[0];
  return (resp && resp.league && resp.league.standings) || [];
}

// Nombre de grupo → { tour: 'apertura'|'clausura'|'', zona: 'A'|'B'|null }
function parseGroup(name) {
  const low = (name || '').toLowerCase();
  const tm = low.match(/apertura|clausura/);
  let zona = null;
  if (/(group|zona|grupo)\s*b\b/.test(low)) zona = 'B';
  else if (/(group|zona|grupo)\s*a\b/.test(low)) zona = 'A';
  return { tour: tm ? tm[0] : '', zona };
}
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

// Suma las estadísticas de cada equipo a lo largo de varios grupos/temporadas.
function accStats(map, groups) {
  (groups || []).forEach(g => g.forEach(t => {
    const a = t.all || {};
    const e = map[t.team.id] || (map[t.team.id] = {
      team: t.team, points: 0, played: 0, win: 0, draw: 0, lose: 0, gf: 0, ga: 0
    });
    e.points += t.points || 0;
    e.played += a.played || 0;
    e.win  += a.win  || 0;
    e.draw += a.draw || 0;
    e.lose += a.lose || 0;
    e.gf += (a.goals && a.goals.for) || 0;
    e.ga += (a.goals && a.goals.against) || 0;
  }));
  return map;
}
function toRow(e) {
  return {
    team: e.team, points: e.points, goalsDiff: e.gf - e.ga,
    all: { played: e.played, win: e.win, draw: e.draw, lose: e.lose, goals: { for: e.gf, against: e.ga } }
  };
}

// La API de league=128 devuelve, en 2026, 4 grupos: Apertura A/B (terminado) y
// Clausura A/B (en curso). Ya NO trae Anual ni Promedios como grupos: los armamos.
//   - Torneo actual  = la última competencia con grupos (Clausura).
//   - Anual          = suma de todas las competencias del año (Apertura + Clausura).
//   - Promedios      = coeficiente pts/PJ sobre las últimas 3 temporadas (descenso).
async function loadAll() {
  const s2026 = await fetchSeason(2026);
  if (!s2026.length) throw new Error('sin datos 2026');

  // ── Torneo en curso ──
  const parsed = s2026.map(g => ({ meta: parseGroup(g[0] && g[0].group), teams: g }));
  const tours = [];
  parsed.forEach(x => { if (x.meta.tour && !tours.includes(x.meta.tour)) tours.push(x.meta.tour); });
  const current = tours[tours.length - 1] || '';
  const curGroups = current ? parsed.filter(x => x.meta.tour === current) : parsed;
  const zonaA = (curGroups.find(x => x.meta.zona === 'A') || curGroups[0] || {}).teams || [];
  const zonaB = (curGroups.find(x => x.meta.zona === 'B') || curGroups[1] || {}).teams || [];
  const torneoLabel = cap(current);

  // ── Anual del año en curso ──
  const anual = Object.values(accStats({}, s2026)).map(toRow)
    .sort((a, b) => b.points - a.points || b.goalsDiff - a.goalsDiff || b.all.goals.for - a.all.goals.for);

  // ── Promedios (descenso): histórico congelado (2024+2025) + 2026 en vivo ──
  const promedios = anual.map(r => {
    const slug = (typeof ESCUDO_MAP !== 'undefined' && ESCUDO_MAP[r.team.id]) || null;
    const h = (slug && PROMEDIO_HIST[slug]) || { pts: 0, pj: 0 };
    return {
      team: r.team,
      points: h.pts + r.points,
      all: { played: h.pj + (r.all.played || 0) }
    };
  }).sort((a, b) => (b.points / (b.all.played || 1)) - (a.points / (a.all.played || 1)));

  return { zonaA, zonaB, anual, promedios, torneoLabel };
}

// ---- Definición de columnas por tipo de tabla ----
// grid: rank | escudo | nombre | ...cols... | pts
const LAYOUTS = {
  actual:    { cols: '26px 26px 1fr 26px 24px 24px 24px 34px 78px 34px', cut: 8, cutType: 'playoff' },
  anual:     { cols: '26px 26px 1fr 26px 24px 24px 24px 34px 34px',       cut: 0, cutType: null },
  xg:        { cols: '26px 26px 1fr 26px 22px 22px 22px 24px 24px 32px 32px 32px 34px', cut: 0, cutType: null },
  promedios: { cols: '26px 26px 1fr 34px 34px 60px',                       cut: 0, cutType: null }
};

function renderTable() {
  const cont = document.getElementById('tabla-container');
  const leyenda = document.getElementById('leyenda');
  cont.innerHTML = '';

  let teams, kind;
  if (tab === 'xg') { teams = XG ? (zona === 'A' ? XG.A : XG.B) : null; kind = 'xg'; }
  else if (tab === 'actual') { teams = DATA && (zona === 'A' ? DATA.zonaA : DATA.zonaB); kind = 'actual'; }
  else if (tab === 'anual') { teams = DATA && DATA.anual; kind = 'anual'; }
  else { teams = DATA && DATA.promedios; kind = 'promedios'; }

  if (!teams || !teams.length) {
    cont.innerHTML = '<div class="empty-msg">Todavía no hay datos para esta tabla.</div>';
    leyenda.style.display = 'none';
    return;
  }

  const layout = LAYOUTS[kind];
  const wrap = document.createElement('div');
  wrap.className = 'tabla-wrap';

  // Encabezado
  const head = document.createElement('div');
  head.className = 'tabla-row tabla-head';
  head.style.gridTemplateColumns = layout.cols;
  if (kind === 'promedios') {
    head.innerHTML =
      '<div class="col-rank">#</div><div></div><div>Equipo</div>' +
      '<div class="col-num">PJ</div><div class="col-num">Pts</div>' +
      '<div style="text-align:right">Prom.</div>';
  } else {
    head.innerHTML =
      '<div class="col-rank">#</div><div></div><div>Equipo</div>' +
      '<div class="col-num">PJ</div><div class="col-num">G</div><div class="col-num">E</div><div class="col-num">P</div>' +
      (kind === 'xg' ? '<div class="col-num">GF</div><div class="col-num">GC</div>' : '') +
      '<div class="col-num">DG</div>' +
      (kind === 'actual' ? '<div class="col-num col-hide-sm">Forma</div>' : '') +
      (kind === 'xg' ? '<div class="col-num col-hide-sm">xGF</div><div class="col-num col-hide-sm">xGC</div>' : '') +
      '<div style="text-align:right">Pts</div>';
  }
  wrap.appendChild(head);

  teams.forEach((t, i) => {
    // Divisor de corte (ej. top 8 clasifican a playoffs en el torneo actual)
    if (layout.cut && i === layout.cut) {
      const div = document.createElement('div');
      div.className = 'cut-divider';
      wrap.appendChild(div);
    }

    const slug = slugFromId(t.team.id);
    const rank = t.rank || (i + 1);
    const relegPos = kind === 'promedios' && i >= teams.length - 2; // últimos 2 = descenso

    // Las filas NO linkean a club.html: al scrollear la tabla se disparaban toques accidentales.
    const row = document.createElement('div');
    row.className = 'tabla-row tabla-body-row' + (rank <= 3 ? ' top3' : '') + (relegPos ? ' releg' : '');
    row.style.gridTemplateColumns = layout.cols;

    const rankEl = document.createElement('div'); rankEl.className = 'col-rank'; rankEl.textContent = rank;

    const escEl = document.createElement('div'); escEl.className = 'col-esc';
    if (slug) {
      const img = document.createElement('img');
      img.src = `escudos/${slug}.png`; img.alt = t.team.name;
      img.onerror = () => { img.style.opacity = '0.25'; };
      escEl.appendChild(img);
    }

    const nameEl = document.createElement('div'); nameEl.className = 'col-name';
    nameEl.textContent = nombreCorto(t.team.id, t.team.name);

    row.appendChild(rankEl); row.appendChild(escEl); row.appendChild(nameEl);

    if (kind === 'promedios') {
      const pj = t.all && t.all.played || 0;
      const avg = pj > 0 ? (t.points / pj).toFixed(3) : '—';
      const pjEl = document.createElement('div'); pjEl.className = 'col-num'; pjEl.textContent = pj;
      const ptsEl = document.createElement('div'); ptsEl.className = 'col-num'; ptsEl.textContent = t.points;
      const avgEl = document.createElement('div'); avgEl.className = 'col-pts'; avgEl.textContent = avg;
      row.appendChild(pjEl); row.appendChild(ptsEl); row.appendChild(avgEl);
    } else {
      const a = t.all || {};
      const mk = v => { const d = document.createElement('div'); d.className = 'col-num'; d.textContent = (v == null ? 0 : v); return d; };
      row.appendChild(mk(a.played));
      row.appendChild(mk(a.win));
      row.appendChild(mk(a.draw));
      row.appendChild(mk(a.lose));

      if (kind === 'xg') {
        // Goles MORALES (parte entera del xG de cada partido) — son los que arman
        // la tabla. Distintos del xG crudo acumulado que va en xGF/xGC.
        const g = (t.all && t.all.goals) || {};
        row.appendChild(mk(g.for));
        row.appendChild(mk(g.against));
      }

      const dg = t.goalsDiff != null ? t.goalsDiff : 0;
      const dgEl = document.createElement('div');
      dgEl.className = 'col-dg ' + (dg > 0 ? 'dg-pos' : dg < 0 ? 'dg-neg' : 'dg-zero');
      dgEl.textContent = dg > 0 ? '+' + dg : dg;
      row.appendChild(dgEl);

      if (kind === 'actual') {
        const formEl = document.createElement('div'); formEl.className = 'col-form col-hide-sm';
        (t.form || '').slice(-5).split('').forEach(c => formEl.appendChild(formChip(c)));
        row.appendChild(formEl);
      }
      if (kind === 'xg') {
        const mkXg = v => {
          const d = document.createElement('div');
          d.className = 'col-num col-hide-sm';
          d.style.color = 'rgba(255,255,255,0.55)';
          d.textContent = (v == null) ? '—' : String(Math.round(Number(v)));
          return d;
        };
        row.appendChild(mkXg(t.xgf));
        row.appendChild(mkXg(t.xgc));
      }

      const ptsEl = document.createElement('div'); ptsEl.className = 'col-pts'; ptsEl.textContent = t.points;
      row.appendChild(ptsEl);
    }

    wrap.appendChild(row);
  });

  cont.appendChild(wrap);

  // Leyenda contextual
  const items = [];
  items.push({ color: 'var(--gold)', txt: 'Líderes' });
  if (kind === 'actual') items.push({ color: 'rgba(79,195,247,0.7)', txt: 'Clasifican a playoffs (línea)' });
  if (tab === 'xg') items.push({ color: 'rgba(79,195,247,0.7)', txt: 'Resultados por parte entera del xG de cada partido' + (XG && XG.fecha ? ` · hasta F${XG.fecha}` : '') });
  if (kind === 'promedios') items.push({ color: 'var(--rojo)', txt: 'Zona de descenso' });
  leyenda.innerHTML = items.map(it =>
    `<div class="item"><span class="dot" style="background:${it.color}"></span>${it.txt}</div>`
  ).join('');
  leyenda.style.display = 'flex';

  if (window.UIHelp) window.UIHelp.refresh();
}

// ---- Navegación entre tabs ----
function switchTab(t, btn) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('zona-subtabs').style.display = (t === 'actual' || t === 'xg') ? 'flex' : 'none';
  renderTable();
}
function switchZona(z) {
  zona = z;
  document.getElementById('zona-btn-A').classList.toggle('active', z === 'A');
  document.getElementById('zona-btn-B').classList.toggle('active', z === 'B');
  renderTable();
}

// ---- Init ----
(async () => {
  const xgReady = loadXG();
  try {
    DATA = await loadAll();
    document.getElementById('page-sub').textContent =
      'Liga Profesional Argentina 2026' + (DATA.torneoLabel ? ' · ' + DATA.torneoLabel : '');
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('tabla-container').style.display = '';
    renderTable();
  } catch (e) {
    console.error(e);
    document.getElementById('loading-state').innerHTML =
      '<div class="loading-msg">No se pudo cargar la tabla en vivo.</div>' +
      '<div style="font-family:Barlow Condensed,sans-serif;font-size:12px;color:rgba(255,255,255,0.3);margin-top:8px;letter-spacing:1px;">Probá de nuevo en unos segundos.</div>';
    // La tabla xG es un archivo estático: si cargó, la página sigue sirviendo.
    await xgReady;
    if (XG) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('tabla-container').style.display = '';
      renderTable();
    }
  }
  await xgReady;
  if (tab === 'xg') renderTable();
})();
</script>
