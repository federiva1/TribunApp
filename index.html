<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TribunApp — Fútbol Argentino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark:  #0d0d1a;
  --dark2: #13131f;
  --celeste: #4fc3f7;
  --celeste-dark: #1e88e5;
  --lib-color: #1b5e20;
  --lib-light: #66bb6a;
  --sud-color: #e65100;
  --sud-light: #ffa726;
  --gold: #f5c518;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

/* ===== HEADER ===== */
#site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 10px; gap: 12px;
  background: linear-gradient(180deg, rgba(79,195,247,0.12) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px);
}
.logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-wrap img { height: 52px; object-fit: contain; }
.header-chip {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--celeste); background: rgba(79,195,247,0.12);
  border: 1px solid rgba(79,195,247,0.3); border-radius: 6px; padding: 3px 8px;
}
@media (max-width: 430px) { .header-chip { display: none; } }
.header-actions { display: flex; gap: 8px; align-items: center; }
.header-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 7px 13px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px;
  color: rgba(255,255,255,0.85); cursor: pointer; text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.header-pill svg { width: 15px; height: 15px; flex-shrink: 0; }
.header-pill:hover { background: rgba(79,195,247,0.16); border-color: rgba(79,195,247,0.45); color: #fff; }
.header-pill-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px; }
@media (max-width: 560px) {
  .header-pill-label { display: none; }
  .header-pill { width: 36px; height: 36px; padding: 0; gap: 0; justify-content: center; }
  .header-actions { gap: 6px; }
}

/* ===== MAIN ===== */
#main { padding: 22px 16px 50px; max-width: 1100px; margin: 0 auto; }

/* ===== TOGGLE VISTA ===== */
.vista-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 26px; }
.vista-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 9px 20px; cursor: pointer; transition: all 0.2s;
}
.vista-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
.vista-btn.active { color: #fff; background: rgba(79,195,247,0.18); border-color: rgba(79,195,247,0.5); }

/* ===== WRAP DE DOS COLUMNAS (zonas / copas) ===== */
.dos-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
@media (max-width: 640px) { .dos-cols { grid-template-columns: 1fr; gap: 30px; } }

/* ===== CABECERA DE SECCIÓN ===== */
.sec-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; padding-bottom: 11px; border-bottom: 2px solid;
}
.sec-header.zonaA { border-color: rgba(79,195,247,0.55); }
.sec-header.zonaB { border-color: rgba(30,136,229,0.55); }
.sec-header.lib   { border-color: rgba(27,94,32,0.6); }
.sec-header.sud   { border-color: rgba(230,81,0,0.6); }
.sec-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: #fff; }
.sec-badge {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1.5px;
  padding: 3px 10px; border-radius: 20px; margin-left: auto;
}
.sec-badge.zonaA { background: rgba(79,195,247,0.18); border: 1px solid rgba(79,195,247,0.4); color: var(--celeste); }
.sec-badge.zonaB { background: rgba(30,136,229,0.18); border: 1px solid rgba(30,136,229,0.4); color: #64b5f6; }
.sec-badge.lib   { background: rgba(27,94,32,0.3); border: 1px solid rgba(102,187,106,0.4); color: var(--lib-light); }
.sec-badge.sud   { background: rgba(230,81,0,0.2); border: 1px solid rgba(255,167,38,0.4); color: var(--sud-light); }

/* ===== GRILLA DE EQUIPOS ===== */
.equipos-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 9px;
}
.equipo-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 13px; padding: 13px 6px 11px; gap: 8px;
  cursor: pointer; text-decoration: none;
  transition: background 0.16s, transform 0.14s, border-color 0.16s, box-shadow 0.16s;
}
.equipo-card:hover { background: rgba(79,195,247,0.14); border-color: rgba(79,195,247,0.45); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
.equipo-card.lib:hover { background: rgba(27,94,32,0.2); border-color: rgba(102,187,106,0.5); }
.equipo-card.sud:hover { background: rgba(230,81,0,0.15); border-color: rgba(255,167,38,0.5); }

/* ===== COPAS (mismo look que copas.html) ===== */
.sec-ronda { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
.sec-ronda.lib { color: var(--lib-light); }
.sec-ronda.sud { color: var(--sud-light); }
.copa-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.copa-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 16px 8px 13px; gap: 8px; cursor: pointer; text-decoration: none;
  transition: background 0.18s, transform 0.15s, border-color 0.18s, box-shadow 0.18s;
}
.copa-card.lib:hover { background: rgba(27,94,32,0.2); border-color: rgba(102,187,106,0.5); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27,94,32,0.25); }
.copa-card.sud:hover { background: rgba(230,81,0,0.15); border-color: rgba(255,167,38,0.5); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230,81,0,0.2); }
.copa-card .escudo-img { width: 44px; height: 44px; }
.copa-card .equipo-nombre { font-size: 13px; color: rgba(255,255,255,0.9); }
.copa-rival { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; }
.copa-result { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; color: var(--gold); }
.copa-empty { text-align: center; padding: 22px 8px; color: rgba(255,255,255,0.3); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; grid-column: 1 / -1; }
.escudo-img { width: 42px; height: 42px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
.equipo-nombre {
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600;
  letter-spacing: 0.3px; color: rgba(255,255,255,0.85); text-align: center; line-height: 1.15;
}

/* link a copas.html */
.ver-mas {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 14px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px;
  color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.2s;
}
.ver-mas:hover { color: #fff; }

#loading-state { text-align: center; padding: 60px 20px; }
.loading-msg { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<!-- HEADER -->
<header id="site-header">
  <a class="logo-wrap" href="index.html">
    <img src="Logo.png" alt="TribunApp">
  </a>
  <div class="header-actions">
    <a class="header-pill" href="fixture.html" data-help="Fixture: todos los partidos por fecha, con resultados y la ficha de cada partido.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="header-pill-label">Fixture</span>
    </a>
    <a class="header-pill" href="estadisticas-torneo.html" data-help="Estadísticas del torneo: goleadores, asistidores y los datos de cada equipo y partido.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="header-pill-label">Estadísticas</span>
    </a>
    <a class="header-pill" href="estadisticas-tribunapp.html" data-help="Estadísticas de la comunidad: las formaciones más votadas y los puntajes que los hinchas le pusieron a cada jugador.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="header-pill-label">TribunApp</span>
    </a>
  </div>
</header>

<!-- MAIN -->
<main id="main">
  <div id="loading-state"><div class="loading-msg">CARGANDO...</div></div>

  <div id="contenido" style="display:none;">
    <!-- toggle -->
    <div class="vista-toggle">
      <button class="vista-btn active" id="btn-local" onclick="cambiarVista('local')">Torneo Local</button>
      <button class="vista-btn" id="btn-copas" onclick="cambiarVista('copas')">Copas</button>
    </div>

    <!-- TORNEO LOCAL: Zona A | Zona B -->
    <div id="vista-local">
      <div class="dos-cols">
        <section>
          <div class="sec-header zonaA">
            <span class="sec-title">ZONA A</span>
            <span class="sec-badge zonaA" id="cnt-a"></span>
          </div>
          <div class="equipos-grid" id="zonaA-grid"></div>
        </section>
        <section>
          <div class="sec-header zonaB">
            <span class="sec-title">ZONA B</span>
            <span class="sec-badge zonaB" id="cnt-b"></span>
          </div>
          <div class="equipos-grid" id="zonaB-grid"></div>
        </section>
      </div>
    </div>

    <!-- COPAS: Libertadores | Sudamericana -->
    <div id="vista-copas" style="display:none;">
      <div class="dos-cols">
        <section>
          <div class="sec-header lib">
            <span class="sec-title">LIBERTADORES</span>
            <span class="sec-ronda lib" id="lib-ronda"></span>
            <span class="sec-badge lib">2026</span>
          </div>
          <div class="copa-grid" id="lib-grid"></div>
        </section>
        <section>
          <div class="sec-header sud">
            <span class="sec-title">SUDAMERICANA</span>
            <span class="sec-ronda sud" id="sud-ronda"></span>
            <span class="sec-badge sud">2026</span>
          </div>
          <div class="copa-grid" id="sud-grid"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<script src="js/clubes.js"></script>
<script>
// Zonas de la Liga Profesional (fijas para la temporada — Apertura y Clausura comparten división)
const ZONA_A = ['estudiantes','bocajuniors','velezsarsfield','talleres','independiente','lanus','sanlorenzo','union','instituto','defensayjusticia','gimnasiamendoza','clubatleticoplatense','centralcordobadesantiago','newellsoldboys','deportivoriestra'];
const ZONA_B = ['independienterivadavia','riverplate','argentinosjuniors','rosariocentral','belgrano','gimnasialp','huracan','racingclub','barracascentral','tigre','sarmiento','banfield','atleticotucuman','aldosivi','estudiantesderiocuarto'];
function nombreCorto(slug) {
  const c = (typeof CLUBES_CONFIG !== 'undefined') ? CLUBES_CONFIG[slug] : null;
  return (c && c.nombreCorto) || slug;
}

// Renderiza una grilla de equipos (ordenados alfabéticamente para encontrarlos rápido)
function renderGrid(slugs, containerId, opts) {
  opts = opts || {};
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  const ordenados = slugs.slice().sort((a, b) => nombreCorto(a).localeCompare(nombreCorto(b), 'es'));
  ordenados.forEach(slug => {
    const nombre = nombreCorto(slug);
    const a = document.createElement('a');
    a.className = 'equipo-card' + (opts.cls ? ' ' + opts.cls : '');
    a.href = `club.html?c=${slug}${opts.hrefExtra || ''}`;
    a.innerHTML =
      `<img class="escudo-img" src="escudos/${slug}.png" alt="${nombre}" onerror="this.style.opacity=0.3">` +
      `<div class="equipo-nombre">${nombre}</div>`;
    grid.appendChild(a);
  });
}

function cambiarVista(v) {
  const local = v === 'local';
  document.getElementById('vista-local').style.display = local ? '' : 'none';
  document.getElementById('vista-copas').style.display = local ? 'none' : '';
  document.getElementById('btn-local').classList.toggle('active', local);
  document.getElementById('btn-copas').classList.toggle('active', !local);
}

// ── COPAS: misma interfaz que copas.html (rival + resultado + ronda, desde copas.json) ──
function copaInfoEquipos(copa) {
  const info = {};
  (copa.partidos || []).forEach(p => {
    const arg = p.home.slug ? p.home : (p.away.slug ? p.away : null);
    if (!arg) return;
    const argIsHome = p.home.slug === arg.slug;
    const riv = argIsHome ? p.away : p.home;
    const it = info[arg.slug] || { rival: riv.name, resultados: [] };
    if (p.home_score != null && p.away_score != null) {
      const gf = argIsHome ? p.home_score : p.away_score;
      const gc = argIsHome ? p.away_score : p.home_score;
      it.resultados.push(`${gf}-${gc}`);
    }
    info[arg.slug] = it;
  });
  return info;
}
function renderCopaGrid(copaObj, cls, gridId, rondaId) {
  copaObj = copaObj || {};
  document.getElementById(rondaId).textContent = copaObj.ronda || '';
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  const slugs = [...new Set((copaObj.partidos || []).map(p => p.home.slug || p.away.slug).filter(Boolean))];
  if (!slugs.length) { grid.innerHTML = '<div class="copa-empty">Sin equipos en carrera</div>'; return; }
  const info = copaInfoEquipos(copaObj);
  slugs.sort((a, b) => nombreCorto(a).localeCompare(nombreCorto(b), 'es')).forEach(slug => {
    const nombre = nombreCorto(slug);
    const i = info[slug] || {};
    const rival = i.rival ? `<div class="copa-rival">vs ${i.rival}</div>` : '';
    const res = (i.resultados && i.resultados.length) ? `<div class="copa-result">${i.resultados.join('  ·  ')}</div>` : '';
    const a = document.createElement('a');
    a.className = `copa-card ${cls}`;
    a.href = `club.html?c=${slug}&copa=${cls === 'lib' ? 'libertadores' : 'sudamericana'}`;
    a.innerHTML =
      `<img class="escudo-img" src="escudos/${slug}.png" alt="${nombre}" onerror="this.style.opacity=0.3">` +
      `<div class="equipo-nombre">${nombre}</div>${rival}${res}`;
    grid.appendChild(a);
  });
}

// Render inicial
renderGrid(ZONA_A, 'zonaA-grid');
renderGrid(ZONA_B, 'zonaB-grid');
document.getElementById('cnt-a').textContent = ZONA_A.length + ' equipos';
document.getElementById('cnt-b').textContent = ZONA_B.length + ' equipos';
(async () => {
  let copas = {};
  try { copas = await (await fetch(`data/fixtures/copas.json?t=${Date.now()}`)).json(); } catch (e) {}
  renderCopaGrid(copas.libertadores, 'lib', 'lib-grid', 'lib-ronda');
  renderCopaGrid(copas.sudamericana, 'sud', 'sud-grid', 'sud-ronda');
})();
document.getElementById('loading-state').style.display = 'none';
document.getElementById('contenido').style.display = '';
</script>
<script src="js/ui-help.js"></script>
</body>
</html>
