<style>
:root {
  --dark:  #0d0d1a;
  --dark2: #13131f;
  --celeste: #4fc3f7;
  --celeste-dark: #1e88e5;
  --lib-color: #1b5e20;
  --lib-light: #66bb6a;
  --sud-color: #e65100;
  --sud-light: #ffa726;
  --gold: #f5c518;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

/* ===== HEADER ===== */
#site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 10px; gap: 12px;
  background: linear-gradient(180deg, rgba(79,195,247,0.12) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px);
}
.logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
/* Logo del header — MISMO tamaño en todas las páginas de la web (si se cambia, cambiarlo en todas).
   Logo.png es 1880x836 (ratio 2.25) → a 72px de alto ocupa ~162px de ancho.
   Tamaños previos: 52px (index/fixture/tablas) y 56px (resto, inline). */
.logo-wrap img { height: 72px; object-fit: contain; }
@media (max-width: 430px) { .logo-wrap img { height: 60px; } }
.header-chip {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--celeste); background: rgba(79,195,247,0.12);
  border: 1px solid rgba(79,195,247,0.3); border-radius: 6px; padding: 3px 8px;
}
@media (max-width: 430px) { .header-chip { display: none; } }
.header-actions { display: flex; gap: 8px; align-items: center; }
.header-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 7px 13px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px;
  color: rgba(255,255,255,0.85); cursor: pointer; text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.header-pill svg { width: 15px; height: 15px; flex-shrink: 0; }
.header-pill:hover { background: rgba(79,195,247,0.16); border-color: rgba(79,195,247,0.45); color: #fff; }
.header-pill-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px; }
@media (max-width: 560px) {
  .header-pill-label { display: none; }
  .header-pill { width: 36px; height: 36px; padding: 0; gap: 0; justify-content: center; }
  .header-actions { gap: 6px; }
}

/* ===== MAIN ===== */
#main { padding: 22px 16px 50px; max-width: 1100px; margin: 0 auto; }

/* ===== TOGGLE VISTA ===== */

.vista-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 26px; }

/* ===== EN JUEGO (partidos en curso, liga + copas) ===== */
#live-strip { margin-bottom: 22px; }
.live-strip-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 3px;
  color: var(--verde, #2ad572); text-align: center; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ad572; animation: livePulse 1.4s ease-in-out infinite; }
@keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
.live-cards { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.live-card {
  display: flex; flex-direction: column; gap: 6px; min-width: 250px; max-width: 330px; flex: 0 1 auto;
  background: rgba(42,213,114,0.05); border: 1px solid rgba(42,213,114,0.35);
  border-radius: 12px; padding: 10px 14px; text-decoration: none; color: #fff;
  transition: background 0.2s, border-color 0.2s;
}
.live-card:hover { background: rgba(42,213,114,0.1); border-color: rgba(42,213,114,0.6); }
.live-card-meta { display: flex; justify-content: space-between; align-items: center; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.45); }
.live-card-min { color: #2ad572; font-weight: 700; }
.live-card-fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.live-card-lado { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
.live-card-lado.away { justify-content: flex-end; }
.live-card-lado img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
.live-card-lado .nom { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-card-lado .escudo-ini { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.1); display: inline-flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.6); flex-shrink: 0; }
.live-card-score { font-family: 'Bebas Neue', sans-serif; font-size: 21px; letter-spacing: 1px; color: #fff; flex-shrink: 0; }
/* Sudamericana con su color de identidad (el mismo ámbar del apartado Copas). */
.live-card.sud { background: rgba(230,81,0,0.07); border-color: rgba(255,167,38,0.4); }
.live-card.sud:hover { background: rgba(230,81,0,0.13); border-color: rgba(255,167,38,0.65); }
.live-card.sud .live-card-min { color: var(--sud-light); }
/* la card entera despliega las formaciones; la flechita centrada abajo es el
   indicio de desplegable (rota al abrir) */
.live-card { cursor: pointer; }
.live-card-toggle { text-align: center; margin-top: 2px; color: rgba(255,255,255,0.35); font-size: 11px;
  line-height: 1; transition: transform .18s, color .15s; }
.live-card:hover .live-card-toggle { color: #fff; }
.live-card.open .live-card-toggle { transform: rotate(180deg); color: #2ad572; }
.live-ficha { max-width: 620px; margin: 10px auto 0; padding: 12px 10px; border: 1px solid rgba(255,255,255,0.09);
  border-radius: 14px; background: rgba(255,255,255,0.02); }
.live-ficha-tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.live-ficha-tab { padding: 5px 14px; background: none; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
  cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,0.5); transition: color .15s, border-color .15s, background .15s; }
.live-ficha-tab:hover { color: #fff; }
.live-ficha-tab.active { color: #2ad572; border-color: rgba(42,213,114,0.55); background: rgba(42,213,114,0.08); }
@media (max-width: 520px) { .live-ficha { padding: 10px 6px; } }
.live-ficha-loading { text-align: center; padding: 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.3); }
.live-card-goles { display: flex; justify-content: space-between; gap: 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; color: rgba(255,255,255,0.55); line-height: 1.45; }
.live-card-goles > div { min-width: 0; }
.live-card-goles .gol-away { text-align: right; }
.live-card-goles .gol { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.vista-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 9px 20px; cursor: pointer; transition: all 0.2s;
}
.vista-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
.vista-btn.active { color: #fff; background: rgba(79,195,247,0.18); border-color: rgba(79,195,247,0.5); }

/* ===== WRAP DE DOS COLUMNAS (zonas / copas) ===== */
.dos-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
@media (max-width: 640px) { .dos-cols { grid-template-columns: 1fr; gap: 30px; } }

/* ===== CABECERA DE SECCIÓN ===== */
.sec-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; padding-bottom: 11px; border-bottom: 2px solid;
}
.sec-header.zonaA, .sec-header.zonaB { justify-content: center; }
.sec-header.zonaA { border-color: rgba(79,195,247,0.55); }
.sec-header.zonaB { border-color: rgba(30,136,229,0.55); }
.sec-header.lib   { border-color: rgba(27,94,32,0.6); }
.sec-header.sud   { border-color: rgba(230,81,0,0.6); }
.sec-box { display: contents; }
.sec-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: #fff; }
.sec-badge {
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1.5px;
  padding: 3px 10px; border-radius: 20px; margin-left: auto;
}
.sec-badge.zonaA { background: rgba(79,195,247,0.18); border: 1px solid rgba(79,195,247,0.4); color: var(--celeste); }
.sec-badge.zonaB { background: rgba(30,136,229,0.18); border: 1px solid rgba(30,136,229,0.4); color: #64b5f6; }
.sec-badge.lib   { background: rgba(27,94,32,0.3); border: 1px solid rgba(102,187,106,0.4); color: var(--lib-light); }
.sec-badge.sud   { background: rgba(230,81,0,0.2); border: 1px solid rgba(255,167,38,0.4); color: var(--sud-light); }

/* ===== TABLA DE CADA ZONA ===== */
.tz-wrap { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; overflow: hidden; }
.tz-row { display: grid; grid-template-columns: var(--tz-cols); align-items: center; gap: 4px;
  padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); position: relative; }
.tz-row:last-child { border-bottom: none; }
.tz-head { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.08); }
.tz-head .n, .tz-head .r { text-align: center; }
.tz-head .p { text-align: right; }
.tz-rank { font-family: 'Bebas Neue', sans-serif; font-size: 14px; text-align: center; color: rgba(255,255,255,0.32); }
.tz-esc { display: flex; align-items: center; justify-content: center; }
.tz-esc img { width: 20px; height: 20px; object-fit: contain; }
.tz-name { font-family: 'Barlow Condensed', sans-serif; font-size: 13.5px; font-weight: 600; color: #ddd;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tz-num { font-family: 'Bebas Neue', sans-serif; font-size: 13px; text-align: center; color: #aaa; }
.tz-pts { font-family: 'Bebas Neue', sans-serif; font-size: 16px; text-align: right; color: #fff; padding-right: 2px; }
.dg-pos { color: #4cd07d; }
.dg-neg { color: #e5585b; }
.dg-zero { color: #888; }
.tz-row.dentro { background: rgba(79,195,247,0.045); box-shadow: inset 3px 0 0 rgba(79,195,247,0.85); }
.tz-row.dentro .tz-rank { color: var(--celeste); }
.tz-row.fuera { opacity: 0.82; }
.tz-corte { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 16px; background: rgba(0,0,0,0.18); }
.tz-corte::before, .tz-corte::after { content: ''; flex: 1; border-top: 1px dashed rgba(79,195,247,0.55); }
.tz-corte span { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(79,195,247,0.85); white-space: nowrap; }
/* la tabla a un costado de la grilla (A: tabla | equipos — B: equipos | tabla) */
#main { max-width: 1280px; }
@media (min-width: 901px) {
  #vista-local section { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "cab cab" "tab gri"; column-gap: 16px; align-items: start; }
  #vista-local section:nth-child(2) { grid-template-areas: "cab cab" "gri tab"; }
  #vista-local section .sec-header { grid-area: cab; }
  #vista-local section .equipos-grid { grid-area: gri; grid-template-columns: repeat(3, 1fr); }
  #vista-local section .tz { grid-area: tab; }
}
@media (max-width: 900px) { .tz { margin-top: 18px; } }

/* ===== TÍTULOS: pestañas en cápsula y cabeceras de zona con líneas laterales ===== */
@media all {
  .vista-toggle { width: max-content; margin: 0 auto 30px; padding: 4px; gap: 2px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
  .vista-btn { background: transparent; border-color: transparent; border-radius: 10px; padding: 7px 26px 5px;
    font-family: 'Bebas Neue', sans-serif; font-size: 20px; font-weight: 400; letter-spacing: 4px; }
  .vista-btn:hover { background: rgba(255,255,255,0.05); border-color: transparent; }
  .vista-btn.active { background: linear-gradient(180deg, rgba(79,195,247,0.30), rgba(79,195,247,0.12));
    border-color: rgba(79,195,247,0.55); box-shadow: 0 0 18px rgba(79,195,247,0.18); }
  .sec-header.zonaA, .sec-header.zonaB { --c: 79,195,247; gap: 16px; border-bottom: none; padding-bottom: 0; margin-bottom: 18px; }
  .sec-header.zonaB { --c: 100,150,255; }
  .sec-header.zonaA::before, .sec-header.zonaB::before, .sec-header.zonaA::after, .sec-header.zonaB::after {
    content: ''; flex: 1; height: 2px; border-radius: 2px; }
  .sec-header.zonaA::before, .sec-header.zonaB::before { background: linear-gradient(90deg, transparent, rgba(var(--c),0.75)); }
  .sec-header.zonaA::after, .sec-header.zonaB::after { background: linear-gradient(270deg, transparent, rgba(var(--c),0.75)); }
  .sec-header.zonaA .sec-title, .sec-header.zonaB .sec-title { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; padding: 9px 26px;
    border: 1px solid rgba(var(--c),0.5); border-radius: 10px; background: rgba(var(--c),0.10);
    text-shadow: 0 0 14px rgba(var(--c),0.55); }
}

@media all {
  .sec-header.lib, .sec-header.sud { gap: 16px; justify-content: center; border-bottom: none; padding-bottom: 0; margin-bottom: 18px; }
  .sec-header.lib { --c: 102,187,106; }
  .sec-header.sud { --c: 255,167,38; }
  .sec-header.lib::before, .sec-header.sud::before, .sec-header.lib::after, .sec-header.sud::after {
    content: ''; flex: 1; height: 2px; border-radius: 2px; }
  .sec-header.lib::before, .sec-header.sud::before { background: linear-gradient(90deg, transparent, rgba(var(--c),0.75)); }
  .sec-header.lib::after, .sec-header.sud::after { background: linear-gradient(270deg, transparent, rgba(var(--c),0.75)); }
  .sec-header.lib .sec-box, .sec-header.sud .sec-box { display: flex; align-items: center; gap: 10px; padding: 9px 22px;
    border: 1px solid rgba(var(--c),0.5); border-radius: 10px; background: rgba(var(--c),0.10); }
  .sec-header.lib .sec-title, .sec-header.sud .sec-title { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 1.5px; text-shadow: 0 0 14px rgba(var(--c),0.55); }
}

@media (max-width: 560px) {
  .vista-toggle { margin-bottom: 22px; }
  .vista-btn { font-size: 17px; letter-spacing: 3px; padding: 7px 18px 5px; }
  .sec-header.zonaA, .sec-header.zonaB, .sec-header.lib, .sec-header.sud { gap: 10px; margin-bottom: 14px; }
  .sec-header.zonaA .sec-title, .sec-header.zonaB .sec-title { padding: 8px 20px; }
  .sec-header.lib .sec-box, .sec-header.sud .sec-box { padding: 8px 14px; gap: 8px; }
}

/* ===== COMPACTO (escritorio): que la home entera entre en pantallas de poco alto ===== */
@media (min-width: 901px) {
  #main { padding-top: 14px; padding-bottom: 30px; }
  .vista-toggle { margin-bottom: 18px; }
  .sec-header.zonaA, .sec-header.zonaB, .sec-header.lib, .sec-header.sud { margin-bottom: 12px; }
  #vista-local .equipos-grid { gap: 8px; }
  #vista-local .equipo-card { padding: 9px 6px 20px; gap: 4px; border-radius: 12px; }
  #vista-local .equipo-card .escudo-img { width: 36px; height: 36px; }
  #vista-local .pos-badge { top: 5px; left: 8px; }
  #vista-local .pts-badge { bottom: 5px; right: 8px; }
  .tz-row { padding: 4px 10px; }
  .tz-esc img { width: 18px; height: 18px; }
}
@media (min-width: 901px) and (max-height: 800px) {
  #site-header { padding-top: 6px; padding-bottom: 5px; }
  .logo-wrap img { height: 56px; }
}

/* ===== CUADRO DE PLAYOFFS (pronóstico del hincha) ===== */
.pl { margin-top: 34px; }
.pl[hidden] { display: none; }
.pl .sec-header { margin-bottom: 8px; }
.pl-acc { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
.pl-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 9px; padding: 6px 14px; cursor: pointer; transition: all 0.16s; }
.pl-btn:hover { color: #fff; border-color: rgba(79,195,247,0.5); background: rgba(79,195,247,0.12); }
.pl-btn[disabled] { opacity: 0.35; cursor: default; pointer-events: none; }
.pl-ronda { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 3px; color: var(--celeste);
  text-align: center; margin-bottom: 8px; }
/* partido */
.pl-p { position: relative; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 10px; overflow: visible; }
.pl-eq { display: flex; align-items: center; gap: 6px; height: 29px; padding: 0 7px; cursor: pointer;
  transition: background 0.14s, opacity 0.14s; position: relative; }
.pl-eq + .pl-eq { border-top: 1px solid rgba(255,255,255,0.06); }
.pl-eq:first-child { border-radius: 9px 9px 0 0; }
.pl-eq:last-child { border-radius: 0 0 9px 9px; }
.pl-eq[data-slug]:hover { background: rgba(79,195,247,0.12); }
.pl-eq.vacio { cursor: default; }
.pl-seed { font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 0.5px; color: rgba(255,255,255,0.38);
  width: 18px; flex: 0 0 auto; text-align: center; }
.pl-eq img { width: 18px; height: 18px; object-fit: contain; flex: 0 0 auto; }
.pl-nom { flex: 1; min-width: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
  color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-eq.vacio .pl-nom { color: rgba(255,255,255,0.25); font-weight: 400; font-style: italic; }
.pl-eq.gana { background: rgba(79,195,247,0.14); box-shadow: inset 3px 0 0 var(--celeste); }
.pl-eq.gana .pl-nom { color: #fff; }
.pl-eq.gana .pl-seed { color: var(--celeste); }
.pl-eq.pierde { opacity: 0.4; }
.pl-eq.mod .pl-seed { color: var(--gold); }
.pl-edit { flex: 0 0 auto; width: 20px; height: 20px; border: none; border-radius: 6px; background: transparent;
  color: rgba(255,255,255,0.3); font-size: 12px; cursor: pointer; line-height: 20px; padding: 0; }
.pl-edit:hover { color: #fff; background: rgba(255,255,255,0.1); }
/* campeón: "CAMPEÓN" arriba de la final (y el escudo del ganador cuando lo hay); trofeo abajo */
.pl-camp { text-align: center; }
.pl-camp-esc { width: 54px; height: 54px; object-fit: contain; display: block; margin: 0 auto 6px;
  filter: drop-shadow(0 0 14px rgba(245,197,24,0.45)) drop-shadow(0 3px 8px rgba(0,0,0,0.5)); animation: plSube 0.35s ease-out; }
@keyframes plSube { from { opacity: 0; transform: translateY(10px) scale(0.85); } to { opacity: 1; transform: none; } }
.pl-camp-lab { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 4px; color: var(--gold); }
.pl-trofeo { display: flex; justify-content: center; }
.pl-trofeo svg { height: 140px; width: auto; opacity: 0.5; transition: opacity 0.3s, filter 0.3s; }
.pl-trofeo.ok svg { opacity: 1; filter: drop-shadow(0 0 14px rgba(255,255,255,0.18)); }
/* escritorio: cuadro de dos mitades que convergen en la final */
.pl-desk { display: none; }
.pl-mob { display: block; }
@media (min-width: 901px) {
  .pl-desk { display: grid; --g: 22px; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.15fr) repeat(3, minmax(0, 1fr));
    column-gap: var(--g); }
  .pl-mob { display: none; }
  .pl-col { display: flex; flex-direction: column; }
  .pl-col-in { flex: none; display: flex; flex-direction: column; height: 410px; position: relative; }
  .pl-par { flex: 1; display: flex; flex-direction: column; justify-content: space-around; position: relative; }
  /* llaves: línea que une los dos partidos del par y sale hacia la ronda siguiente */
  .pl-col.izq .pl-par:not(.uno)::after, .pl-col.der .pl-par:not(.uno)::after {
    content: ''; position: absolute; top: 25%; bottom: 25%; width: calc(var(--g) / 2);
    border: 1px solid rgba(79,195,247,0.35); pointer-events: none; }
  .pl-col.izq .pl-par:not(.uno)::after { right: calc(var(--g) / -2); border-left: none; border-radius: 0 6px 6px 0; }
  .pl-col.der .pl-par:not(.uno)::after { left: calc(var(--g) / -2); border-right: none; border-radius: 6px 0 0 6px; }
  .pl-col.izq.r2 .pl-p::before, .pl-col.izq.r3 .pl-p::before,
  .pl-col.der.r2 .pl-p::before, .pl-col.der.r3 .pl-p::before {
    content: ''; position: absolute; top: 50%; width: calc(var(--g) / 2); border-top: 1px solid rgba(79,195,247,0.35); pointer-events: none; }
  .pl-col.izq.r2 .pl-p::before, .pl-col.izq.r3 .pl-p::before { left: calc(var(--g) / -2 - 1px); }
  .pl-col.der.r2 .pl-p::before, .pl-col.der.r3 .pl-p::before { right: calc(var(--g) / -2 - 1px); }
  .pl-col.izq.r3 .pl-p::after, .pl-col.der.r3 .pl-p::after {
    content: ''; position: absolute; top: 50%; width: var(--g); border-top: 1px solid rgba(79,195,247,0.35); pointer-events: none; }
  .pl-col.izq.r3 .pl-p::after { right: calc(var(--g) * -1 - 1px); }
  .pl-col.der.r3 .pl-p::after { left: calc(var(--g) * -1 - 1px); }
  .pl-col.fin .pl-p { border-color: rgba(245,197,24,0.45); }
  .pl-col.fin .pl-camp { position: absolute; left: 0; right: 0; bottom: calc(50% + 40px); }
  .pl-col.fin .pl-trofeo { position: absolute; left: 0; right: 0; top: calc(50% + 46px); }
  .pl-col.fin .pl-ronda { color: var(--gold); }
}
/* celular: una ronda debajo de la otra */
.pl-m-ronda { margin-bottom: 16px; }
.pl-m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pl-m-grid.uno { grid-template-columns: minmax(0, 260px); justify-content: center; }
.pl-mob .pl-camp { margin-bottom: 8px; }
.pl-mob .pl-trofeo { margin-top: 12px; }
.pl-mob .pl-trofeo svg { height: 120px; }
/* selector de equipo */
.pl-modal { position: fixed; inset: 0; z-index: 200; background: rgba(5,7,15,0.78); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 16px; }
.pl-modal[hidden] { display: none; }
.pl-modal-box { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--dark2);
  border: 1px solid rgba(79,195,247,0.35); border-radius: 16px; padding: 16px 16px 14px; }
.pl-modal-tit { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
.pl-modal-tit b { color: var(--celeste); font-weight: 400; }
.pl-modal-nota { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: rgba(255,255,255,0.45); margin-bottom: 10px; }
.pl-modal-zona { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; color: rgba(255,255,255,0.5); margin: 8px 0 6px; }
.pl-modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.pl-op { display: flex; align-items: center; gap: 6px; padding: 6px 7px; border-radius: 9px; cursor: pointer;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #ddd;
  font-family: 'Barlow Condensed', sans-serif; font-size: 12.5px; font-weight: 600; text-align: left; min-width: 0; }
.pl-op img { width: 20px; height: 20px; object-fit: contain; flex: 0 0 auto; }
.pl-op span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-op:hover { border-color: rgba(79,195,247,0.5); background: rgba(79,195,247,0.12); color: #fff; }
.pl-op.act { border-color: var(--celeste); background: rgba(79,195,247,0.2); color: #fff; }
.pl-modal-acc { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }

/* ===== GRILLA DE EQUIPOS ===== */
.equipos-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 9px;
}
.equipo-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 13px; padding: 13px 6px 11px; gap: 8px; position: relative;
  cursor: pointer; text-decoration: none;
  transition: background 0.16s, transform 0.14s, border-color 0.16s, box-shadow 0.16s;
}
/* nº de posición en la tabla — sutil, sin cajita, esquina del cuadro */
.pos-badge {
  position: absolute; top: 6px; left: 8px;
  font-family: 'Bebas Neue', sans-serif; font-size: 12px; line-height: 1;
  color: rgba(255,255,255,0.35); letter-spacing: 0.5px; pointer-events: none;
}
/* puntos del equipo — mismo estilo sutil, esquina inferior derecha */
.pts-badge {
  position: absolute; bottom: 6px; right: 8px;
  font-family: 'Bebas Neue', sans-serif; font-size: 11px; line-height: 1;
  color: rgba(255,255,255,0.35); letter-spacing: 0.5px; pointer-events: none;
}
/* solo las cards con badge de puntos reservan lugar abajo (las de copas no lo llevan) */

.equipo-card:hover { background: rgba(79,195,247,0.14); border-color: rgba(79,195,247,0.45); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.35); }

.copa-card.sud:hover { background: rgba(230,81,0,0.15); border-color: rgba(255,167,38,0.5); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230,81,0,0.2); }

<script>
// Zonas de la Liga Profesional (fijas para la temporada — Apertura y Clausura comparten división)
const ZONA_A = ['estudiantes','bocajuniors','velezsarsfield','talleres','independiente','lanus','sanlorenzo','union','instituto','defensayjusticia','gimnasiamendoza','clubatleticoplatense','centralcordobadesantiago','newellsoldboys','deportivoriestra'];
const ZONA_B = ['independienterivadavia','riverplate','argentinosjuniors','rosariocentral','belgrano','gimnasialp','huracan','racingclub','barracascentral','tigre','sarmiento','banfield','atleticotucuman','aldosivi','estudiantesderiocuarto'];
function nombreCorto(slug) {
  const c = (typeof CLUBES_CONFIG !== 'undefined') ? CLUBES_CONFIG[slug] : null;
  return (c && c.nombreCorto) || slug;
}

// Renderiza una grilla de equipos. Por defecto alfabético; si se pasa opts.posMap
// (slug -> posición en la tabla), ordena por posición (en tiempo real).
function renderGrid(slugs, containerId, opts) {
  opts = opts || {};
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  const pos = opts.posMap;
  const ordenados = slugs.slice().sort((a, b) => {
    if (pos && pos[a] && pos[b]) return pos[a].rank - pos[b].rank;
    return nombreCorto(a).localeCompare(nombreCorto(b), 'es');
  });
  ordenados.forEach(slug => {
    const nombre = nombreCorto(slug);
    const a = document.createElement('a');
    a.className = 'equipo-card' + (opts.cls ? ' ' + opts.cls : '');
    a.href = `club.html?c=${slug}${opts.hrefExtra || ''}`;
    const info = pos && pos[slug];
    const rank = info && info.rank;
    const pts  = info && info.pts;
    a.innerHTML =
      (rank ? `<span class="pos-badge">${rank}°</span>` : '') +
      (pts != null ? `<span class="pts-badge">${pts} Pts</span>` : '') +
      `<img class="escudo-img" src="escudos/${slug}.png" alt="${nombre}" onerror="this.style.opacity=0.3">` +
      `<div class="equipo-nombre">${nombre}</div>`;
    grid.appendChild(a);
  });
}

function cambiarVista(v) {
  const local = v === 'local';
  document.getElementById('vista-local').style.display = local ? '' : 'none';
  document.getElementById('vista-copas').style.display = local ? 'none' : '';
  document.getElementById('btn-local').classList.toggle('active', local);
  document.getElementById('btn-copas').classList.toggle('active', !local);
}

// ── COPAS: equipos en carrera con rival + resultado + ronda (desde copas.json) ──
function copaInfoEquipos(copa) {
  const info = {};
  (copa.partidos || []).forEach(p => {
    const arg = p.home.slug ? p.home : (p.away.slug ? p.away : null);
    if (!arg) return;
    const argIsHome = p.home.slug === arg.slug;
    const riv = argIsHome ? p.away : p.home;
    const it = info[arg.slug] || { rival: riv.name, resultados: [] };
    if (riv.name !== it.rival) { it.rival = riv.name; it.resultados = []; }
    if (p.ronda) it.ronda = p.ronda;
    if (p.home_score != null && p.away_score != null) {
      const gf = argIsHome ? p.home_score : p.away_score;
      const gc = argIsHome ? p.away_score : p.home_score;
      it.resultados.push(`${gf}-${gc}`);
    }
    info[arg.slug] = it;
  });
  return info;
}
function renderCopaGrid(copaObj, cls, gridId, rondaId) {
  copaObj = copaObj || {};
  // Con rondas solapadas (un club ya en la siguiente, otro debiendo la revancha
  // de la anterior) el header no puede nombrar una sola: queda vacío y cada
  // card muestra la ronda de SU serie.
  const rondas = [...new Set((copaObj.partidos || []).map(p => p.ronda || copaObj.ronda).filter(Boolean))];
  const mixtas = rondas.length > 1;
  document.getElementById(rondaId).textContent = mixtas ? '' : (copaObj.ronda || '');
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  const slugs = [...new Set((copaObj.partidos || []).map(p => p.home.slug || p.away.slug).filter(Boolean))];
  if (!slugs.length) { grid.innerHTML = '<div class="copa-empty">Sin equipos en carrera</div>'; return; }
  const info = copaInfoEquipos(copaObj);
  slugs.sort((a, b) => nombreCorto(a).localeCompare(nombreCorto(b), 'es')).forEach(slug => {
    const nombre = nombreCorto(slug);
    const i = info[slug] || {};
    const ronda = (mixtas && (i.ronda || copaObj.ronda)) ? `<div class="copa-ronda-mini">${i.ronda || copaObj.ronda}</div>` : '';
    const rival = i.rival ? `<div class="copa-rival">vs ${i.rival}</div>` : '';
    const res = (i.resultados && i.resultados.length) ? `<div class="copa-result">${i.resultados.join('  ·  ')}</div>` : '';
    const a = document.createElement('a');
    a.className = `copa-card ${cls}`;
    a.href = `club.html?c=${slug}&copa=${cls === 'lib' ? 'libertadores' : 'sudamericana'}`;
    a.innerHTML =
      `<img class="escudo-img" src="escudos/${slug}.png" alt="${nombre}" onerror="this.style.opacity=0.3">` +
      `<div class="equipo-nombre">${nombre}</div>${ronda}${rival}${res}`;
    grid.appendChild(a);
  });
}

// Render inicial (alfabético hasta que lleguen las posiciones)
renderGrid(ZONA_A, 'zonaA-grid');
renderGrid(ZONA_B, 'zonaB-grid');
(async () => {
  let copas = {};
  try { copas = await (await fetch(`data/fixtures/copas.json?t=${Date.now()}`)).json(); } catch (e) {}
  renderCopaGrid(copas.libertadores, 'lib', 'lib-grid', 'lib-ronda');

// ── EN JUEGO: partidos en curso (liga + copas), poll de 60s a live=all ──
// Se matchea live=all contra los api_id de liga.json/copas.json: así solo
// aparecen NUESTROS partidos (live=all trae todas las ligas del mundo) y de paso

(async () => {

  let fichaTab = 'cancha';                    // 'cancha' | 'stats' (persiste entre partidos)

    ? nombreCorto(slug) : (nombre || slug);

    if (!fichaData) { fichaEl.innerHTML = '<div class="live-ficha-loading">Sin datos del partido todavía</div>'; return; }
    const cuerpo = fichaTab === 'stats'
      ? fcStatsHTML(fichaData, { nomFn: fcNom })
      : (fcCanchaHTML(fichaData, { nomFn: fcNom, layout: 'horizontal' })

         <button class="live-ficha-tab${fichaTab === 'cancha' ? ' active' : ''}" data-tab="cancha">Formaciones</button>
         <button class="live-ficha-tab${fichaTab === 'stats' ? ' active' : ''}" data-tab="stats">Estadísticas</button>
       </div>${cuerpo}`;
    fichaEl.querySelectorAll('.live-ficha-tab').forEach(b =>
      b.addEventListener('click', () => { fichaTab = b.dataset.tab; pintarFicha(); }));
  }
  async function cargarFicha(fid, silencioso) {
    if (!silencioso) fichaEl.innerHTML = '<div class="live-ficha-loading">Cargando…</div>';
    let built = null;
    try { built = await buildPayloadLive(fid); } catch (e) {}
    if (fichaOpen !== fid) return;            // se cerró/cambió mientras cargaba
    fichaData = built ? built.data : null;
    pintarFicha();
  }
  function toggleFicha(fid) {
    if (fichaOpen === fid) { fichaOpen = null; fichaData = null; fichaEl.hidden = true; fichaEl.innerHTML = ''; }
    else { fichaOpen = fid; fichaData = null; fichaEl.hidden = false; cargarFicha(fid, false); }

  }

  const MATCHES = {};
  try {
    const [liga, copas] = await Promise.all([
      fetch(`data/fixtures/liga.json?t=${Date.now()}`).then(r => r.ok ? r.json() : []).catch(() => []),
      fetch(`data/fixtures/copas.json?t=${Date.now()}`).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    (liga || []).forEach(p => {
      if (!p.api_id) return;
      MATCHES[String(p.api_id)] = {
        etiqueta: p.fecha ? `Fecha ${p.fecha}` : 'Liga', href: 'fixture.html',
        home: { slug: p.home.slug, name: p.home.name }, away: { slug: p.away.slug, name: p.away.name },
      };
    });
    [['libertadores', 'Libertadores'], ['sudamericana', 'Sudamericana']].forEach(([key, lbl]) => {
      ((((copas || {})[key]) || {}).partidos || []).forEach(p => {
        if (!p.api_id) return;
        MATCHES[String(p.api_id)] = {
          etiqueta: lbl, href: `fixture.html?copa=${key}`,
          cls: key === 'sudamericana' ? 'sud' : '',
          home: { slug: p.home.slug, name: p.home.name, logo: p.home.logo },
          away: { slug: p.away.slug, name: p.away.name, logo: p.away.logo },
        };
      });
    });
  } catch (e) {}
  if (!Object.keys(MATCHES).length) return;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const escudo = t => {
    if (t.slug) return `<img src="escudos/${t.slug}.png" alt="" onerror="this.style.opacity=0.2">`;
    const ini = (t.name || '').split(/\s+/).map(w => w[0] || '').join('').slice(0, 3).toUpperCase();
    if (t.logo) return `<img src="${esc(t.logo)}" alt="" onerror="this.outerHTML='<span class=&quot;escudo-ini&quot;>${esc(ini)}</span>'">`;
    return `<span class="escudo-ini">${esc(ini)}</span>`;
  };
  const nom = t => t.slug ? nombreCorto(t.slug) : (t.name || '');
  const minTxt = st => st.short === 'HT' ? 'ET' : (st.short === 'SUSP' ? 'SUSP' : (st.elapsed != null ? `${st.elapsed}'` : 'VIVO'));

  async function pollLive() {
    let vivos = [];
    try {
      const res = await fetch('/api/apisports/fixtures?live=all', { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        vivos = (data.response || []).filter(r => MATCHES[String(r.fixture.id)]);
      }
    } catch (e) {}
    if (!vivos.length) { strip.style.display = 'none'; return; }
    // Goleadores por lado, de los events que live=all trae en cada fixture.
    // "J. Álvarez 15'" + apóstrofe del minuto; gol en contra marcado (e/c) y
    // penal (p). Si la API no manda events (a veces tarda), no se muestra nada.
    const golesDe = (r, teamId) => (r.events || [])
      .filter(ev => ev.type === 'Goal' && ev.detail !== 'Missed Penalty'
                    && ev.team && ev.team.id === teamId && ev.player && ev.player.name)

        return `<div class="gol">⚽ ${esc(ev.player.name)}${sufijo} ${esc(min)}</div>`;
      }).join('');
    cardsEl.innerHTML = vivos.map(r => {
      const m = MATCHES[String(r.fixture.id)];
      const gH = golesDe(r, r.teams && r.teams.home && r.teams.home.id);
      const gA = golesDe(r, r.teams && r.teams.away && r.teams.away.id);
      const goles = (gH || gA)
        ? `<div class="live-card-goles"><div>${gH}</div><div class="gol-away">${gA}</div></div>` : '';
      const fid = String(r.fixture.id);
      return `<div class="live-card${m.cls ? ' ' + m.cls : ''}${fid === fichaOpen ? ' open' : ''}" data-fid="${fid}" role="button" tabindex="0" aria-label="Ver formaciones">
        <div class="live-card-meta"><span>${esc(m.etiqueta)}</span><span class="live-card-min">● ${esc(minTxt(r.fixture.status))}</span></div>
        <div class="live-card-fila">
          <div class="live-card-lado">${escudo(m.home)}<span class="nom">${esc(nom(m.home))}</span></div>
          <div class="live-card-score">${r.goals.home ?? 0} - ${r.goals.away ?? 0}</div>
          <div class="live-card-lado away"><span class="nom">${esc(nom(m.away))}</span>${escudo(m.away)}</div>
        </div>
        ${goles}
        <div class="live-card-toggle">▾</div>
      </div>`;
    }).join('');
    // Toda la card despliega/cierra las formaciones (ya no linkea al fixture:
    // era redundante teniendo la ficha acá mismo).
    cardsEl.querySelectorAll('.live-card').forEach(card =>
      card.addEventListener('click', () => toggleFicha(card.dataset.fid)));
    // Ficha abierta: refrescarla con el poll (cambios/goles entran solos); si el
    // partido salió de la tira, se cierra.
    if (fichaOpen) {
      if (vivos.some(r => String(r.fixture.id) === fichaOpen)) cargarFicha(fichaOpen, true);
      else toggleFicha(fichaOpen);
    }
    strip.style.display = '';
  }
  const tick = () => { if (!document.hidden) pollLive(); };
  tick();
  setInterval(tick, 60000);
})();

// ── Ordenar cada zona por su posición en la tabla, en tiempo real ──
// Standings del torneo en curso vía el proxy api-sports (solo prod). Si falla
// (ej. local sin proxy) se mantiene el orden alfabético.
const _LEAGUE = 128;
// Prototipo de tablas por zona: ?v=1 (a los costados) o ?v=2 (abajo). Sin parámetro = home de siempre.
const TZ_PLAYOFFS = 8;   // los 8 primeros de cada zona clasifican (igual que tablas.html)
let _tzZonas = null;
function _slugDeId(id) { return (typeof ESCUDO_MAP !== 'undefined' && ESCUDO_MAP[id]) || null; }
function _parseGrupo(name) {
  const low = (name || '').toLowerCase();
  const tm = low.match(/apertura|clausura/);
  let z = null;
  if (/(group|zona|grupo)\s*b\b/.test(low)) z = 'B';
  else if (/(group|zona|grupo)\s*a\b/.test(low)) z = 'A';
  return { tour: tm ? tm[0] : '', zona: z };
}
async function fetchPosiciones() {
  try {
    const res = await fetch(`/api/apisports/standings?league=${_LEAGUE}&season=2026`, { cache: 'no-store' });
    if (!res.ok) return null;
    const json = await res.json();
    const resp = json.response && json.response[0];
    let groups = (resp && resp.league && resp.league.standings) || [];
    if (!groups.length) return null;
    // /standings se actualiza con lag (tras IndRiv-Racing F7 seguía dando la
    // tabla vieja): se completa con los FT que ya están en liga.json.
    if (typeof sfCorregirConLiga === 'function') groups = await sfCorregirConLiga(groups);
    const parsed = groups.map(g => ({ meta: _parseGrupo(g[0] && g[0].group), teams: g }));
    const tours = [];
    parsed.forEach(x => { if (x.meta.tour && !tours.includes(x.meta.tour)) tours.push(x.meta.tour); });
    const current = tours[tours.length - 1] || '';
    const cur = current ? parsed.filter(x => x.meta.tour === current) : parsed;
    const zA = (cur.find(x => x.meta.zona === 'A') || cur[0] || {}).teams || [];
    const zB = (cur.find(x => x.meta.zona === 'B') || cur[1] || {}).teams || [];
    const map = {};
    const add = teams => teams.forEach((t, i) => {
      const s = _slugDeId(t.team.id);
      if (s) map[s] = { rank: t.rank || (i + 1), pts: t.points != null ? t.points : null };
    });
    add(zA); add(zB);
    _tzZonas = { A: zA, B: zB };
    return Object.keys(map).length ? map : null;
  } catch (e) { return null; }
}
function renderTablaZona(letra, teams) {
  const cont = document.getElementById('tabla-' + letra);

  cont.style.setProperty('--tz-cols', '22px 22px 1fr 26px 30px 32px');
  let html = '<div class="tz-wrap"><div class="tz-row tz-head"><div class="r">#</div><div></div><div>Equipo</div>' +
    '<div class="n">PJ</div><div class="n">DG</div><div class="p">Pts</div></div>';
  teams.forEach((t, i) => {
    if (i === TZ_PLAYOFFS) html += '<div class="tz-corte"><span>Corte de playoffs</span></div>';
    const slug = _slugDeId(t.team.id);

    const nombre = slug ? nombreCorto(slug) : t.team.name;
    html += `<div class="tz-row ${i < TZ_PLAYOFFS ? 'dentro' : 'fuera'}">` +
      `<div class="tz-rank">${t.rank || (i + 1)}</div>` +
      `<div class="tz-esc">${slug ? `<img src="escudos/${slug}.png" alt="">` : ''}</div>` +

      `<div class="tz-pts">${t.points != null ? t.points : 0}</div></div>`;

  html += '</div>';
  cont.innerHTML = html;
}
// ── Cuadro de playoffs: pronóstico del hincha ──
// Formato del torneo (el mismo del Apertura 2026, reconstruido de api-sports):
// octavos 1A-8B, 4B-5A, 2B-7A, 3A-6B | 1B-8A, 4A-5B, 2A-7B, 3B-6A. Cada par
// adyacente se cruza en cuartos y las dos llaves de cada mitad, en semis.
// Arranca con los 8 primeros de cada zona; el hincha elige quién pasa (tocando
// el equipo) y puede cambiar cualquier equipo del cuadro (✎). Se guarda en el
// dispositivo (localStorage) como cambios sobre la tabla: si la tabla se mueve,
// el cuadro se rearma y los pronósticos que ya no aplican se caen solos.
const PL_OCTAVOS = { o1: ['A1', 'B8'], o2: ['B4', 'A5'], o3: ['B2', 'A7'], o4: ['A3', 'B6'],
                     o5: ['B1', 'A8'], o6: ['A4', 'B5'], o7: ['A2', 'B7'], o8: ['B3', 'A6'] };
const PL_HIJOS = { q1: ['o1', 'o2'], q2: ['o3', 'o4'], q3: ['o5', 'o6'], q4: ['o7', 'o8'],
                   s1: ['q1', 'q2'], s2: ['q3', 'q4'], f: ['s1', 's2'] };
const PL_SEEDS = Object.values(PL_OCTAVOS).flat();
const PL_KEY = 'tribunapp_playoffs_v1';
let _plBase = null, _plFirma = '';

try {
  const g = JSON.parse(localStorage.getItem(PL_KEY) || 'null');

} catch (e) {}
function _plGuardar() { try { localStorage.setItem(PL_KEY, JSON.stringify(_plSt)); } catch (e) {} }
function _plSeed(k) { return _plSt.ov[k] || (_plBase && _plBase[k]) || null; }
function _plEquipos(m) {

function _plGanador(m) {

}

  const cls = (g ? (g.slug === e.slug ? ' gana' : ' pierde') : '') + (_plSt.ov[e.seed] ? ' mod' : '');
  const edit = PL_OCTAVOS[m] ? `<button class="pl-edit" data-seed="${e.seed}" title="Cambiar equipo" aria-label="Cambiar equipo">✎</button>` : '';
  return `<div class="pl-eq${cls}" data-m="${m}" data-slug="${e.slug}">` +
    `<span class="pl-seed">${e.seed[1]}${e.seed[0]}</span><img src="escudos/${e.slug}.png" alt="">` +
    `<span class="pl-nom">${nombreCorto(e.slug)}</span>${edit}</div>`;
}
function _plPartido(m) {

}
function _plCampeon() {

// Silueta del trofeo de la Liga Profesional (pelota arriba, cuello con aros,

    `<path d="M44 51 C36 53 32 58 32 67 C32 93 44 122 52 142 L48 151 H72 L68 142 C76 122 88 93 88 67 C88 58 84 53 76 51 Z"/>` +
    `<path d="M50 131 C27 120 7 101 8 72 C8.5 55 12 45 17 36 C15.5 47 13.5 58 13.5 72 C13.5 97 31 114 51 122 Z"/><path d="M 70 131 C 93 120 113 101 112 72 C 111.5 55 108 45 103 36 C 104.5 47 106.5 58 106.5 72 C 106.5 97 89 114 69 122 Z"/>` +

function plActualizar(zonas) {

document.getElementById('pl-modal-cerrar').addEventListener('click', plCerrarModal);
document.getElementById('pl-modal').addEventListener('click', ev => { if (ev.target.id === 'pl-modal') plCerrarModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !document.getElementById('pl-modal').hidden) plCerrarModal(); });
document.getElementById('pl-reset').addEventListener('click', () => {
  _plSt = { ov: {}, picks: {} }; _plGuardar(); plRender();
});

async function actualizarPosiciones() {
  const pos = await fetchPosiciones();
  if (pos) {
    renderGrid(ZONA_A, 'zonaA-grid', { posMap: pos });
    renderGrid(ZONA_B, 'zonaB-grid', { posMap: pos });
    if (_tzZonas) { renderTablaZona('A', _tzZonas.A); renderTablaZona('B', _tzZonas.B); plActualizar(_tzZonas); }
  }
}
actualizarPosiciones();
setInterval(actualizarPosiciones, 60000);   // refresco en vivo cada 60s
document.getElementById('loading-state').style.display = 'none';
document.getElementById('contenido').style.display = '';
</script>
<script src="js/ui-help.js"></script>
