<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TribunApp — Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark:  #0d0d1a;
  --dark2: #13131f;
  --dark3: #1a1a2e;
  --acento: #1565c0;
  --acento-light: #42a5f5;
  --gold: #f5c518;
  --rojo: #e53935;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

/* ===== HEADER ===== */
#site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px 10px;
  background: linear-gradient(180deg, rgba(21,101,192,0.15) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
  gap: 12px;
}
.logo-wrap {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.logo-titulo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 3px; color: #fff; line-height: 1;
}
.logo-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 3px;
  color: var(--acento-light); text-transform: uppercase;
}
.header-trophy { font-size: 28px; line-height: 1; }

.header-actions { display: flex; gap: 8px; align-items: center; }
.header-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 6px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.55);
  cursor: pointer; text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.header-pill:hover {
  background: rgba(21,101,192,0.18); border-color: rgba(21,101,192,0.4); color: #fff;
}
.header-pill-label { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; color: #fff; }
@media (max-width: 500px) {
  .header-pill-label { display: none; }
  .header-pill { padding: 6px 10px; gap: 0; }
  .header-actions { gap: 6px; }
}

/* ===== MAIN ===== */
#main { padding: 28px 16px 60px; max-width: 1100px; margin: 0 auto; }

/* ===== HERO FASE ===== */
.fase-banner {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, rgba(21,101,192,0.15) 0%, rgba(13,13,26,0) 100%);
  border: 1px solid rgba(21,101,192,0.25);
  border-radius: 14px; padding: 12px 24px; margin-bottom: 28px;
  text-align: center;
}
.fase-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 3px; color: var(--acento-light);
  text-transform: uppercase;
}
.fase-nombre {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 4px; color: #fff; line-height: 1;
}

/* ===== GRILLA DE GRUPOS ===== */
.grupos-wrap {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
@media (max-width: 960px) { .grupos-wrap { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 660px) { .grupos-wrap { grid-template-columns: repeat(2, 1fr); } }

/* ===== CARD DE GRUPO ===== */
.grupo-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.grupo-card:hover {
  border-color: rgba(21,101,192,0.3);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.grupo-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px 9px;
  background: linear-gradient(135deg, rgba(21,101,192,0.18) 0%, rgba(21,101,192,0.06) 100%);
  border-bottom: 1px solid rgba(21,101,192,0.2);
}
.grupo-letra {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 2px; color: var(--acento-light);
  line-height: 1;
}
.grupo-titulo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 2.5px;
  color: rgba(255,255,255,0.3); text-transform: uppercase;
}

/* ===== EQUIPOS DENTRO DEL GRUPO ===== */
.grupo-equipos { padding: 8px; display: flex; flex-direction: column; gap: 3px; }

.equipo-row {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 10px;
  border-radius: 10px;
  border-left: 2px solid transparent;
  cursor: pointer; text-decoration: none;
  transition: background 0.18s, transform 0.15s, border-color 0.18s;
  position: relative;
  overflow: hidden;
}
.equipo-row:hover {
  background: rgba(21,101,192,0.14);
  border-left-color: rgba(21,101,192,0.5);
  transform: translateX(3px);
}

/* Estado eliminado */
.equipo-row.eliminado {
  opacity: 0.28;
  filter: grayscale(100%);
  pointer-events: none;
  cursor: default;
}
.equipo-row.eliminado .flag-img {
  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5)) grayscale(1);
}
.equipo-row.eliminado::after {
  content: '✕';
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--rojo); opacity: 0.8;
}

/* Clasificado a siguiente ronda */
.equipo-row.clasificado {
  border-left-color: rgba(42,213,114,0.6);
  background: rgba(42,213,114,0.04);
}

.flag-wrap {
  width: 40px; height: 40px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.flag-img {
  width: 38px; height: 38px; object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  border-radius: 50%;
}
.equipo-nombre {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
  color: rgba(255,255,255,0.88);
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tiene-stats .equipo-nombre { font-size: 13px; }
.equipo-stats {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.stat-pj {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; color: rgba(255,255,255,0.25);
  letter-spacing: 0.5px;
}
.stat-pts {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 17px; line-height: 1;
  color: rgba(255,255,255,0.7);
  min-width: 18px; text-align: right;
}
.stat-pts.lider  { color: #2ad572; }
.stat-pts.segundo { color: var(--acento-light); }

.pos-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px; line-height: 1;
  color: rgba(255,255,255,0.18);
  width: 12px; text-align: center; flex-shrink: 0;
}
.pos-num.top { color: rgba(42,213,114,0.6); }

/* ===== LOADING ===== */
.loading-msg {
  text-align: center; padding: 80px 20px;
  color: rgba(255,255,255,0.25);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; letter-spacing: 3px;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--acento);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== FOOTER ===== */
#site-footer {
  text-align: center; padding: 20px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
  letter-spacing: 1px; color: rgba(255,255,255,0.15);
  border-top: 1px solid rgba(255,255,255,0.05);
  margin-top: 20px;
}
</style>
</head>
<body>

<!-- HEADER -->
<header id="site-header">
  <a class="logo-wrap" href="index.html">
    <img src="Logo.png" alt="TribunApp" style="height:72px;object-fit:contain;">
    <div class="logo-sub" style="margin-left:4px;color:#f5c518;">Mundial 2026</div>
  </a>

  <div class="header-actions">
    <a class="header-pill" href="estadisticas-tribunapp.html">
      <span>📣</span>
      <span class="header-pill-label">Est. TribunApp</span>
    </a>
    <a class="header-pill" href="estadisticas-torneo.html">
      <span>📊</span>
      <span class="header-pill-label">Estadísticas</span>
    </a>
    <a class="header-pill" href="fixture.html">
      <span>📅</span>
      <span class="header-pill-label">Fixture</span>
    </a>
  </div>
</header>

<!-- MAIN -->
<main id="main">
  <div id="loading-state">
    <div class="loading-spinner"></div>
    <div class="loading-msg">CARGANDO...</div>
  </div>
  <div id="contenido" style="display:none;">
    <!-- fase banner -->
    <div class="fase-banner" id="fase-banner">
      <div class="fase-nombre" id="fase-nombre">FASE DE GRUPOS</div>
    </div>
    <!-- grupos -->
    <div class="grupos-wrap" id="grupos-wrap"></div>
  </div>
</main>

<footer id="site-footer">TribunApp · Mundial 2026</footer>

<script>
const GRUPOS_LETRAS = ['A','B','C','D','E','F','G','H','I','J','K','L'];

const NOMBRES_ES = {
  czechia:              'Chequia',
  mexico:               'México',
  southafrica:          'Sudáfrica',
  southkorea:           'Corea del Sur',
  bosniaandherzegovina: 'Bosnia y Herzegovina',
  canada:               'Canadá',
  qatar:                'Qatar',
  switzerland:          'Suiza',
  brazil:               'Brasil',
  haiti:                'Haití',
  morocco:              'Marruecos',
  scotland:             'Escocia',
  australia:            'Australia',
  paraguay:             'Paraguay',
  turkiye:              'Turquía',
  usa:                  'Estados Unidos',
  curacao:              'Curazao',
  ecuador:              'Ecuador',
  germany:              'Alemania',
  ivorycoast:           'Costa de Marfil',
  japan:                'Japón',
  netherlands:          'Países Bajos',
  sweden:               'Suecia',
  tunisia:              'Túnez',
  belgium:              'Bélgica',
  egypt:                'Egipto',
  iran:                 'Irán',
  newzealand:           'Nueva Zelanda',
  capeverde:            'Cabo Verde',
  saudiarabia:          'Arabia Saudita',
  spain:                'España',
  uruguay:              'Uruguay',
  france:               'Francia',
  iraq:                 'Irak',
  norway:               'Noruega',
  senegal:              'Senegal',
  algeria:              'Argelia',
  argentina:            'Argentina',
  austria:              'Austria',
  jordan:               'Jordania',
  colombia:             'Colombia',
  drcongo:              'Rep. D. del Congo',
  portugal:             'Portugal',
  uzbekistan:           'Uzbekistán',
  croatia:              'Croacia',
  england:              'Inglaterra',
  ghana:                'Ghana',
  panama:               'Panamá',
};

const FASE_NOMBRES = {
  grupos: 'FASE DE GRUPOS',
  octavos: 'OCTAVOS DE FINAL',
  cuartos: 'CUARTOS DE FINAL',
  semis: 'SEMIFINALES',
  final: 'LA GRAN FINAL',
};

async function cargar() {
  try {
    const ts = Date.now();
    const [resEquipos, resEstado] = await Promise.all([
      fetch(`data/equipos.json?t=${ts}`),
      fetch(`data/estado_torneo.json?t=${ts}`),
    ]);
    const equipos = await resEquipos.json();
    const estado  = await resEstado.json();

    renderFase(estado);
    renderGrupos(equipos, estado);

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('contenido').style.display = '';
  } catch(e) {
    document.getElementById('loading-state').innerHTML =
      `<div class="loading-msg">Error cargando datos: ${e.message}</div>`;
  }
}

function renderFase(estado) {
  const nombre = FASE_NOMBRES[estado.fase] || estado.fase.toUpperCase();
  document.getElementById('fase-nombre').textContent = nombre;
  // Ocultar banner de grupos en fases eliminatorias
  if (estado.fase !== 'grupos') {
    document.getElementById('fase-banner').style.borderColor = 'rgba(245,197,24,0.3)';
    document.getElementById('fase-banner').style.background =
      'linear-gradient(135deg, rgba(245,197,24,0.08) 0%, transparent 100%)';
  }
}

function renderGrupos(equipos, estado) {
  const eliminados  = new Set((estado.eliminados || []).map(s => s.toLowerCase()));
  const clasificados = new Set((estado.clasificados || []).map(s => s.toLowerCase()));

  // Agrupar por letra
  const porGrupo = {};
  for (const eq of equipos) {
    if (!porGrupo[eq.grupo]) porGrupo[eq.grupo] = [];
    porGrupo[eq.grupo].push(eq);
  }

  const wrap = document.getElementById('grupos-wrap');
  wrap.innerHTML = '';

  for (const letra of GRUPOS_LETRAS) {
    const equiposGrupo = porGrupo[letra];
    if (!equiposGrupo) continue;

    const card = document.createElement('div');
    card.className = 'grupo-card';
    card.innerHTML = `
      <div class="grupo-header">
        <div class="grupo-letra">${letra}</div>
        <div class="grupo-titulo">Grupo ${letra}</div>
      </div>
      <div class="grupo-equipos" id="grupo-${letra}"></div>
    `;
    wrap.appendChild(card);

    const contenedor = card.querySelector(`#grupo-${letra}`);

    // Obtener tabla del grupo (si existe) y ordenar por ella
    const tablaGrupo = (estado.tablas || {})[letra];
    let equiposOrdenados = [...equiposGrupo];
    if (tablaGrupo) {
      const orden = {};
      tablaGrupo.forEach((t, i) => { orden[t.slug] = i; });
      equiposOrdenados.sort((a, b) => {
        const ia = orden[a.slug] ?? 99;
        const ib = orden[b.slug] ?? 99;
        return ia - ib;
      });
    }

    equiposOrdenados.forEach((eq, idx) => {
      const esEliminado   = eliminados.has(eq.slug);
      const esClasificado = clasificados.has(eq.slug);
      const statsEquipo   = tablaGrupo?.find(t => t.slug === eq.slug);
      const pos = idx + 1;
      const esTop = pos <= 2;

      const clases = ['equipo-row',
        esEliminado   ? 'eliminado'    : '',
        esClasificado ? 'clasificado'  : '',
        statsEquipo   ? 'tiene-stats'  : '',
      ].filter(Boolean).join(' ');

      const row = document.createElement('a');
      row.className = clases;
      row.href = esEliminado ? '#' : `equipo.html?c=${eq.slug}`;
      const nombreEs = NOMBRES_ES[eq.slug] || eq.nombre;

      let statsHTML = '';
      if (statsEquipo) {
        const dg = statsEquipo.dg ?? (statsEquipo.gf - statsEquipo.gc);
        const dgStr = dg > 0 ? `+${dg}` : `${dg}`;
        const ptsClass = pos === 1 ? 'stat-pts lider' : pos === 2 ? 'stat-pts segundo' : 'stat-pts';
        statsHTML = `
          <div class="equipo-stats">
            <span class="stat-pj" title="Partidos jugados">${statsEquipo.pj ?? 0}</span>
            <span class="stat-dg" title="Diferencia de goles">${dgStr}</span>
            <span class="${ptsClass}" title="Puntos">${statsEquipo.pts ?? 0}</span>
          </div>`;
      }

      row.innerHTML = `
        <span class="pos-num ${esTop ? 'top' : ''}">${pos}</span>
        <div class="flag-wrap">
          <img class="flag-img"
               src="escudos/${eq.slug}.png"
               alt="${nombreEs}"
               onerror="this.style.opacity='0.2'">
        </div>
        <span class="equipo-nombre">${nombreEs}</span>
        ${statsHTML}
      `;
      contenedor.appendChild(row);
    });
  }
}

cargar();
</script>
</body>
</html>
