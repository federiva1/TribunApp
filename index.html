<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TribunApp — Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --dark:  #0d0d1a;
  --dark2: #13131f;
  --dark3: #1a1a2e;
  --acento: #1565c0;
  --acento-light: #42a5f5;
  --gold: #f5c518;
  --rojo: #e53935;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }

/* ===== HEADER ===== */
#site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px 10px;
  background: linear-gradient(180deg, rgba(21,101,192,0.15) 0%, transparent 100%);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
  gap: 12px;
}
.logo-wrap {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.logo-titulo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 3px; color: #fff; line-height: 1;
}
.logo-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 3px;
  color: var(--acento-light); text-transform: uppercase;
}
.header-trophy { font-size: 28px; line-height: 1; }

/* Chip del torneo junto al logo */
.header-chip {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--gold);
  background: rgba(245,197,24,0.12);
  border: 1px solid rgba(245,197,24,0.3);
  border-radius: 6px; padding: 3px 8px;
}

.header-actions { display: flex; gap: 8px; align-items: center; }
.header-pill {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 7px 13px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; letter-spacing: 0.5px; color: rgba(255,255,255,0.85);
  cursor: pointer; text-decoration: none;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.header-pill svg { width: 15px; height: 15px; flex-shrink: 0; }
.header-pill:hover {
  background: rgba(21,101,192,0.18); border-color: rgba(21,101,192,0.45); color: #fff;
}
/* Fixture = acción principal */
.header-pill.primary {
  background: rgba(21,101,192,0.18); border-color: rgba(21,101,192,0.45); color: #fff;
}
.header-pill.primary:hover { background: rgba(21,101,192,0.3); }
.header-pill-label { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.5px; }
@media (max-width: 560px) {
  .header-pill-label { display: none; }
  .header-pill { width: 36px; height: 36px; padding: 0; gap: 0; justify-content: center; }
  .header-actions { gap: 6px; }
}
@media (max-width: 430px) {
  .header-chip { display: none; }
}

/* ===== MAIN ===== */
#main { padding: 28px 16px 60px; max-width: 1100px; margin: 0 auto; }

/* ===== HERO FASE ===== */
.fase-banner {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, rgba(21,101,192,0.15) 0%, rgba(13,13,26,0) 100%);
  border: 1px solid rgba(21,101,192,0.25);
  border-radius: 14px; padding: 12px 24px; margin-bottom: 28px;
  text-align: center;
}
.fase-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 3px; color: var(--acento-light);
  text-transform: uppercase;
}
.fase-nombre {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 4px; color: #fff; line-height: 1;
}

/* ===== GRILLA DE GRUPOS ===== */
.grupos-wrap {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
@media (max-width: 960px) { .grupos-wrap { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 660px) { .grupos-wrap { grid-template-columns: repeat(2, 1fr); } }

/* ===== CARD DE GRUPO ===== */
.grupo-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.grupo-card:hover {
  border-color: rgba(21,101,192,0.3);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.grupo-header {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px 9px;
  background: linear-gradient(135deg, rgba(21,101,192,0.18) 0%, rgba(21,101,192,0.06) 100%);
  border-bottom: 1px solid rgba(21,101,192,0.2);
}
.grupo-letra {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 2px; color: var(--acento-light);
  line-height: 1;
}
.grupo-titulo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 2.5px;
  color: rgba(255,255,255,0.3); text-transform: uppercase;
}

/* ===== EQUIPOS DENTRO DEL GRUPO ===== */
.grupo-equipos { padding: 8px; display: flex; flex-direction: column; gap: 3px; }

.equipo-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  border-left: 2px solid transparent;
  cursor: pointer; text-decoration: none;
  transition: background 0.18s, transform 0.15s, border-color 0.18s;
  position: relative;
  overflow: hidden;
}
.equipo-row:hover {
  background: rgba(21,101,192,0.14);
  border-left-color: rgba(21,101,192,0.5);
  transform: translateX(3px);
}

/* Estado eliminado */
.equipo-row.eliminado {
  opacity: 0.28;
  filter: grayscale(100%);
  pointer-events: none;
  cursor: default;
}
.equipo-row.eliminado .flag-img {
  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5)) grayscale(1);
}
.equipo-row.eliminado::after {
  content: '✕';
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--rojo); opacity: 0.8;
}

/* Clasificado a siguiente ronda */
.equipo-row.clasificado {
  border-left-color: rgba(42,213,114,0.6);
  background: rgba(42,213,114,0.04);
}

.flag-wrap {
  width: 32px; height: 32px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.flag-img {
  width: 30px; height: 30px; object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  border-radius: 50%;
}
.equipo-nombre {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
  color: rgba(255,255,255,0.88);
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tiene-stats .equipo-nombre { font-size: 13px; }
.equipo-stats {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.stat-pj {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; color: rgba(255,255,255,0.25);
  letter-spacing: 0.5px;
}
.stat-pts {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 17px; line-height: 1;
  color: rgba(255,255,255,0.7);
  min-width: 18px; text-align: right;
}
.stat-pts.lider  { color: #2ad572; }
.stat-pts.segundo { color: var(--acento-light); }

/* Columnas de stats alineadas con separadores (PTS / DIF GOL) */
.equipo-stats { gap: 0; align-self: stretch; align-items: stretch; }
.stat-pts, .stat-dg {
  display: flex; align-items: center; justify-content: center;
  border-left: 1px solid rgba(255,255,255,0.1);
}
.stat-pts { width: 32px; text-align: center; }
.stat-dg {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.4);
  width: 38px; text-align: center;
}
.stat-dg.pos { color: rgba(42,213,114,0.7); }
.stat-dg.neg { color: rgba(229,57,53,0.7); }

/* Encabezado de columnas dentro del grupo */
.grupo-colhead {
  display: flex; align-items: stretch; justify-content: flex-end;
  gap: 0; padding: 5px 18px 5px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.grupo-colhead span {
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.3); text-align: center;
  border-left: 1px solid rgba(255,255,255,0.1);
}
.grupo-colhead .col-pts { width: 32px; }
.grupo-colhead .col-dg  { width: 38px; }

.pos-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px; line-height: 1;
  color: rgba(255,255,255,0.18);
  width: 12px; text-align: center; flex-shrink: 0;
}
.pos-num.top { color: rgba(42,213,114,0.6); }

/* ===== LOADING ===== */
.loading-msg {
  text-align: center; padding: 80px 20px;
  color: rgba(255,255,255,0.25);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; letter-spacing: 3px;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--acento);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== FOOTER ===== */
#site-footer {
  text-align: center; padding: 20px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
  letter-spacing: 1px; color: rgba(255,255,255,0.15);
  border-top: 1px solid rgba(255,255,255,0.05);
  margin-top: 20px;
}
/* BOTÓN JUGAR */
.header-pill-jugar {
  background:linear-gradient(135deg,#1565c0,#0d47a1);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;cursor:pointer;
}
.header-pill-jugar:hover { background:linear-gradient(135deg,#1976d2,#1565c0); }

/* MODAL EQUIPOS */
#modal-equipos {
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:70px;
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0}to{opacity:1}}
.modal-box {
  background:#13131f;border:1px solid rgba(255,255,255,.1);
  border-radius:14px;width:100%;max-width:420px;
  max-height:75vh;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.modal-header {
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 10px;flex-shrink:0;
}
.modal-title {
  font-family:'Bebas Neue',sans-serif;font-size:18px;
  letter-spacing:1.5px;color:#fff;
}
.modal-close {
  background:none;border:none;color:rgba(255,255,255,.4);
  font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;
}
.modal-close:hover{color:#fff;}
.modal-search-wrap {
  position:relative;padding:0 14px 12px;flex-shrink:0;
}
.modal-search-input {
  width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);border-radius:8px;
  padding:9px 12px 9px 34px;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;
  color:#fff;outline:none;
}
.modal-search-input:focus{border-color:rgba(21,101,192,.5);}
.modal-search-icon{position:absolute;left:26px;top:50%;transform:translateY(-60%);opacity:.4;font-size:13px;}
#modal-lista { overflow-y:auto;flex:1; }
.modal-row {
  display:flex;align-items:center;gap:12px;
  padding:11px 18px;text-decoration:none;color:#fff;
  border-top:1px solid rgba(255,255,255,.05);
  transition:background .15s;
}
.modal-row:hover { background:rgba(255,255,255,.06); }
.modal-row img { width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0; }
.modal-row-nombre { font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;flex:1; }
.modal-row-arrow { color:rgba(255,255,255,.3);font-size:18px; }

/* ONBOARDING */
#ob-tip {
  display:none;position:fixed;top:88px;left:50%;transform:translateX(-50%);
  z-index:200;white-space:nowrap;
  background:rgba(21,101,192,.92);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.2);border-radius:20px;
  padding:8px 18px;gap:8px;align-items:center;
  font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;color:#fff;
  animation:obTipIn .4s ease;box-shadow:0 4px 20px rgba(0,0,0,.4);
}
@keyframes obTipIn{from{opacity:0;top:76px}to{opacity:1;top:88px}}
@keyframes obGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(21,101,192,0)}
  50%{box-shadow:0 0 0 4px rgba(21,101,192,.7),0 0 18px rgba(21,101,192,.35)}
}
.ob-glow { animation:obGlow 1.6s ease-in-out infinite; border-radius:8px; }

/* ===== TOGGLE VISTA (Eliminatoria / Grupos) ===== */
.vista-toggle { display:flex; gap:8px; justify-content:center; margin-bottom:22px; }
.vista-btn {
  font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:600;
  letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.6);
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:9px 18px; cursor:pointer; transition:all .2s;
}
.vista-btn:hover { color:#fff; border-color:rgba(255,255,255,.25); }
.vista-btn.active { color:#fff; background:rgba(21,101,192,.22); border-color:rgba(21,101,192,.5); }

/* ===== BRACKET ===== */
.bracket-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:10px; }
.bracket {
  --bk-gap:10px; --bkline:rgba(255,255,255,.16);
  display:flex; align-items:stretch; gap:var(--bk-gap);
  min-height:560px; width:max-content; margin:0 auto;
}
.bk-col { display:flex; flex-direction:column; flex:0 0 auto; width:104px; }
.bk-col.center { width:118px; justify-content:center; }
.bk-match {
  flex:1 1 0; position:relative; display:flex; flex-direction:column;
  justify-content:center; padding:5px 0;
}
.bk-card { background:var(--dark2); border:1px solid rgba(255,255,255,.08); border-radius:8px; overflow:hidden; }
.bk-team {
  display:flex; align-items:center; gap:5px; padding:5px 6px; text-decoration:none;
  color:rgba(255,255,255,.9);
}
.bk-team + .bk-team { border-top:1px solid rgba(255,255,255,.06); }
.bk-team img { width:18px; height:18px; object-fit:contain; flex-shrink:0; }
.bk-team .bk-name {
  font-family:'Barlow Condensed',sans-serif; font-size:11.5px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;
}
.bk-team .bk-score {
  font-family:'Bebas Neue',sans-serif; font-size:15px; min-width:16px; text-align:right;
  color:rgba(255,255,255,.85); white-space:nowrap;
}
.bk-team .bk-pen { font-size:11px; color:rgba(255,255,255,.55); }
.bk-team.winner .bk-pen { color:var(--gold); }
.bk-team.winner { background:rgba(245,197,24,.08); }
.bk-team.winner .bk-name, .bk-team.winner .bk-score { color:var(--gold); }
.bk-team.tbd { color:rgba(255,255,255,.32); }
.bk-team.tbd .bk-flag-q {
  width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.06);
  display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
}
a.bk-team:hover { background:rgba(21,101,192,.16); }

/* conectores */
.bk-col.has-child  .bk-match::after  { content:''; position:absolute; top:50%; left:100%;  width:var(--bk-gap); height:2px; background:var(--bkline); }
.bk-col.has-parent .bk-match::before { content:''; position:absolute; top:25%; right:100%; width:2px; height:50%; background:var(--bkline); }
.bk-col.side-right.has-child  .bk-match::after  { left:auto;  right:100%; }
.bk-col.side-right.has-parent .bk-match::before { right:auto; left:100%; }

/* final / bronce */
.bk-final-wrap { display:flex; flex-direction:column; align-items:stretch; gap:14px; }
.bk-trophy { font-size:30px; text-align:center; line-height:1; }
.bk-champion-lbl { font-family:'Bebas Neue',sans-serif; letter-spacing:3px; font-size:15px; color:var(--gold); text-align:center; }
.bk-bronze-lbl { font-family:'Barlow Condensed',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.45); text-align:center; margin-bottom:5px; }

/* popover (tap en mobile) */
#bk-pop-backdrop { display:none; position:fixed; inset:0; z-index:299; background:rgba(0,0,0,.45); }
#bk-pop {
  display:none; position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  z-index:300; width:min(340px,90vw);
  background:var(--dark3); border:1px solid rgba(255,255,255,.14);
  border-radius:14px; box-shadow:0 8px 32px rgba(0,0,0,.55); padding:16px 14px 14px;
}
#bk-pop .bkp-round { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--acento-light); text-align:center; margin-bottom:10px; }
#bk-pop .bkp-team { display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; text-decoration:none; color:#fff; background:rgba(255,255,255,.04); }
#bk-pop .bkp-team + .bkp-team { margin-top:8px; }
#bk-pop .bkp-team img { width:28px; height:28px; object-fit:contain; flex-shrink:0; }
#bk-pop .bkp-team .bkp-name { flex:1; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:16px; }
#bk-pop .bkp-team .bkp-score { font-family:'Bebas Neue',sans-serif; font-size:20px; white-space:nowrap; }
#bk-pop .bkp-team .bkp-pen { font-size:12px; color:rgba(255,255,255,.55); }
#bk-pop .bkp-team.winner .bkp-pen { color:var(--gold); }
#bk-pop .bkp-team.winner .bkp-name, #bk-pop .bkp-team.winner .bkp-score { color:var(--gold); }
#bk-pop .bkp-team.tbd { color:rgba(255,255,255,.4); }
#bk-pop .bkp-go { font-size:11px; color:rgba(255,255,255,.4); margin-left:auto; }
#bk-pop-close { position:absolute; top:6px; right:12px; background:none; border:none; color:rgba(255,255,255,.5); font-size:22px; cursor:pointer; line-height:1; }

/* ===== MOBILE: bracket condensado (solo escudos) ===== */
@media (max-width:720px) {
  .bracket { --bk-gap:5px; min-height:470px; }
  .bk-col { width:34px; }
  .bk-col.center { width:38px; }
  .bk-team { padding:4px 3px; justify-content:center; }
  .bk-team img { width:20px; height:20px; }
  .bk-team .bk-name, .bk-team .bk-score { display:none; }
  .bk-team.tbd .bk-flag-q { width:20px; height:20px; }
  .bk-champion-lbl { font-size:0; }
  .bk-bronze-lbl { font-size:0; margin-bottom:2px; }
  .bk-trophy { font-size:20px; }
}
</style>
</head>
<body>
<div id="ob-tip">👇 Elegí un equipo para empezar a jugar</div>

<!-- HEADER -->
<header id="site-header">
  <a class="logo-wrap" href="index.html">
    <img src="Logo.png" alt="TribunApp" style="height:56px;object-fit:contain;">
    <span class="header-chip">Mundial 2026</span>
  </a>

  <div class="header-actions">
    <a class="header-pill primary" href="fixture.html" data-help="Fixture del Mundial: todos los partidos por fase, con resultados en vivo y la ficha de cada partido.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

<script>
const GRUPOS_LETRAS = ['A','B','C','D','E','F','G','H','I','J','K','L'];

const NOMBRES_ES = {
  czechia:              'Chequia',
  mexico:               'México',
  southafrica:          'Sudáfrica',
  southkorea:           'Corea del Sur',
  bosniaandherzegovina: 'Bosnia y Herzegovina',
  canada:               'Canadá',
  qatar:                'Qatar',
  switzerland:          'Suiza',
  brazil:               'Brasil',
  haiti:                'Haití',
  morocco:              'Marruecos',
  scotland:             'Escocia',
  australia:            'Australia',
  paraguay:             'Paraguay',
  turkiye:              'Turquía',
  usa:                  'Estados Unidos',
  curacao:              'Curazao',
  ecuador:              'Ecuador',
  germany:              'Alemania',
  ivorycoast:           'Costa de Marfil',
  japan:                'Japón',
  netherlands:          'Países Bajos',
  sweden:               'Suecia',
  tunisia:              'Túnez',
  belgium:              'Bélgica',
  egypt:                'Egipto',
  iran:                 'Irán',
  newzealand:           'Nueva Zelanda',
  capeverde:            'Cabo Verde',
  saudiarabia:          'Arabia Saudita',
  spain:                'España',
  uruguay:              'Uruguay',
  france:               'Francia',
  iraq:                 'Irak',
  norway:               'Noruega',
  senegal:              'Senegal',
  algeria:              'Argelia',
  argentina:            'Argentina',
  austria:              'Austria',
  jordan:               'Jordania',
  colombia:             'Colombia',
  drcongo:              'Rep. D. del Congo',
  portugal:             'Portugal',
  uzbekistan:           'Uzbekistán',
  croatia:              'Croacia',
  england:              'Inglaterra',
  ghana:                'Ghana',
  panama:               'Panamá',
};

// Nombres cortos SOLO para los nodos del bracket (los largos se cortaban con "…").
// El popover y el resto de la app siguen usando NOMBRES_ES (nombre completo).
const NOMBRES_CORTO = {
  bosniaandherzegovina: 'Bosnia',
  drcongo:              'R.D. Congo',
  ivorycoast:           'C. Marfil',
  netherlands:          'P. Bajos',
  usa:                  'EE.UU.',
  saudiarabia:          'Arabia S.',
  southafrica:          'Sudáfrica',
  southkorea:           'Corea Sur',
  newzealand:           'N. Zelanda',
  capeverde:            'Cabo Verde',
};

const FASE_NOMBRES = {
  grupos: 'FASE DE GRUPOS',
  octavos: 'OCTAVOS DE FINAL',
  cuartos: 'CUARTOS DE FINAL',
  semis: 'SEMIFINALES',
  final: 'LA GRAN FINAL',
};

async function cargar() {
  try {
    const ts = Date.now();
    // Grupos: 100% estáticos (estado_torneo.json). Bracket: mundial.json.
    const [resEquipos, resEstado, resMundial] = await Promise.all([
      fetch(`data/equipos.json?t=${ts}`),
      fetch(`data/estado_torneo.json?t=${ts}`),
      fetch(`data/fixtures/mundial.json?t=${ts}`),
    ]);
    const equipos = await resEquipos.json();
    const estado  = await resEstado.json();
    const mundial = await resMundial.json();

    // Normalizar claves de tablas: "Stage - A" → "A" (y descartar "Stage")
    if (estado.tablas) {
      const normalized = {};
      for (const [k, v] of Object.entries(estado.tablas)) {
        const m = k.match(/([A-L])$/);
        if (m) normalized[m[1]] = v;
        else if (/^[A-L]$/.test(k)) normalized[k] = v;
      }
      estado.tablas = normalized;
    }

    renderBracket(mundial);
    renderGrupos(equipos, estado);
    _registrarEquiposModal(equipos);

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('contenido').style.display = '';
  } catch(e) {
    document.getElementById('loading-state').innerHTML =
      `<div class="loading-msg">Error cargando datos: ${e.message}</div>`;
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  BRACKET ELIMINATORIAS
// ══════════════════════════════════════════════════════════════════════════

// Orden del cuadro según el sorteo (mitad izquierda / derecha, de arriba a abajo).
const BRACKET = {
  left: [
    ['germany','paraguay'], ['france','sweden'],
    ['southafrica','canada'], ['netherlands','morocco'],
    ['portugal','croatia'], ['spain','austria'],
    ['usa','bosniaandherzegovina'], ['belgium','senegal'],
  ],
  right: [
    ['brazil','japan'], ['ivorycoast','norway'],
    ['mexico','ecuador'], ['england','drcongo'],
    ['australia','egypt'], ['switzerland','algeria'],
    ['argentina','capeverde'], ['colombia','ghana'],
  ],
};

let _bkMatches = [];   // cache de nodos para el popover (indexado por data-mi)

function _bkTeam(slug) {
  if (!slug) return null;
  return { slug, name: NOMBRES_ES[slug] || slug };
}

// Busca el partido entre dos slugs en mundial.json (sin importar local/visitante)
function _bkLookup(partidos, s1, s2) {
  if (!s1 || !s2) return null;
  return partidos.find(p => {
    const h = p.home?.slug, a = p.away?.slug;
    return (h === s1 && a === s2) || (h === s2 && a === s1);
  }) || null;
}

// Resuelve un nodo del cuadro: equipos + (si existe el partido) resultado y ganador
function _bkNode(homeSlug, awaySlug, partidos, round) {
  const node = {
    round, home: _bkTeam(homeSlug), away: _bkTeam(awaySlug),
    hscore: null, ascore: null, finished: false, winner: null, loser: null,
  };
  const m = _bkLookup(partidos, homeSlug, awaySlug);
  if (m && m.status && m.status.finished) {
    let hs, as, hp, ap;
    if (m.home.slug === homeSlug) { hs = m.home_score; as = m.away_score; hp = m.home_pen; ap = m.away_pen; }
    else                          { hs = m.away_score; as = m.home_score; hp = m.away_pen; ap = m.home_pen; }
    node.hscore = hs; node.ascore = as; node.hpen = hp; node.apen = ap; node.finished = true;
    // Ganador: usar m.winner (cubre penales/prórroga) si está; si no, por marcador.
    if (m.winner) {
      node.winner = m.winner;
      node.loser  = (m.winner === homeSlug) ? awaySlug : homeSlug;
    } else if (hs != null && as != null && hs !== as) {
      node.winner = hs > as ? homeSlug : awaySlug;
      node.loser  = hs > as ? awaySlug : homeSlug;
    }
  }
  return node;
}

// A partir de los nodos de una ronda, arma la siguiente (ganador vs ganador)
function _bkNext(children, partidos, round) {
  const out = [];
  for (let i = 0; i < children.length; i += 2) {
    out.push(_bkNode(children[i]?.winner, children[i + 1]?.winner, partidos, round));
  }
  return out;
}

function renderBracket(mundial) {
  const partidos = Array.isArray(mundial) ? mundial : (mundial.partidos || []);
  _bkMatches = [];

  const buildSide = (side) => {
    const r32 = BRACKET[side].map(([h, a]) => _bkNode(h, a, partidos, 'Dieciseisavos'));
    const r16 = _bkNext(r32, partidos, 'Octavos');
    const qf  = _bkNext(r16, partidos, 'Cuartos');
    const sf  = _bkNext(qf,  partidos, 'Semifinal');
    return { r32, r16, qf, sf };
  };
  const L = buildSide('left');
  const R = buildSide('right');
  const finalNode  = _bkNode(L.sf[0]?.winner, R.sf[0]?.winner, partidos, 'Final');
  const bronzeNode = _bkNode(L.sf[0]?.loser,  R.sf[0]?.loser,  partidos, '3er puesto');

  const col = (matches, cls) =>
    `<div class="bk-col ${cls}">${matches.map(_bkMatchHTML).join('')}</div>`;

  const centerHTML = `
    <div class="bk-col center">
      <div class="bk-final-wrap">
        <div class="bk-trophy">🏆</div>
        <div class="bk-champion-lbl">CAMPEÓN</div>
        ${_bkMatchHTML(finalNode)}
        <div>
          <div class="bk-bronze-lbl">3er puesto</div>
          ${_bkMatchHTML(bronzeNode)}
        </div>
      </div>
    </div>`;

  document.getElementById('bracket').innerHTML =
      col(L.r32, 'side-left has-child')
    + col(L.r16, 'side-left has-parent has-child')
    + col(L.qf,  'side-left has-parent has-child')
    + col(L.sf,  'side-left has-parent has-child')
    + centerHTML
    + col(R.sf,  'side-right has-parent has-child')
    + col(R.qf,  'side-right has-parent has-child')
    + col(R.r16, 'side-right has-parent has-child')
    + col(R.r32, 'side-right has-parent');
}

function _bkMatchHTML(node) {
  const mi = _bkMatches.length;
  _bkMatches.push(node);
  return `<div class="bk-match" data-mi="${mi}">
    <div class="bk-card">
      ${_bkTeamHTML(node.home, node.winner, node.hscore, node.hpen)}
      ${_bkTeamHTML(node.away, node.winner, node.ascore, node.apen)}
    </div>
  </div>`;
}

function _bkTeamHTML(team, winnerSlug, score, pen) {
  if (!team) {
    return `<div class="bk-team tbd"><span class="bk-flag-q">?</span><span class="bk-name">A definir</span></div>`;
  }
  const isW = winnerSlug === team.slug;
  const penTxt = (pen != null) ? ` <span class="bk-pen">(${pen})</span>` : '';
  const sc  = (score != null) ? `<span class="bk-score">${score}${penTxt}</span>` : '';
  const nombre = NOMBRES_CORTO[team.slug] || NOMBRES_ES[team.slug] || team.name;
  return `<a class="bk-team ${isW ? 'winner' : ''}" href="equipo.html?c=${team.slug}">
    <img src="escudos/${team.slug}.png" alt="${nombre}" onerror="this.style.opacity='.2'">
    <span class="bk-name">${nombre}</span>${sc}</a>`;
}

// ── Toggle de vista ───────────────────────────────────────────────────────
function cambiarVista(vista) {
  const esBracket = vista === 'bracket';
  document.getElementById('vista-bracket').style.display = esBracket ? '' : 'none';
  document.getElementById('vista-grupos').style.display  = esBracket ? 'none' : '';
  document.getElementById('btn-eliminatoria').classList.toggle('active', esBracket);
  document.getElementById('btn-grupos').classList.toggle('active', !esBracket);
}

// ── Popover de un cruce (tap en mobile) ───────────────────────────────────
function _abrirBkPop(node) {
  const teamRow = (team, winnerSlug, score, pen) => {
    if (!team) return `<div class="bkp-team tbd"><span class="bk-flag-q">?</span><span class="bkp-name">A definir</span></div>`;
    const isW = winnerSlug === team.slug;
    const nombre = NOMBRES_ES[team.slug] || team.name;
    const penTxt = (pen != null) ? ` <span class="bkp-pen">(${pen} pen)</span>` : '';
    const sc = (score != null) ? `<span class="bkp-score">${score}${penTxt}</span>` : '';
    return `<a class="bkp-team ${isW ? 'winner' : ''}" href="equipo.html?c=${team.slug}">
      <img src="escudos/${team.slug}.png" alt="${nombre}" onerror="this.style.opacity='.2'">
      <span class="bkp-name">${nombre}</span>${sc}<span class="bkp-go">ver ›</span></a>`;
  };
  document.getElementById('bk-pop-round').textContent = node.round || '';
  document.getElementById('bk-pop-body').innerHTML =
    teamRow(node.home, node.winner, node.hscore, node.hpen) + teamRow(node.away, node.winner, node.ascore, node.apen);
  document.getElementById('bk-pop').style.display = 'block';
  document.getElementById('bk-pop-backdrop').style.display = 'block';
}
function cerrarBkPop() {
  document.getElementById('bk-pop').style.display = 'none';
  document.getElementById('bk-pop-backdrop').style.display = 'none';
}
// En mobile: tap en un cruce abre el popover (en vez de navegar directo).
document.addEventListener('click', (e) => {
  const match = e.target.closest('#bracket .bk-match');
  if (!match) return;
  if (!window.matchMedia('(max-width:720px)').matches) return; // desktop: links directos
  e.preventDefault();
  const node = _bkMatches[+match.dataset.mi];
  if (node) _abrirBkPop(node);
});

function renderGrupos(equipos, estado) {
  const eliminados  = new Set((estado.eliminados || []).map(s => s.toLowerCase()));
  const clasificados = new Set((estado.clasificados || []).map(s => s.toLowerCase()));

  // Agrupar por letra
  const porGrupo = {};
  for (const eq of equipos) {
    if (!porGrupo[eq.grupo]) porGrupo[eq.grupo] = [];
    porGrupo[eq.grupo].push(eq);
  }

  const wrap = document.getElementById('grupos-wrap');
  wrap.innerHTML = '';

  for (const letra of GRUPOS_LETRAS) {
    const equiposGrupo = porGrupo[letra];
    if (!equiposGrupo) continue;

    // Obtener tabla del grupo (si existe) y ordenar por ella
    const tablaGrupo = (estado.tablas || {})[letra];

    const colhead = tablaGrupo
      ? `<div class="grupo-colhead"><span class="col-pts">Pts</span><span class="col-dg">Dif gol</span></div>`
      : '';

    const card = document.createElement('div');
    card.className = 'grupo-card';
    card.innerHTML = `
      <div class="grupo-header">
        <div class="grupo-letra">${letra}</div>
        <div class="grupo-titulo">Grupo ${letra}</div>
      </div>
      ${colhead}
      <div class="grupo-equipos" id="grupo-${letra}"></div>
    `;
    wrap.appendChild(card);

    const contenedor = card.querySelector(`#grupo-${letra}`);
    let equiposOrdenados = [...equiposGrupo];
    if (tablaGrupo) {
      const orden = {};
      tablaGrupo.forEach((t, i) => { orden[t.slug] = i; });
      equiposOrdenados.sort((a, b) => {
        const ia = orden[a.slug] ?? 99;
        const ib = orden[b.slug] ?? 99;
        return ia - ib;
      });
    }

    equiposOrdenados.forEach((eq, idx) => {
      const esEliminado   = eliminados.has(eq.slug);
      const esClasificado = clasificados.has(eq.slug);
      const statsEquipo   = tablaGrupo?.find(t => t.slug === eq.slug);
      const pos = idx + 1;
      const esTop = pos <= 2;

      const clases = ['equipo-row',
        esEliminado   ? 'eliminado'    : '',
        esClasificado ? 'clasificado'  : '',
        statsEquipo   ? 'tiene-stats'  : '',
      ].filter(Boolean).join(' ');

      const row = document.createElement('a');
      row.className = clases;
      row.href = esEliminado ? '#' : `equipo.html?c=${eq.slug}`;
      const nombreEs = NOMBRES_ES[eq.slug] || eq.nombre;

      let statsHTML = '';
      if (statsEquipo) {
        const dg = statsEquipo.dg ?? (statsEquipo.gf - statsEquipo.gc);
        const dgStr = dg > 0 ? `+${dg}` : `${dg}`;
        const dgClass = dg > 0 ? 'stat-dg pos' : dg < 0 ? 'stat-dg neg' : 'stat-dg';
        const ptsClass = pos === 1 ? 'stat-pts lider' : pos === 2 ? 'stat-pts segundo' : 'stat-pts';
        statsHTML = `
          <div class="equipo-stats">
            <span class="${ptsClass}" title="Puntos">${statsEquipo.pts ?? 0}</span>
            <span class="${dgClass}" title="Diferencia de goles">${dgStr}</span>
          </div>`;
      }

      row.innerHTML = `
        <span class="pos-num ${esTop ? 'top' : ''}">${pos}</span>
        <div class="flag-wrap">
          <img class="flag-img"
               src="escudos/${eq.slug}.png"
               alt="${nombreEs}"
               onerror="this.style.opacity='0.2'">
        </div>
        <span class="equipo-nombre">${nombreEs}</span>
        ${statsHTML}
      `;
      contenedor.appendChild(row);
    });
  }
}

cargar();

// ── Modal equipos (Jugar) ─────────────────────────────────────────────────
let _modalEquipos = [];

function abrirModalEquipos() {
  const modal = document.getElementById('modal-equipos');
  modal.style.display = 'flex';
  document.getElementById('modal-search').value = '';
  document.getElementById('modal-search').focus();
  _renderModalLista('');
}

function cerrarModalEquipos() {
  document.getElementById('modal-equipos').style.display = 'none';
}

function filtrarModalEquipos(q) {
  _renderModalLista(q.toLowerCase().trim());
}

function _renderModalLista(q) {
  const lista = document.getElementById('modal-lista');
  // Tomar equipos ya cargados del array global de grupos
  const todos = _modalEquipos;
  const filtrados = q ? todos.filter(e => e.nombre.toLowerCase().includes(q) || e.slug.includes(q)) : todos;
  lista.innerHTML = filtrados.map(e => `
    <a class="modal-row" href="equipo.html?c=${e.slug}">
      <img src="escudos/${e.slug}.png" alt="" onerror="this.style.opacity='.2'">
      <span class="modal-row-nombre">${e.nombre}</span>
      <span class="modal-row-arrow">›</span>
    </a>`).join('');
}

// Poblar _modalEquipos cuando cargar() termina (se llama desde renderGrupos)
function _registrarEquiposModal(equipos) {
  _modalEquipos = equipos
    .filter(e => e.slug && e.grupo)
    .map(e => ({ slug: e.slug, nombre: NOMBRES_ES[e.slug] || e.nombre || e.slug }))
    .sort((a, b) => a.nombre.localeCompare(b.nombre));
}

// ── Onboarding primera visita ────────────────────────────────────────────
(function(){
  const OB_KEY = 'tb_mundial_ob_v1';
  if (localStorage.getItem(OB_KEY)) return;

  function obDismiss() {
    const tip = document.getElementById('ob-tip');
    tip.style.transition = 'opacity .3s';
    tip.style.opacity = '0';
    setTimeout(() => tip.style.display = 'none', 300);
    document.querySelectorAll('.ob-glow').forEach(el => el.classList.remove('ob-glow'));
    localStorage.setItem(OB_KEY, '1');
  }

  function obInit() {
    if (localStorage.getItem(OB_KEY)) return; // ya visitó
    // Mostrar pill
    document.getElementById('ob-tip').style.display = 'flex';
    // Glow en Argentina dentro del bracket
    const arg = document.querySelector('#bracket a.bk-team[href*="argentina"]');
    if (arg) {
      arg.classList.add('ob-glow');
      setTimeout(() => arg.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }), 300);
    }
    // Auto-dismiss a los 5s
    setTimeout(obDismiss, 5000);
    // Dismiss al tocar el bracket
    document.getElementById('bracket').addEventListener('click', obDismiss, { once: true });
  }

  // Esperar a que cargar() renderice el bracket
  function waitGroups(n) {
    if (document.querySelector('#bracket a.bk-team[href*="argentina"]')) { obInit(); }
    else if (n > 0) setTimeout(() => waitGroups(n-1), 300);
  }
  setTimeout(() => waitGroups(15), 500);
})();
</script>
